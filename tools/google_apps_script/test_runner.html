<!doctype html>
<meta charset="utf-8">
<title>Warcraft Logs raid JSON tests</title>
<pre id="result">Tests did not run.</pre>
<script src="warcraft_logs_raid_json.js"></script>
<script>
  (function () {
    function equal(actual, expected, label) {
      if (actual !== expected) {
        throw new Error(label + ': expected ' + expected + ', got ' + actual);
      }
    }

    try {
      var mockReport = {
        code: 'TEST123',
        startTime: Date.UTC(2026, 7, 1, 18, 0, 0),
        endTime: Date.UTC(2026, 7, 1, 21, 0, 0),
        masterData: {actors: [
          {id: 1, name: 'Alice', server: 'RealmOne', subType: 'Priest'},
          {id: 2, name: 'Bob', server: 'RealmTwo', subType: 'Warrior'},
          {id: 3, name: 'TrashOnly', server: 'RealmOne', subType: 'Rogue'}
        ]},
        fights: [
          {id: 10, name: 'Trash', encounterID: 0, kill: false, friendlyPlayers: [1, 3]},
          {id: 11, name: 'Boss One', encounterID: 101, kill: true, friendlyPlayers: [1, 2]},
          {id: 12, name: 'Boss Two', encounterID: 102, kill: false, friendlyPlayers: [1]}
        ]
      };

      var raidDocument = buildRaidDocument_(mockReport, new Date('2026-08-02T00:00:00.000Z'));
      equal(raidDocument.raidId, 'TEST123', 'raidId');
      equal(raidDocument.summary.attendees, 2, 'attendee count');
      equal(raidDocument.summary.bossPulls, 2, 'boss pull count');
      equal(raidDocument.summary.kills, 1, 'kill count');
      equal(raidDocument.attendees[0].name, 'Alice', 'sort order');
      equal(raidDocument.attendees[0].attendancePercent, 100, 'Alice attendance');
      equal(raidDocument.attendees[1].attendancePercent, 50, 'Bob attendance');
      equal(extractReportCode_('https://www.warcraftlogs.com/reports/JLtYATQjzR9wc3mH'),
        'JLtYATQjzR9wc3mH', 'URL parsing');
      equal(extractReportCode_('not a report'), '', 'invalid ID rejection');
      var qualifiedNames = buildQualifiedAttendeeNames_({attendees: [
        {name: 'Excluded', attendancePercent: 25},
        {name: 'Included', attendancePercent: 25.01}
      ]}, 25);
      equal(qualifiedNames.length, 1, 'strict threshold count');
      equal(qualifiedNames[0], 'Included', 'strict threshold name');

      var raidInputs = [['RAID1'], ['RAID2'], ['RAID1'], [''], ['RAID3']];
      var outputValues = [[''], ['["Existing"]'], [''], [''], ['']];
      var outputFormulas = [[''], [''], [''], [''], ['=SOME_FORMULA()']];
      var generatedReportCount = 0;
      var originalGenerateRaidJson = generateRaidJson_;
      generateRaidJson_ = function (reportCode) {
        generatedReportCount += 1;
        return {qualifiedNames: [reportCode + 'Player']};
      };

      var mockSheet = {
        getLastRow: function () { return 6; },
        getRange: function (row, column, rowCount) {
          if (row === 2 && column === 5 && rowCount === 5) {
            return {getDisplayValues: function () { return raidInputs; }};
          }
          if (row === 2 && column === 6 && rowCount === 5) {
            return {
              getDisplayValues: function () { return outputValues; },
              getFormulas: function () { return outputFormulas; }
            };
          }
          if (column === 6 && typeof rowCount === 'undefined') {
            var outputIndex = row - 2;
            return {
              setNumberFormat: function () { return this; },
              setValue: function (value) { outputValues[outputIndex][0] = value; return this; },
              clearNote: function () { return this; },
              setNote: function () { return this; }
            };
          }
          throw new Error('Unexpected mock range: row ' + row + ', column ' + column);
        }
      };
      var mockSpreadsheet = {
        getSheetByName: function (name) {
          equal(name, 'raid_logs', 'production sheet name');
          return mockSheet;
        },
        toast: function () {}
      };
      window.LockService = {
        getDocumentLock: function () {
          return {tryLock: function () { return true; }, releaseLock: function () {}};
        }
      };
      window.SpreadsheetApp = {
        getActiveSpreadsheet: function () { return mockSpreadsheet; },
        flush: function () {}
      };

      var mainResult = main();
      generateRaidJson_ = originalGenerateRaidJson;
      equal(mainResult.processed, 2, 'main processed blank F rows');
      equal(generatedReportCount, 1, 'duplicate raid fetched once');
      equal(outputValues[0][0], '["RAID1Player"]', 'first blank F populated');
      equal(outputValues[1][0], '["Existing"]', 'existing F preserved');
      equal(outputValues[2][0], '["RAID1Player"]', 'duplicate row populated');
      equal(outputValues[4][0], '', 'formula-backed F preserved');

      document.getElementById('result').textContent =
        'PASS: 18 assertions\n\n' + JSON.stringify(raidDocument, null, 2);
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
    }
  }());
</script>
