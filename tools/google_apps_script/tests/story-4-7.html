<!doctype html>
<meta charset="utf-8">
<title>Story 4.7 tests</title>
<pre id="result">Tests did not run.</pre>
<script src="harness.js"></script>
<script src="helpers.js"></script>
<script src="../src/batch.js"></script>
<script src="../src/schema.js"></script>
<script src="../src/setup.js"></script>
<script src="../src/grids.js"></script>
<script src="../src/roster.js"></script>
<script src="../src/scores.js"></script>
<script src="../src/snapshot.js"></script>
<script src="../src/ledger.js"></script>
<script src="../src/attendance.js"></script>
<script>
  (function () {
    function findAwardBlockStart_(winner) {
      var header = TracerHarness.getRows('Awards')[0] || [];
      for (var start = 0; start < header.length; start += AWARDS_BLOCK_WIDTH) {
        if (String(header[start] || '') === winner) {
          return start;
        }
      }
      return -1;
    }

    function awardRowsForWinner_(winner) {
      var rows = TracerHarness.getRows('Awards');
      var start = findAwardBlockStart_(winner);
      if (start === -1) {
        return [];
      }
      var results = [];
      for (var rowIndex = AWARDS_FIRST_ROW - 1; rowIndex < rows.length; rowIndex += 1) {
        var row = rows[rowIndex] || [];
        var slice = row.slice(start, start + AWARDS_BLOCK_WIDTH);
        var nonEmpty = slice.some(function (value) {
          return !(value === '' || value === null || value === undefined);
        });
        if (nonEmpty) {
          results.push({ rowIndex: rowIndex, cells: slice });
        }
      }
      return results;
    }

    function presenceColumnByName_(name) {
      var header = TracerHarness.getRows('Présence')[0] || [];
      for (var index = PRESENCE_FIRST_RAIDER_COLUMN; index < header.length; index += 1) {
        if (header[index] === name) {
          return index;
        }
      }
      return -1;
    }

    try {
      var sampleText = loadTextSync_('../fixtures/custom-export-sample.txt');

      withHarness(function () {
        // Parser unit cases.
        var parsed = parseGargulExport_(sampleText);
        equal(parsed.lines.length, 5, 'parser keeps five JSON-valid unique-checksum lines');
        equal(parsed.rejected.length, 4, 'parser rejects bad json, both duplicate copies and bad itemID');
        equal(parsed.rejected.filter(function (row) { return row.checksum === 'csum-dup'; }).length, 2, 'every copy of a duplicate checksum is rejected');
        equal(parsed.lines.filter(function (line) { return line.treatment === ''; }).length >= 1, true, 'parser clears unknown treatment tokens');

        var nullLine = parseGargulExport_('null');
        equal(nullLine.rejected.length, 1, 'null line is rejected');
        contains(nullLine.rejected[0].reason, 'JSON invalide', 'null line reports invalid JSON');

        var quoted = parseGargulExport_('{"checksum":"q1","winner":"Ana","itemID":"777","os":0,"treatment":"BIS"}');
        equal(quoted.lines.length, 0, 'quoted itemID is rejected');
        contains(quoted.rejected[0].reason, 'itemID', 'quoted itemID reports itemID');

        var spaced = parseGargulExport_('{"checksum":"s1","winner":"Ana ","itemID":777,"os":0,"treatment":"BIS"}');
        equal(spaced.lines[0].winner, 'Ana ', 'parser keeps the winner untrimmed');

        var classBound = parseGargulExport_('{"checksum":"cb1","winner":"Ana","itemID":777,"os":0,"treatment":"CLASS_BOUND"}');
        equal(classBound.lines[0].treatment, 'CLASS_BOUND', 'CLASS_BOUND is a known treatment');
      });

      withHarness(function () {
        // Trimmed winner is not an exact Roster key.
        seedCoreTabs_();
        var spaced = parseGargulExport_('{"checksum":"s1","winner":"Ana ","itemID":777,"os":0,"treatment":"BIS"}');
        var validated = validateAwards_(spaced.lines, requireRosterIndex_(), readAwardsBlockNames_(TracerHarness.getRows('Awards')));
        equal(validated.lines.length, 0, 'winner with trailing space is rejected');
      });

      withHarness(function () {
        // Validation unit cases.
        seedCoreTabs_();
        var parsed = parseGargulExport_(sampleText);
        var validated = validateAwards_(parsed.lines, requireRosterIndex_(), readAwardsBlockNames_(TracerHarness.getRows('Awards')));
        equal(validated.lines.length, 3, 'validator keeps only roster winners with awards blocks');
        equal(validated.rejected.length, 2, 'validator rejects both winners not in Roster');
        var reasons = {};
        validated.rejected.forEach(function (row) { reasons[row.winner] = row.reason; });
        contains(reasons.Zed, 'absent du Roster', 'a winner who is not in Roster gets the roster reason');
        contains(reasons.Unknown, 'absent du Roster', 'unknown winner gets the roster reason');
      });

      withHarness(function () {
        // Preview matrix row.
        seedCoreTabs_();
        setStartedRaid_(5);
        var preview = previewEndRaidLoot(sampleText);
        equal(preview.awards.length, 3, 'preview returns three valid awards');
        equal(preview.rejected.length, 6, 'preview returns merged rejected lines');
        equal(preview.awards[0].itemName.length > 0, true, 'preview resolves item names from Objets tabs');
        var osAward = preview.awards.filter(function (award) { return award.os === 1; })[0];
        equal(osAward.treatment, 'ALT', 'preview forces os award treatment to ALT');
      });

      withHarness(function () {
        // Missing treatment matrix row.
        seedCoreTabs_();
        setStartedRaid_(5);
        saveWclCredentials('id', 'secret');
        queueWclSuccess_();

        var missingTreatmentText = '{"checksum":"m1","winner":"Ana","itemID":777,"rollType":"MS","os":0,"date":"2026-10-22","time":"21:00","raidId":"5","treatment":"@GPTREATMENT"},';
        var beforeAwards = JSON.stringify(TracerHarness.getRows('Awards'));
        var fetchesBefore = TracerHarness.getFetchLog().length;
        var failedMessage = '';
        try {
          submitEndRaid('ABC123', missingTreatmentText, {});
        } catch (error) {
          failedMessage = error.message;
        }
        contains(failedMessage, 'Choisissez un Traitement', 'missing treatment throws');
        equal(String(TracerHarness.getRows('Config')[1][columnOf_(tabByName_('Config'), 'openRaidId')]), '5', 'missing treatment keeps raid started');
        equal(JSON.stringify(TracerHarness.getRows('Awards')), beforeAwards, 'missing treatment writes nothing');
        equal(TracerHarness.getFetchLog().length, fetchesBefore, 'missing treatment does not call WCL');

        var clearedText = '{"checksum":"c1","winner":"Ana","itemID":777,"rollType":"MS","os":0,"date":"2026-10-22","time":"21:00","raidId":"5","treatment":"BIS"},';
        var clearedMessage = '';
        try {
          submitEndRaid('ABC123', clearedText, { c1: '' });
        } catch (error) {
          clearedMessage = error.message;
        }
        contains(clearedMessage, 'Choisissez un Traitement', 'cleared dropdown does not fall back to the line treatment');
      });

      withHarness(function () {
        // Empty box matrix row.
        seedCoreTabs_();
        setStartedRaid_(5);
        saveWclCredentials('id', 'secret');
        queueWclSuccess_();

        var beforeAwards = JSON.stringify(TracerHarness.getRows('Awards'));
        var message = submitEndRaid('ABC123', '', {});
        contains(message, 'Loots importés : 0', 'empty box imports no awards');
        equal(JSON.stringify(TracerHarness.getRows('Awards')), beforeAwards, 'empty box leaves awards unchanged');
      });

      withHarness(function () {
        // WCL failure matrix row with valid loot.
        seedCoreTabs_();
        setStartedRaid_(5);
        saveWclCredentials('id', 'secret');
        TracerHarness.setFetchResponses([
          { statusCode: 200, body: { access_token: 'token' } },
          { statusCode: 502, contentText: '<html>Bad gateway</html>' }
        ]);

        var beforeState = JSON.stringify({
          config: TracerHarness.getRows('Config'),
          presence: TracerHarness.getRows('Présence'),
          awards: TracerHarness.getRows('Awards')
        });
        var failedMessage = '';
        try {
          submitEndRaid('ABC123', sampleText, {
            'csum-ana-bis': 'BIS',
            'csum-ana-impact': 'IMPACT',
            'csum-bob-os': 'ALT'
          });
        } catch (error) {
          failedMessage = error.message;
        }
        contains(failedMessage, 'HTTP 502', 'wcl failure returned');
        equal(JSON.stringify({
          config: TracerHarness.getRows('Config'),
          presence: TracerHarness.getRows('Présence'),
          awards: TracerHarness.getRows('Awards')
        }), beforeState, 'wcl failure writes nothing');
      });

      withHarness(function () {
        // Happy path + rejected lines + OS forced ALT matrix rows.
        seedCoreTabs_();
        setStartedRaid_(5);
        saveWclCredentials('id', 'secret');
        queueWclSuccess_();

        var message = submitEndRaid('ABC123', sampleText, {
          'csum-ana-bis': 'BIS',
          'csum-ana-impact': 'IMPACT',
          'csum-bob-os': 'BIS'
        });

        contains(message, 'Loots importés : 3', 'happy path imported count');
        contains(message, 'Lignes de loot rejetées', 'happy path reports rejected lines');
        contains(message, 'csum-dup', 'rejected details include the checksum');
        contains(message, 'Checksum en double', 'rejected details include the reason');

        var anaAwards = awardRowsForWinner_('Ana');
        var bobAwards = awardRowsForWinner_('Bob');
        equal(anaAwards.length, 2, 'happy path writes two awards for Ana');
        equal(bobAwards.length, 1, 'happy path writes one award for Bob');
        equal(String(anaAwards[0].cells[1]), 'Bâton ancien', 'item name resolved for 777');
        equal(String(anaAwards[1].cells[1]), 'Anneau céleste', 'item name resolved for 888');
        equal(String(bobAwards[0].cells[1]), 'Cape de l\'export', 'export item name used when Objets has none');
        equal(String(bobAwards[0].cells[AWARDS_TREATMENT_OFFSET]), 'ALT', 'os row is forced to ALT');
        equal(String(anaAwards[0].cells[AWARDS_TREATMENT_OFFSET]), 'BIS', 'chosen Traitement written');
        equal(String(anaAwards[1].cells[AWARDS_TREATMENT_OFFSET]), 'IMPACT', 'second chosen Traitement written');
        equal(String(anaAwards[0].cells[AWARDS_RAID_ID_OFFSET]), '5', 'Raid (ID) written');

        var presenceRows = TracerHarness.getRows('Présence');
        var presenceRaid = presenceRows.filter(function (row, index) {
          return index >= PRESENCE_FIRST_RAID_ROW - 1 && String((row || [])[0]) === '5';
        })[0];
        equal(bobAwards[0].cells[AWARDS_DATE_OFFSET], presenceRaid[PRESENCE_DATE_COLUMN], 'award date matches presence date');
        equal(String(TracerHarness.getRows('Config')[1][columnOf_(tabByName_('Config'), 'openRaidId')]), '', 'raid closed after successful submit');
        equal(presenceRaid[presenceColumnByName_('Ana')], 1, 'presence imported in same batch');
      });

      withHarness(function () {
        // Existing awards matrix row.
        seedCoreTabs_();
        setStartedRaid_(5);
        saveWclCredentials('id', 'secret');
        queueWclSuccess_();

        var spreadsheet = SpreadsheetApp.getActive();
        var awardsSheetId = spreadsheet.getSheetByName('Awards').getSheetId();
        var anaStart = findAwardBlockStart_('Ana');
        writeCells_(awardsSheetId, AWARDS_FIRST_ROW - 1, anaStart, ['old-date', 'Old Item', 123, 'ALT', 4]);

        var singleAward = '{"checksum":"append-1","winner":"Ana","itemID":777,"rollType":"MS","os":0,"date":"2026-10-22","time":"22:00","raidId":"5","treatment":"BIS"},';
        submitEndRaid('ABC123', singleAward, { 'append-1': 'BIS' });
        var anaAwards = awardRowsForWinner_('Ana');
        equal(anaAwards.length, 2, 'new award appends below existing row');
        equal(String(anaAwards[0].cells[1]), 'Old Item', 'existing row kept');
        equal(String(anaAwards[1].cells[1]), 'Bâton ancien', 'new row appended');
      });

      withHarness(function () {
        // Raid ID matrix rows (AD-6): only the open raid's lines are imported.
        var lines = parseGargulExport_([
          '{"checksum":"r5","winner":"Ana","itemID":777,"os":0,"raidId":"5","treatment":"BIS"},',
          '{"checksum":"r4","winner":"Ana","itemID":777,"os":0,"raidId":"4","treatment":"BIS"},',
          '{"checksum":"rEmpty","winner":"Ana","itemID":777,"os":0,"raidId":"","treatment":"BIS"},',
          '{"checksum":"rToken","winner":"Ana","itemID":777,"os":0,"raidId":"@GPRAID","treatment":"BIS"},',
          '{"checksum":"rMissing","winner":"Ana","itemID":777,"os":0,"treatment":"BIS"},'
        ].join('\n')).lines;
        var checked = validateRaidIds_(lines, 5);
        equal(checked.lines.map(function (line) { return line.checksum; }).join(','), 'r5', 'only the open raid line is kept (numeric Config value)');
        equal(checked.rejected.length, 4, 'other raid, empty, @GPRAID and missing raidId are rejected');
        var reasons = {};
        checked.rejected.forEach(function (row) { reasons[row.checksum] = row.reason; });
        contains(reasons.r4, 'raidId "4" au lieu du raid en cours 5', 'other raid reason names both IDs');
        contains(reasons.rEmpty, 'raidId non rempli', 'empty raidId reason');
        contains(reasons.rToken, 'raidId non rempli', 'unfilled @GPRAID reason');
        contains(reasons.rMissing, 'Tapez 5 dans la ligne ou supprimez-la', 'reason tells the owner what to do');
      });

      withHarness(function () {
        // A line from another raid is listed in the preview and never written by End raid.
        seedCoreTabs_();
        setStartedRaid_(5);
        var otherRaidLine = '{"checksum":"old-1","winner":"Ana","itemID":777,"rollType":"MS","os":0,"date":"2026-10-15","time":"21:00","raidId":"4","treatment":"BIS"},';
        var preview = previewEndRaidLoot(otherRaidLine);
        equal(preview.awards.length + '|' + preview.rejected.length, '0|1', 'preview lists the other-raid line as rejected');
        contains(preview.rejected[0].reason, 'au lieu du raid en cours 5', 'preview gives the raid reason');

        var noRaidError = '';
        writeCells_(SpreadsheetApp.getActive().getSheetByName('Config').getSheetId(), 1, columnOf_(tabByName_('Config'), 'openRaidId'), ['']);
        try {
          previewEndRaidLoot(otherRaidLine);
        } catch (error) {
          noRaidError = error.message;
        }
        contains(noRaidError, 'Lancez d\'abord Raid > Démarrer', 'preview refuses when no raid is open');
        setStartedRaid_(5);

        saveWclCredentials('id', 'secret');
        queueWclSuccess_();
        var beforeAwards = JSON.stringify(TracerHarness.getRows('Awards'));
        var message = submitEndRaid('ABC123', otherRaidLine, { 'old-1': 'BIS' });
        contains(message, 'Loots importés : 0', 'other-raid line is not imported');
        contains(message, 'old-1', 'other-raid line is reported');
        equal(JSON.stringify(TracerHarness.getRows('Awards')), beforeAwards, 'other-raid line writes no award');
      });

      document.getElementById('result').textContent = 'PASS: ' + testAssertions + ' assertions';
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
