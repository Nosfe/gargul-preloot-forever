<!doctype html>
<meta charset="utf-8">
<title>Story 4.1 tests</title>
<pre id="result">Tests did not run.</pre>
<script src="harness.js"></script>
<script src="../src/batch.js"></script>
<script src="../src/schema.js"></script>
<script src="../src/setup.js"></script>
<script src="../src/views.js"></script>
<script src="../src/roster.js"></script>
<script src="../src/attendance.js"></script>
<script src="../src/snapshot.js"></script>
<script src="../src/ledger.js"></script>
<script src="../src/tier.js"></script>
<script src="../src/menu.js"></script>
<script>
  (function () {
    var assertions = 0;

    function equal(actual, expected, label) {
      assertions += 1;
      if (actual !== expected) {
        throw new Error(label + ': expected ' + expected + ', got ' + actual);
      }
    }

    function contains(text, expectedSubstring, label) {
      assertions += 1;
      if (String(text).indexOf(expectedSubstring) === -1) {
        throw new Error(label + ': expected "' + text + '" to contain "' + expectedSubstring + '"');
      }
    }

    function menuItem(menu, label) {
      for (var i = 0; i < menu.items.length; i += 1) {
        var entry = menu.items[i];
        if (entry.type === 'item' && entry.label === label) {
          return entry;
        }
      }
      return null;
    }

    function firstSubMenu(menu) {
      for (var i = 0; i < menu.items.length; i += 1) {
        if (menu.items[i].type === 'submenu') {
          return menu.items[i].menu;
        }
      }
      return null;
    }

    try {
      TracerHarness.install();

      onOpen();
      var menu = TracerHarness.getLastMenu();
      equal(menu.caption, 'Loot priority', 'menu title');
      equal(Boolean(menuItem(menu, 'Set up / refresh workbook')), true, 'menu has setup action');
      equal(Boolean(menuItem(menu, 'Sync attendance')), true, 'menu has attendance action');
      equal(Boolean(menuItem(menu, 'Export raid snapshot')), true, 'menu has snapshot action');
      equal(Boolean(menuItem(menu, 'Import raid ledger')), true, 'menu has ledger action');
      equal(Boolean(menuItem(menu, 'Archive tier and activate next')), true, 'menu has tier action');
      var diagnosticsMenu = firstSubMenu(menu);
      equal(Boolean(diagnosticsMenu), true, 'menu has Diagnostics submenu');
      equal(diagnosticsMenu.caption, 'Diagnostics', 'submenu caption');
      equal(Boolean(menuItem(diagnosticsMenu, 'Test write')), true, 'Diagnostics has Test write');
      equal(Boolean(menuItem(diagnosticsMenu, 'Test failed write')), true, 'Diagnostics has Test failed write');
      menu.items.concat(diagnosticsMenu.items).forEach(function (entry) {
        if (entry.type === 'item') {
          equal(typeof window[entry.functionName], 'function', 'handler exists for ' + entry.label);
        }
      });

      TracerHarness.clearAlerts();
      runDiagnosticsTestWrite();
      equal(TracerHarness.getRows('Diagnostics').length, 1, 'first diagnostics write appends first row');
      equal(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(TracerHarness.getRows('Diagnostics')[0][0]), true,
        'row has a local timestamp');
      equal(TracerHarness.getRows('Diagnostics')[0][1], 'test-write', 'row has the test-write marker');
      contains(TracerHarness.getAlerts().slice(-1)[0], 'completed', 'successful write alert');
      equal(TracerHarness.isLockHeld(), false, 'lock released after first write');

      TracerHarness.clearAlerts();
      runDiagnosticsTestWrite();
      equal(TracerHarness.getRows('Diagnostics').length, 2, 'second diagnostics write appends second row');
      contains(TracerHarness.getAlerts().slice(-1)[0], 'completed', 'second successful write alert');
      equal(TracerHarness.isLockHeld(), false, 'lock released after second write');

      var rowsBeforeFailure = TracerHarness.getRows('Diagnostics').length;
      TracerHarness.clearAlerts();
      runDiagnosticsTestFailedWrite();
      equal(TracerHarness.getRows('Diagnostics').length, rowsBeforeFailure,
        'forced failure keeps row count unchanged');
      contains(TracerHarness.getAlerts().slice(-1)[0], 'Diagnostics failed',
        'forced failure alert');
      equal(TracerHarness.isLockHeld(), false, 'lock released after failed write');

      TracerHarness.setLockBusy(true);
      var rowsBeforeBusy = TracerHarness.getRows('Diagnostics').length;
      TracerHarness.clearAlerts();
      runDiagnosticsTestWrite();
      equal(TracerHarness.getRows('Diagnostics').length, rowsBeforeBusy, 'busy lock prevents write');
      contains(TracerHarness.getAlerts().slice(-1)[0], 'Another action is already running',
        'busy lock alert');
      TracerHarness.setLockBusy(false);
      equal(TracerHarness.isLockHeld(), false, 'lock remains free after busy-lock attempt');

      var rowsBeforeStubs = TracerHarness.getRows('Diagnostics').length;
      TracerHarness.clearAlerts();
      runAttendanceSync();
      exportRaidSnapshot();
      importRaidLedger();
      archiveTierAndActivateNext();
      equal(TracerHarness.getRows('Diagnostics').length, rowsBeforeStubs, 'stubs do not write');
      var alerts = TracerHarness.getAlerts();
      equal(alerts.length, 4, 'one alert per stub');
      contains(alerts[0], '4.4', 'attendance stub references story 4.4');
      contains(alerts[1], '4.6', 'snapshot stub references story 4.6');
      contains(alerts[2], '4.7', 'ledger stub references story 4.7');
      contains(alerts[3], '4.8', 'tier stub references story 4.8');

      document.getElementById('result').textContent =
        'PASS: ' + assertions + ' assertions';
      TracerHarness.uninstall();
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
