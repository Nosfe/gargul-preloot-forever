<!doctype html>
<meta charset="utf-8">
<title>Story 4.1 tests</title>
<pre id="result">Tests did not run.</pre>
<script src="harness.js"></script>
<script src="../src/batch.js"></script>
<script src="../src/schema.js"></script>
<script src="../src/setup.js"></script>
<script src="../src/grids.js"></script>
<script src="../src/roster.js"></script>
<script src="../src/scores.js"></script>
<script src="../src/attendance.js"></script>
<script src="../src/snapshot.js"></script>
<script src="../src/ledger.js"></script>
<script src="../src/tier.js"></script>
<script src="../src/menu.js"></script>
<script>
  (function () {
    var assertions = 0;

    function equal(actual, expected, label) {
      assertions += 1;
      if (actual !== expected) {
        throw new Error(label + ': expected ' + expected + ', got ' + actual);
      }
    }

    function contains(text, expectedSubstring, label) {
      assertions += 1;
      if (String(text).indexOf(expectedSubstring) === -1) {
        throw new Error(label + ': expected "' + text + '" to contain "' + expectedSubstring + '"');
      }
    }

    function menuItem(menu, label) {
      for (var i = 0; i < menu.items.length; i += 1) {
        var entry = menu.items[i];
        if (entry.type === 'item' && entry.label === label) {
          return entry;
        }
      }
      return null;
    }

    try {
      TracerHarness.install();

      onOpen();
      var menu = TracerHarness.getLastMenu();
      equal(menu.caption, 'Loot priority', 'menu title');
      equal(Boolean(menuItem(menu, 'Set up / refresh workbook')), true, 'menu has setup action');
      equal(Boolean(menuItem(menu, 'Sync attendance')), true, 'menu has attendance action');
      equal(Boolean(menuItem(menu, 'Export raid snapshot')), true, 'menu has snapshot action');
      equal(Boolean(menuItem(menu, 'Import raid ledger')), true, 'menu has ledger action');
      equal(Boolean(menuItem(menu, 'Archive tier and activate next')), true, 'menu has tier action');
      equal(menu.items.filter(function (entry) { return entry.type === 'submenu'; }).length, 0,
        'menu has no Diagnostics submenu');
      menu.items.forEach(function (entry) {
        if (entry.type === 'item') {
          equal(typeof window[entry.functionName], 'function', 'handler exists for ' + entry.label);
        }
      });

      TracerHarness.seedSheet('BatchProbe', [['flag']], { sheetId: 42001 });
      var probeSheetId = SpreadsheetApp.getActive().getSheetByName('BatchProbe').getSheetId();

      TracerHarness.clearAlerts();
      applyBatch_(function () {
        return [{
          appendCells: {
            sheetId: probeSheetId,
            rows: [{ values: [{ userEnteredValue: { stringValue: 'ok-write' } }] }],
            fields: 'userEnteredValue'
          }
        }];
      });
      equal(TracerHarness.getRows('BatchProbe').length, 2, 'applyBatch write appends one row');
      equal(TracerHarness.getRows('BatchProbe')[1][0], 'ok-write', 'applyBatch write keeps row value');
      equal(TracerHarness.isLockHeld(), false, 'lock released after successful applyBatch');

      var rowsBeforeFailure = TracerHarness.getRows('BatchProbe').length;
      var failed = false;
      try {
        applyBatch_(function () {
          return [
            {
              appendCells: {
                sheetId: probeSheetId,
                rows: [{ values: [{ userEnteredValue: { stringValue: 'should-rollback' } }] }],
                fields: 'userEnteredValue'
              }
            },
            {
              appendCells: {
                sheetId: 919191,
                rows: [{ values: [{ userEnteredValue: { stringValue: 'fail' } }] }],
                fields: 'userEnteredValue'
              }
            }
          ];
        });
      } catch (error) {
        failed = true;
      }
      equal(failed, true, 'forced batch failure throws');
      equal(TracerHarness.getRows('BatchProbe').length, rowsBeforeFailure, 'forced failure is atomic');
      equal(TracerHarness.isLockHeld(), false, 'lock released after failed applyBatch');

      TracerHarness.setLockBusy(true);
      var rowsBeforeBusy = TracerHarness.getRows('BatchProbe').length;
      var busyError = '';
      try {
        applyBatch_(function () {
          return [{
            appendCells: {
              sheetId: probeSheetId,
              rows: [{ values: [{ userEnteredValue: { stringValue: 'blocked' } }] }],
              fields: 'userEnteredValue'
            }
          }];
        });
      } catch (error) {
        busyError = error.message;
      }
      contains(busyError, 'Another action is already running', 'busy lock throws lock message');
      equal(TracerHarness.getRows('BatchProbe').length, rowsBeforeBusy, 'busy lock prevents write');
      TracerHarness.setLockBusy(false);
      equal(TracerHarness.isLockHeld(), false, 'lock remains free after busy-lock attempt');

      var rowsBeforeStubs = TracerHarness.getRows('BatchProbe').length;
      TracerHarness.clearAlerts();
      runAttendanceSync();
      importRaidLedger();
      archiveTierAndActivateNext();
      equal(TracerHarness.getRows('BatchProbe').length, rowsBeforeStubs, 'stubs do not write');
      var alerts = TracerHarness.getAlerts();
      equal(alerts.length, 3, 'one alert per remaining stub');
      contains(alerts[0], '4.4', 'attendance stub references story 4.4');
      contains(alerts[1], '4.7', 'ledger stub references story 4.7');
      contains(alerts[2], '4.8', 'tier stub references story 4.8');

      document.getElementById('result').textContent =
        'PASS: ' + assertions + ' assertions';
      TracerHarness.uninstall();
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
