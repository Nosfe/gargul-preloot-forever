<!doctype html>
<meta charset="utf-8">
<title>Story 4.2 tests</title>
<pre id="result">Tests did not run.</pre>
<script src="harness.js"></script>
<script src="../src/batch.js"></script>
<script src="../src/schema.js"></script>
<script src="../src/setup.js"></script>
<script src="../src/grids.js"></script>
<script src="../src/roster.js"></script>
<script>
  (function () {
    var assertions = 0;

    function equal(actual, expected, label) {
      assertions += 1;
      if (actual !== expected) {
        throw new Error(label + ': expected ' + expected + ', got ' + actual);
      }
    }

    function truthy(value, label) {
      assertions += 1;
      if (!value) {
        throw new Error(label + ': expected truthy value');
      }
    }

    function contains(text, expectedSubstring, label) {
      assertions += 1;
      if (String(text).indexOf(expectedSubstring) === -1) {
        throw new Error(label + ': expected "' + text + '" to contain "' + expectedSubstring + '"');
      }
    }

    function withHarness(fn) {
      TracerHarness.install();
      try {
        fn();
      } finally {
        TracerHarness.uninstall();
      }
    }

    // Seeds every flat contract tab with its key header row, except the names in `skip`.
    function seedCoreFlatTabs(skip) {
      TABS.forEach(function (tab) {
        if ((skip || []).indexOf(tab.name) !== -1) {
          return;
        }
        TracerHarness.seedSheet(tab.name, [keysOf_(tab)]);
      });
    }

    function seedLegacyMigrationWorkbook(skip) {
      seedCoreFlatTabs(skip);
      TracerHarness.seedSheet('Attendance', [['raidId', 'raiderKey']]);
      TracerHarness.seedSheet('Bench', [['raidId', 'raiderKey']]);
      TracerHarness.seedSheet('Awards', [['checksum', 'raidId', 'tierId', 'bisWindowId', 'raiderKey', 'itemID', 'rollType', 'os', 'date', 'time', 'treatment']]);
      TracerHarness.seedSheet('TierItems', [
        ['tierId', 'itemID', 'itemName', 'class', 'spec', 'status', 'simGainFraction'],
        ['Tank', '', '', '', '', '', ''],
        ['Heal', '', '', '', '', '', '']
      ]);
      TracerHarness.seedSheet('Présence', [['legacy']], { sheetId: 1101 });
      TracerHarness.seedSheet('Butin', [['legacy']], { sheetId: 1102 });
    }

    function validationForColumn(meta, columnIndex) {
      for (var i = 0; i < meta.dataValidations.length; i += 1) {
        var range = meta.dataValidations[i].range;
        // Skip range clears (no rule).
        if (range.startColumnIndex === columnIndex && meta.dataValidations[i].rule) {
          return meta.dataValidations[i].rule;
        }
      }
      return null;
    }

    function rosterLookupTests() {
      var index = buildRosterIndex_(
        [['raiderKey'], ['Ana'], ['ana']],
        [['rerollName', 'mainKey'], ['AnaAlt', 'Ana']]
      );

      equal(findRaiderKey_(index, 'Ana'), 'Ana', 'exact key lookup for Ana');
      equal(findRaiderKey_(index, 'ana'), 'ana', 'exact key lookup for ana');
      equal(findRaiderKey_(index, 'ANA'), null, 'lookup does not case-fold');
      equal(resolveAttendanceKey_(index, 'AnaAlt'), 'Ana', 'attendance resolves reroll to main');
      equal(resolveAttendanceKey_(index, 'Ana'), 'Ana', 'attendance keeps direct raider key');
    }

    try {
      withHarness(function () {
        seedLegacyMigrationWorkbook(['Roster']);
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', ''],
          ['Bob', 'Prêtre', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        equal(TracerHarness.getRows('Attendance').length, 0, 'Attendance deleted');
        equal(TracerHarness.getRows('Bench').length, 0, 'Bench deleted');
        equal(TracerHarness.getRows('Butin').length, 0, 'Butin deleted');
        equal(TracerHarness.getRows('Présence')[0][0], 'Raid (ID)', 'Présence grid created');
        equal(TracerHarness.getRows('Awards')[1][0], 'Date', 'Awards grid created');
        equal(TracerHarness.getRows('TierItems')[2][0], 'Objet (ID)', 'TierItems grid created');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Bench', [['raidId', 'raiderKey'], ['R1', 'Ana']]);

        setUpWorkbook();

        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Workbook setup failed', 'abort alert exists');
        contains(alert, 'Bench', 'abort alert names Bench');
        equal(TracerHarness.getRows('Bench')[1].join(','), 'R1,Ana', 'abort keeps the Bench row');
        equal(TracerHarness.getSheetMeta('Présence'), null, 'abort creates no Présence');
        equal(TracerHarness.getSheetMeta('_Listes'), null, 'abort creates no _Listes');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Awards', [
          ['Checksum Gargul', 'Raid (ID)'],
          ['c1', 'R1']
        ]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Awards', 'old flat Awards with data aborts');
        equal(TracerHarness.getRows('Awards')[1][0], 'c1', 'old Awards data kept');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('TierItems', [
          ['Palier', 'Objet (ID)', 'Objet'],
          ['Tank', '', ''],
          ['t1', '19019', 'Thunderfury']
        ]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'TierItems', 'old flat TierItems with an item aborts');
        equal(TracerHarness.getRows('TierItems')[2][1], '19019', 'old TierItems item kept');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', ''],
          ['Bob', 'Mage', '', 'Heal', '', '', '']
        ]);
        setUpWorkbook();

        // Blank Présence header between two raiders: names must not shift onto other columns.
        var presenceId = SpreadsheetApp.getActive().getSheetByName('Présence').getSheetId();
        Sheets.Spreadsheets.batchUpdate({ requests: [
          { updateCells: { start: { sheetId: presenceId, rowIndex: 0, columnIndex: 3 }, rows: [{ values: [
            { userEnteredValue: { stringValue: 'Ana' } },
            { userEnteredValue: { stringValue: '' } },
            { userEnteredValue: { stringValue: 'Bob' } }
          ] }], fields: 'userEnteredValue' } },
          { updateSheetProperties: { properties: { sheetId: presenceId, gridProperties: { columnCount: 40 } }, fields: 'gridProperties.columnCount' } }
        ] }, SpreadsheetApp.getActive().getId());

        setUpWorkbook();
        var header = TracerHarness.getRows('Présence')[0];
        equal(header[3] + '|' + header[4] + '|' + header[5], 'Ana||Bob', 'blank header keeps its slot; Bob stays in column F');
        equal(TracerHarness.getSheetMeta('Présence').columnCount, 40, 'refresh never shrinks the grid');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', ''],
          ['Bob', 'Prêtre', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        var presenceRows = TracerHarness.getRows('Présence');
        var presenceMeta = TracerHarness.getSheetMeta('Présence');
        equal(presenceRows[0][3], 'Ana', 'Présence D1 is first raider');
        equal(presenceRows[0][4], 'Bob', 'Présence E1 is second raider');
        equal(presenceRows[1][3], '=COUNTIF(D3:D,1)+COUNTIF(D3:D,"B")', 'Présence total formula in D2');
        equal(presenceMeta.frozenRowCount, 2, 'Présence freezes 2 rows');
        equal(presenceMeta.frozenColumnCount, 3, 'Présence freezes 3 columns');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        var presenceSheetId = SpreadsheetApp.getActive().getSheetByName('Présence').getSheetId();
        Sheets.Spreadsheets.batchUpdate({
          requests: [
            {
              appendCells: {
                sheetId: presenceSheetId,
                rows: [
                  {
                    values: [
                      { userEnteredValue: { stringValue: 'R1' } },
                      { userEnteredValue: { stringValue: 'MC' } },
                      { userEnteredValue: { stringValue: '2026-01-01' } },
                      { userEnteredValue: { stringValue: '1' } }
                    ]
                  }
                ],
                fields: 'userEnteredValue'
              }
            }
          ]
        }, SpreadsheetApp.getActive().getId());

        var rosterSheetId = SpreadsheetApp.getActive().getSheetByName('Roster').getSheetId();
        Sheets.Spreadsheets.batchUpdate({
          requests: [
            {
              appendCells: {
                sheetId: rosterSheetId,
                rows: [
                  {
                    values: [
                      { userEnteredValue: { stringValue: 'Cid' } },
                      { userEnteredValue: { stringValue: 'Mage' } },
                      { userEnteredValue: { stringValue: '' } },
                      { userEnteredValue: { stringValue: 'Caster DPS' } }
                    ]
                  }
                ],
                fields: 'userEnteredValue'
              }
            }
          ]
        }, SpreadsheetApp.getActive().getId());

        setUpWorkbook();

        var rows = TracerHarness.getRows('Présence');
        equal(rows[0][4], 'Cid', 'new raider column appended');
        equal(rows[2][3], '1', 'existing Ana values preserved');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', ''],
          ['Bob', 'Prêtre', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        var awardsRows = TracerHarness.getRows('Awards');
        var awardsMeta = TracerHarness.getSheetMeta('Awards');
        equal(awardsRows[0][0], 'Ana', 'Awards first block owner');
        equal(awardsRows[0][5], 'Bob', 'Awards second block owner');
        equal(awardsRows[1][0], 'Date', 'Awards row 2 Date header');
        equal(awardsRows[1][4], 'Raid (ID)', 'Awards row 2 Raid header');
        truthy(awardsMeta.dataValidations.length >= 2, 'Awards traitement validation exists');
        equal(awardsMeta.frozenRowCount, 2, 'Awards freezes 2 rows');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        var awardsSheetId = SpreadsheetApp.getActive().getSheetByName('Awards').getSheetId();
        Sheets.Spreadsheets.batchUpdate({
          requests: [
            {
              appendCells: {
                sheetId: awardsSheetId,
                rows: [
                  {
                    values: [
                      { userEnteredValue: { stringValue: '2026-01-02' } },
                      { userEnteredValue: { stringValue: 'Obj' } },
                      { userEnteredValue: { stringValue: '123' } },
                      { userEnteredValue: { stringValue: 'BIS' } },
                      { userEnteredValue: { stringValue: 'R1' } }
                    ]
                  }
                ],
                fields: 'userEnteredValue'
              }
            }
          ]
        }, SpreadsheetApp.getActive().getId());

        var rosterSheetId = SpreadsheetApp.getActive().getSheetByName('Roster').getSheetId();
        Sheets.Spreadsheets.batchUpdate({
          requests: [
            {
              appendCells: {
                sheetId: rosterSheetId,
                rows: [
                  {
                    values: [
                      { userEnteredValue: { stringValue: 'Cid' } },
                      { userEnteredValue: { stringValue: 'Mage' } },
                      { userEnteredValue: { stringValue: '' } },
                      { userEnteredValue: { stringValue: 'Caster DPS' } }
                    ]
                  }
                ],
                fields: 'userEnteredValue'
              }
            }
          ]
        }, SpreadsheetApp.getActive().getId());

        setUpWorkbook();

        var awardsRows = TracerHarness.getRows('Awards');
        equal(awardsRows[0][5], 'Cid', 'new awards block appended');
        equal(awardsRows[2][0], '2026-01-02', 'existing awards entry kept');
      });

      withHarness(function () {
        seedCoreFlatTabs();

        setUpWorkbook();

        var tierRows = TracerHarness.getRows('TierItems');
        var tierMeta = TracerHarness.getSheetMeta('TierItems');
        equal(tierMeta.columnCount, 58, 'TierItems has 58 columns');
        equal(tierRows[0][2], 'Tank', 'TierItems row 1 role group starts with Tank');
        equal(tierRows[1][2], 'Guerrier Protection', 'TierItems row 2 first spec label');
        equal(tierRows[2][2], 'Gain (%)', 'TierItems row 3 gain label');
        truthy(tierMeta.dataValidations.length > 10, 'TierItems status validations exist');
        truthy(tierMeta.conditionalFormatRules.length > 10, 'TierItems gain rules exist');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        var specRule = validationForColumn(rosterMeta, columnOf_(tabByName_('Roster'), 'spec'));
        equal(specRule.condition.type, 'ONE_OF_RANGE', 'Roster spec uses ONE_OF_RANGE');
        contains(specRule.condition.values[0].userEnteredValue, "'_Listes'!$F2:$H2", 'Roster spec points to row helper range');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', '']
        ]);

        setUpWorkbook();

        var before = {
          merges: TracerHarness.getSheetMeta('Awards').merges.length,
          borders: TracerHarness.getSheetMeta('Awards').borders.length,
          rules: TracerHarness.getSheetMeta('TierItems').conditionalFormatRules.length
        };

        setUpWorkbook();

        var after = {
          merges: TracerHarness.getSheetMeta('Awards').merges.length,
          borders: TracerHarness.getSheetMeta('Awards').borders.length,
          rules: TracerHarness.getSheetMeta('TierItems').conditionalFormatRules.length
        };

        equal(after.merges, before.merges, 'rerun keeps merge count stable');
        equal(after.borders, before.borders, 'rerun keeps border count stable');
        equal(after.rules, before.rules, 'rerun keeps rule count stable');
      });

      withHarness(function () {
        rosterLookupTests();
      });

      withHarness(function () {
        var duplicateIndex = buildRosterIndex_(
          [['raiderKey'], ['Ana'], ['Ana']],
          [['rerollName', 'mainKey']]
        );
        truthy(duplicateIndex.errors.length > 0, 'duplicate roster key reports error');
        contains(duplicateIndex.errors[0], 'duplicate key "Ana"', 'duplicate key includes key name');

        var badReroll = buildRosterIndex_(
          [['raiderKey'], ['Ana'], ['Mira']],
          [['rerollName', 'mainKey'], ['Ana', 'Ana'], ['AltOne', 'MissingMain'], ['AltOne', 'Mira']]
        );
        contains(badReroll.errors[0], 'must not match a roster key', 'reroll name collision error');
        contains(badReroll.errors[1], 'is not in roster keys', 'missing main key error');
        contains(badReroll.errors[2], 'duplicate rerollName', 'duplicate reroll error');

        var whitespaceIndex = buildRosterIndex_([['raiderKey'], ['Ana ']], [['rerollName', 'mainKey']]);
        contains(whitespaceIndex.errors[0], 'leading/trailing whitespace', 'whitespace error mentions reason');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
          ['Ana', 'Mage', '', 'Heal', '', '', ''],
          ['Bob', 'Mage', '', 'Heal', '', '', '']
        ]);
        setUpWorkbook();

        var awardsMeta = TracerHarness.getSheetMeta('Awards');
        var traitement = awardsMeta.dataValidations.filter(function (entry) {
          return entry.range.startColumnIndex === 8 && entry.rule;
        })[0];
        equal(traitement.rule.condition.values.map(function (v) { return v.userEnteredValue; }).join(','), 'BIS,IMPACT,NONE', 'Bob block Traitement dropdown (column I)');
        equal(awardsMeta.merges.map(function (m) { return m.startColumnIndex + '-' + m.endColumnIndex; }).join(','), '0-5,5-10', 'Awards blocks A-E and F-J');

        var tierRows = TracerHarness.getRows('TierItems');
        var roles = tierRows[0].filter(function (v) { return v; }).join(',');
        equal(roles, 'Tank,Heal,Melee DPS,Ranged DPS,Caster DPS', 'TierItems role groups in order');
        equal(tierRows[1].filter(function (v) { return v; }).length, 28, 'TierItems has 28 spec labels');
        var tierFormulas = TracerHarness.getSheetMeta('TierItems').conditionalFormatRules.map(function (rule) {
          return rule.booleanRule.condition.values[0].userEnteredValue;
        });
        equal(tierFormulas.indexOf('=C4<0') !== -1 && tierFormulas.indexOf('=C4>=1/50') !== -1, true, 'first gain column has red and green rules');
        equal(tierFormulas.length, 56, 'one red and one green rule per gain column');

        var lists = TracerHarness.getRows('_Listes');
        var mageRow = lists.filter(function (row) { return row[0] === 'Mage'; })[0];
        equal(mageRow.slice(1, 4).join(','), 'Arcanes,Feu,Givre', '_Listes Mage row offers only Arcanes, Feu, Givre');

        var rosterBefore = JSON.stringify(TracerHarness.getRows('Roster').slice(1));
        setUpWorkbook();
        equal(JSON.stringify(TracerHarness.getRows('Roster').slice(1)), rosterBefore, 're-run leaves Roster data unchanged');
      });

      withHarness(function () {
        setUpWorkbook();
        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        var formulaOf = function (rule) { return rule.booleanRule.condition.values[0].userEnteredValue; };
        contains(formulaOf(rosterMeta.conditionalFormatRules[0]), 'EXACT', 'duplicate-name highlight has top priority over class colours');
        var mageRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$B2="Mage"'; })[0];
        equal(JSON.stringify(mageRule.booleanRule.format.backgroundColor), JSON.stringify(rgbHex_('3FC7EB')), 'Mage colour');
        equal(TracerHarness.getSheetMeta('_Listes') !== null, true, '_Listes helper tab exists');
        contains(TracerHarness.getRows('_Listes')[1][5], 'XLOOKUP(Roster!B2', '_Listes row 2 looks up the Roster class');
        equal(TracerHarness.getRows('_Listes')[1].length, 6, '_Listes leaves G:H free for the spill');
      });

      withHarness(function () {
        var requests = buildSetupRequests_(Object.create(null), { sheets: [] }, ',');
        var listsIndex = -1;
        var firstSpecDropdown = -1;
        requests.forEach(function (request, index) {
          if (request.addSheet && request.addSheet.properties.title === '_Listes' && listsIndex === -1) {
            listsIndex = index;
          }
          var rule = request.setDataValidation && request.setDataValidation.rule;
          if (rule && rule.condition.type === 'ONE_OF_RANGE' && firstSpecDropdown === -1) {
            firstSpecDropdown = index;
          }
        });
        equal(listsIndex !== -1 && listsIndex < firstSpecDropdown, true, '_Listes is created before the Spé dropdown references it');
      });

      withHarness(function () {
        TracerHarness.setLocale('fr_FR');
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook layout applied', 'fr_FR setup succeeds');
        ['Roster', 'Rerolls', 'TierItems'].forEach(function (name) {
          TracerHarness.getSheetMeta(name).conditionalFormatRules.forEach(function (rule) {
            equal(rule.booleanRule.condition.values[0].userEnteredValue.indexOf(','), -1, 'fr ' + name + ' rule has no commas');
          });
        });
        contains(TracerHarness.getRows('_Listes')[1][5], ';', 'fr _Listes formula uses semicolons');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Config', [['tierId', 'Unexpected']]);
        TracerHarness.seedSheet('Marker', [['stable']]);
        setUpWorkbook();
        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Header conflict in tab "Config"', 'conflict names tab');
        equal(TracerHarness.getRows('Marker')[0][0], 'stable', 'conflict keeps existing values unchanged');
        equal(TracerHarness.getSheetMeta('TierItems'), null, 'conflict abort is atomic');
        equal(TracerHarness.isLockHeld(), false, 'lock released after conflict');
      });

      withHarness(function () {
        equal(classNames_().indexOf('Démoniste') !== -1, true, 'class names keep accents');
        equal(labelsOf_(tabByName_('Roster'))[2], 'Spé', 'labels keep accents');
        equal(SPEC_COLUMNS.length, 28, '28 spec columns as mapped');
        equal(SPEC_COLUMNS.filter(function (entry) { return entry.role === 'Caster DPS'; }).length, 9, '9 Caster DPS specs');
        equal(SPEC_COLUMNS.filter(function (entry) { return entry.spec === 'Combat farouche'; }).length, 2, 'Druide Combat farouche appears in Tank and Melee DPS');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Roster', [['raiderKey'], ['Ana'], ['Ana']]);
        TracerHarness.seedSheet('Rerolls', [['rerollName', 'mainKey']]);
        var threw = false;
        try {
          requireRosterIndex_();
        } catch (error) {
          threw = true;
          contains(error.message, 'duplicate key "Ana" at rows 2 and 3', 'requireRosterIndex_ names key and both rows');
        }
        equal(threw, true, 'requireRosterIndex_ throws on duplicate');

        var badReroll = buildRosterIndex_(
          [['raiderKey'], ['Ana'], ['Mira']],
          [['rerollName', 'mainKey'], ['Ana', 'Ana'], ['AltOne', 'MissingMain'], ['AltOne', 'Mira']]
        );
        equal(badReroll.errors.length, 3, 'bad reroll scenarios produce three errors');

        var whitespaceIndex = buildRosterIndex_([['raiderKey'], ['Ana ']], [['rerollName', 'mainKey']]);
        equal(whitespaceIndex.errors.length, 1, 'whitespace key rejected');
      });

      document.getElementById('result').textContent = 'PASS: ' + assertions + ' assertions';
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
