<!doctype html>
<meta charset="utf-8">
<title>Story 4.2 tests</title>
<pre id="result">Tests did not run.</pre>
<script src="harness.js"></script>
<script src="helpers.js"></script>
<script src="../src/batch.js"></script>
<script src="../src/schema.js"></script>
<script src="../src/setup.js"></script>
<script src="../src/grids.js"></script>
<script src="../src/roster.js"></script>
<script src="../src/scores.js"></script>
<script src="../src/reset.js"></script>
<script>
  (function () {
    // Seeds every flat contract tab with its key header row, except the names in `skip`.
    function seedCoreFlatTabs(skip) {
      TABS.forEach(function (tab) {
        if ((skip || []).indexOf(tab.name) !== -1) {
          return;
        }
        TracerHarness.seedSheet(tab.name, [keysOf_(tab)]);
      });
    }

    function validationForColumn(meta, columnIndex) {
      for (var i = 0; i < meta.dataValidations.length; i += 1) {
        var entry = meta.dataValidations[i];
        // Skip range clears (no rule).
        if (entry.range.startColumnIndex === columnIndex && entry.rule) {
          return entry.rule;
        }
      }
      return null;
    }

    function rosterLookupTests() {
      var index = buildRosterIndex_([['raiderKey'], ['Ana'], ['ana']]);

      equal(findRaiderKey_(index, 'Ana'), 'Ana', 'exact key lookup for Ana');
      equal(findRaiderKey_(index, 'ana'), 'ana', 'exact key lookup for ana');
      equal(findRaiderKey_(index, 'ANA'), null, 'lookup does not case-fold');
      equal(findRaiderKey_(index, 'AnaAlt'), null, 'a name not in Roster resolves to nothing');

      var duplicateIndex = buildRosterIndex_([['raiderKey'], ['Ana'], ['Ana']]);
      contains(duplicateIndex.errors[0], 'nom en double "Ana"', 'duplicate key includes key name');

      var whitespaceIndex = buildRosterIndex_([['raiderKey'], ['Ana ']]);
      contains(whitespaceIndex.errors[0], 'espace au début ou à la fin', 'whitespace error mentions reason');
    }

    try {
      withHarness(function () {
        seedCoreFlatTabs(['Roster', 'Raids']);
        TracerHarness.seedSheet('Roster', [
          keysOf_(tabByName_('Roster')),
          ['Ana', '', 'Mage', 'Givre', '', '80']
        ]);
        setUpWorkbook();

        var raids = TracerHarness.getRows('Raids')[0];
        equal(raids.slice(0, 5).join(','), 'Raid (ID),Instance,Date du raid,Rapports WCL,Import\u00e9 le', 'Raids headers');

        var roster = TracerHarness.getRows('Roster');
        equal(roster[0].slice(0, 6).join(','), 'Raider (nom exact en jeu),Groupe de raid,Classe,Sp\u00e9,R\u00f4le,Parse WCL moyen', 'Roster headers relabelled');
        equal(roster[1].slice(0, 4).join(',') + ',' + roster[1][5], 'Ana,,Mage,Givre,80', 'Roster spec kept plain, parse kept');
        contains(roster[1][4], "MATCH($C2&\"|\"&$D2,'_Listes'!$Q$2:$Q$200,0)", 'Roster R\u00f4le is the Classe|Sp\u00e9 lookup formula');
        contains(TracerHarness.getRows('_Listes')[1][6], 'XLOOKUP(Roster!C2', '_Listes spec lookup reads the Classe column');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Objets Heal', [
          ['', '', '', 'Heal'],
          ['', '', '', 'Paladin Sacr\u00e9'],
          ['Objet (ID)', 'Objet', 'Emplacement', 'Statut', 'Gain (DPS)']
        ]);

        setUpWorkbook();

        var rows = TracerHarness.getRows('Objets Heal');
        equal(rows[2][2], 'Emplacement', 'Objets row 3 has Emplacement in column C');
        equal(rows[2][3], 'Statut', 'Objets row 3 first of pair is Statut');
        equal(rows[2][4], 'Gain (DPS)', 'Objets row 3 second of pair is Gain (DPS)');

        var meta = TracerHarness.getSheetMeta('Objets Heal');
        var statusRule = validationForColumn(meta, 3);
        equal(statusRule.condition.values.map(function (value) { return value.userEnteredValue; }).join(','),
          'BIS,IMPACT,CLASS_BOUND,NORMAL', 'Objets statut values reduced');
        equal(validationForColumn(meta, 2).condition.values.length, ITEM_SLOTS.length, 'Emplacement dropdown on column C');
      });

      withHarness(function () {
        seedCoreFlatTabs();

        var order = buildSetupRequests_(readExistingHeadersByName_(), { sheets: [] }, ',')
          .filter(function (request) {
            return request.updateSheetProperties && request.updateSheetProperties.fields === 'index';
          })
          .map(function (request) {
            var id = request.updateSheetProperties.properties.sheetId;
            var name = null;
            ['Roster', 'Raids', 'Awards', 'Config', RANKING_TAB_NAME].forEach(function (candidate) {
              var sheet = SpreadsheetApp.getActive().getSheetByName(candidate);
              if (sheet && sheet.getSheetId() === id) {
                name = candidate;
              }
            });
            return name || id;
          });

        equal(order.join(','),
          'Roster,1011,1012,' + RANKING_TAB_NAME + ',1021,1022,1023,1024,1025,Raids,Config,1020',
          'tabs ordered as Roster, Pr\u00e9sence, Awards, Classement par objet, Objets, Raids, Config, _Listes');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Roster']);
        TracerHarness.seedSheet('Roster', [
          keysOf_(tabByName_('Roster')),
          ['Ana', '', 'Mage', '\u2744\ufe0f Givre', '\u271a Heal', '80']
        ]);

        setUpWorkbook();
        equal(TracerHarness.getRows('Roster')[1][3], 'Givre', 'spec icon removed on refresh');
        var before = JSON.stringify(TracerHarness.getRows('Roster'));

        setUpWorkbook();
        equal(JSON.stringify(TracerHarness.getRows('Roster')), before, 're-run keeps data unchanged');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Roster']);
        TracerHarness.seedSheet('Roster', [
          keysOf_(tabByName_('Roster')).concat(['Unexpected']),
          ['Ana', '', 'Mage', '', '', '', '', '', '', '', '', '', 'x']
        ]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Conflit d\'en-têtes dans l\'onglet "Roster"', 'Roster with an unknown column aborts');
        equal(TracerHarness.getRows('Roster')[1][12], 'x', 'unknown column data kept');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        setUpWorkbook();
        var lists = TracerHarness.getRows('_Listes');
        equal([11, 12, 13, 14].map(function (c) { return lists[1][c] || ''; }).join(''), '', '_Listes L:O stay empty');
        var priestRow = lists.filter(function (row) { return row[0] === 'Prêtre'; })[0];
        equal(priestRow.slice(1, 4).join(','), 'Discipline,Sacré,Ombre', 'Prêtre specs offered without icons');
      });

      withHarness(function () {
        // A name dropped from Roster: its Présence/Awards columns archive.
        seedCoreFlatTabs();
        seedRoster(['Ana', 'AnaAlt']);
        setUpWorkbook();
        seedRoster(['Ana']);
        setUpWorkbook();
        equal(TracerHarness.getRows('Pr\u00e9sence')[0].slice(3).filter(function (v) { return v; }).join('|'), 'Ana', 'dropped name left Pr\u00e9sence');
        equal(TracerHarness.getRows('Pr\u00e9sence (archive)')[0][3], 'AnaAlt', 'dropped name Pr\u00e9sence column archived');
        equal(TracerHarness.getRows('Awards (archive)')[0][0], 'AnaAlt', 'dropped name Awards block archived');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        setUpWorkbook();
        var caster = TracerHarness.getSheetMeta('Objets Caster DPS');
        var casterRows = TracerHarness.getRows('Objets Caster DPS');
        equal(casterRows[1].filter(function (v) { return v; }).length, 9, '9 Caster DPS spec labels');
        equal(caster.frozenRowCount + ':' + caster.frozenColumnCount, '3:3', 'Objets rows 1-3 and A-C frozen');
        equal(caster.conditionalFormatRules.length, 9 * 6, 'red and green gain rules plus 4 Statut colours per Caster spec');
        var casterStatusRules = caster.conditionalFormatRules.filter(function (rule) {
          return rule.ranges[0].startColumnIndex === OBJETS_FIRST_SPEC_COLUMN;
        }).map(function (rule) { return rule.booleanRule.condition.values[0].userEnteredValue; }).sort().join(' ');
        equal(casterStatusRules, '=D4="BIS" =D4="CLASS_BOUND" =D4="IMPACT" =D4="NORMAL"', 'Statut colours sit on the Statut column only');
        var specCount = 0;
        ITEM_TABS.forEach(function (itemTab) {
          specCount += TracerHarness.getRows(itemTab.name)[1].filter(function (v) { return v; }).length;
        });
        equal(specCount, 28, 'the five Objets tabs hold all 28 specs');
        equal(TracerHarness.getRows('Objets Melee DPS')[1].indexOf('Combat farouche (félin)') !== -1, true, 'feral cat under Melee DPS');
        equal(TracerHarness.getRows('Objets Tank')[1].filter(function (v) { return v; }).join(','),
          'Protection,Protection,Combat farouche (ours)', 'Tank specs show the spec name only');
        equal(TracerHarness.getSheetMeta('Présence').frozenRowCount + ':' + TracerHarness.getSheetMeta('Présence').frozenColumnCount, '2:3', 'Présence frozen');
        equal(TracerHarness.getSheetMeta('Awards').frozenRowCount, 2, 'Awards frozen');
        equal(labelsOf_(tabByName_('Roster'))[3], 'Spé', 'labels keep accents');
      });

      withHarness(function () {
        var requests = buildSetupRequests_(Object.create(null), { sheets: [] }, ',');
        var listsIndex = -1;
        var firstSpecDropdown = -1;
        requests.forEach(function (request, index) {
          if (request.addSheet && request.addSheet.properties.title === '_Listes' && listsIndex === -1) {
            listsIndex = index;
          }
          var rule = request.setDataValidation && request.setDataValidation.rule;
          if (rule && rule.condition.type === 'ONE_OF_RANGE' && firstSpecDropdown === -1) {
            firstSpecDropdown = index;
          }
        });
        equal(listsIndex !== -1 && listsIndex < firstSpecDropdown, true, '_Listes is created before the Spé dropdown references it');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        seedRoster(['Ana']);
        setUpWorkbook();
        var presenceId = SpreadsheetApp.getActive().getSheetByName('Présence').getSheetId();
        var awardsId = SpreadsheetApp.getActive().getSheetByName('Awards').getSheetId();
        var rosterId = SpreadsheetApp.getActive().getSheetByName('Roster').getSheetId();
        var text = function (v) { return { userEnteredValue: { stringValue: v } }; };
        Sheets.Spreadsheets.batchUpdate({ requests: [
          { appendCells: { sheetId: presenceId, rows: [{ values: [text('R1'), text('MC'), text('2026-01-01'), text('1')] }], fields: 'userEnteredValue' } },
          { appendCells: { sheetId: awardsId, rows: [{ values: [text('2026-01-02'), text('Obj'), text('123'), text('BIS'), text('R1')] }], fields: 'userEnteredValue' } },
          { appendCells: { sheetId: rosterId, rows: [{ values: [text('Cid'), text('Mage')] }], fields: 'userEnteredValue' } }
        ] }, SpreadsheetApp.getActive().getId());
        setUpWorkbook();
        var presence = TracerHarness.getRows('Présence');
        equal(presence[0][4] + '|' + presence[2][3], 'Cid|1', 'Présence appends Cid and keeps Ana values');
        var awards = TracerHarness.getRows('Awards');
        equal(awards[0][5] + '|' + awards[2][0], 'Cid|2026-01-02', 'Awards appends a Cid block and keeps the entry');
        equal(TracerHarness.getSheetMeta('Awards').merges.map(function (m) { return m.startColumnIndex + '-' + m.endColumnIndex; }).join(','), '0-5,5-10', 'Awards blocks A-E and F-J');
      });

      // Restored grid, refresh, locale and conflict tests (current Roster layout).
      function seedRoster(names) {
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster'))].concat(names.map(function (name) {
          return [name, '', 'Mage', '', '', ''];
        })));
      }

      withHarness(function () {
        seedCoreFlatTabs();
        seedRoster(['Ana', 'Bob']);
        setUpWorkbook();

        var presenceRows = TracerHarness.getRows('Pr\u00e9sence');
        equal(presenceRows[0][3] + ',' + presenceRows[0][4], 'Ana,Bob', 'Pr\u00e9sence raider columns');
        equal(presenceRows[1][3], '=COUNTIF(D3:D,1)+COUNTIF(D3:D,"B")', 'Pr\u00e9sence total formula in D2');
        var awardsRows = TracerHarness.getRows('Awards');
        equal(awardsRows[0][0] + ',' + awardsRows[0][5], 'Ana,Bob', 'Awards blocks per raider');
        var awardsMeta = TracerHarness.getSheetMeta('Awards');
        var traitement = awardsMeta.dataValidations.filter(function (entry) {
          return entry.range.startColumnIndex === 8 && entry.rule;
        })[0];
        equal(traitement.rule.condition.values.map(function (v) { return v.userEnteredValue; }).join(','), 'BIS,IMPACT,CLASS_BOUND,NORMAL', 'Bob block Traitement dropdown');
        equal(Object.keys(awardsMeta.hiddenColumns || {}).filter(function (key) { return awardsMeta.hiddenColumns[key]; }).sort().join(','),
          '4,9', 'Raid (ID) hidden in each Awards block');

        var tierRows = TracerHarness.getRows('Objets Tank');
        equal(tierRows[2][2] + ',' + tierRows[2][3] + ',' + tierRows[2][4], 'Emplacement,Statut,Gain (DPS)', 'Objets: Emplacement, then Statut then Gain');
        var tierMeta = TracerHarness.getSheetMeta('Objets Tank');
        var tierFormulas = tierMeta.conditionalFormatRules.map(function (rule) {
          return rule.booleanRule.condition.values[0].userEnteredValue;
        });
        equal(tierFormulas.indexOf('=E4<0') !== -1 && tierFormulas.indexOf('=E4>0') !== -1, true, 'gain rules on the second column of the pair');
        equal(validationForColumn(tierMeta, 4), null, 'no Statut dropdown left on the Gain column');

        var lists = TracerHarness.getRows('_Listes');
        var mageRow = lists.filter(function (row) { return row[0] === 'Mage'; })[0];
        equal(mageRow.slice(1, 4).join(','), 'Arcanes,Feu,Givre', '_Listes Mage specs have no icons');
        equal([7, 8, 9, 12, 13, 14].map(function (c) { return lists[1][c] || ''; }).join(''), '', '_Listes leaves the spill cells free');
        var druidRow = lists.filter(function (row) { return row[0] === 'Druide'; })[0];
        equal(druidRow.slice(1, 5).join(','), '\u00c9quilibre,Combat farouche (ours),Combat farouche (f\u00e9lin),Restauration', 'Druide has 4 specs');
        var roleTable = {};
        lists.forEach(function (row) { if (row[16]) { roleTable[row[16]] = row[17]; } });
        equal(roleTable['Druide|Combat farouche (ours)'] + '|' + roleTable['Druide|Combat farouche (f\u00e9lin)'] + '|' + roleTable['Pr\u00eatre|Ombre'],
          'Tank|Melee DPS|Caster DPS', 'R\u00f4le table maps class and spec');

        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        var formulaOf = function (rule) { return rule.booleanRule.condition.values[0].userEnteredValue; };
        contains(formulaOf(rosterMeta.conditionalFormatRules[0]), 'EXACT', 'duplicate-name highlight has top priority');
        var mageRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$C2="Mage"'; })[0];
        equal(mageRule.ranges[0].startColumnIndex + ':' + mageRule.ranges[0].endColumnIndex, '2:4', 'class colour covers Classe and Sp\u00e9 only');
        var nameRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$A2<>""'; })[0];
        equal(JSON.stringify(nameRule.booleanRule.format.backgroundColor) + nameRule.booleanRule.format.textFormat.bold, JSON.stringify(rgbHex_('FFFFFF')) + 'true', 'raider name stays white and bold');
        var groupRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$B2<>""'; })[0];
        equal(groupRule.ranges[0].startColumnIndex + ':' + JSON.stringify(groupRule.booleanRule.format), '1:' + JSON.stringify(nameRule.booleanRule.format), 'Groupe de raid styled like the raider name');
        equal(validationForColumn(rosterMeta, 1).condition.values.map(function (v) { return v.userEnteredValue; }).join(','), 'Raid 1,Raid 2', 'Groupe de raid dropdown is Raid 1 or Raid 2');
        equal(validationForColumn(rosterMeta, 1).strict, true, 'Groupe de raid dropdown refuses other values');
        var parseRules = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule).indexOf('ISNUMBER($F2)') !== -1; });
        equal(parseRules.length, 7, 'seven WCL parse colour bands');
        var legendary = parseRules.filter(function (rule) { return formulaOf(rule) === '=AND(ISNUMBER($F2),$F2>=100)'; })[0];
        equal(JSON.stringify(legendary.booleanRule.format.textFormat.foregroundColor), JSON.stringify(rgbHex_('E5CC80')), 'parse 100 is WCL gold');
        var healRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$E2="Heal"'; })[0];
        equal(JSON.stringify(healRule.booleanRule.format.backgroundColor), JSON.stringify(rgbHex_('C8E6C9')), 'Heal role colour');

        var before = {
          merges: awardsMeta.merges.length,
          rules: TracerHarness.getSheetMeta('Objets Heal').conditionalFormatRules.length,
          presenceRules: TracerHarness.getSheetMeta('Pr\u00e9sence').conditionalFormatRules.length,
          awardsRules: awardsMeta.conditionalFormatRules.length,
          roster: JSON.stringify(TracerHarness.getRows('Roster'))
        };
        var ruleFormulas = function (name) {
          return TracerHarness.getSheetMeta(name).conditionalFormatRules.map(function (rule) {
            return rule.booleanRule.condition.values[0].userEnteredValue;
          }).filter(function (formula) { return formula.indexOf('INDIRECT("Config!B2")') === -1; }).sort().join(' ');
        };
        var greyRules = function (name) {
          return TracerHarness.getSheetMeta(name).conditionalFormatRules.filter(function (rule) {
            return rule.booleanRule.condition.values[0].userEnteredValue.indexOf('INDIRECT("Config!B2")') !== -1;
          });
        };
        equal(ruleFormulas('Pr\u00e9sence'), '=AND(OR($A3<>"",$C3<>""),D$1<>"",OR(D3="",D3=0)) =D3="B" =D3=1', 'Pr\u00e9sence tints 1, B, and empty/0 on raid rows');
        equal(classHeaderTextHex_('Mage') + '|' + classHeaderTextHex_('Pr\u00eatre') + '|' + classHeaderTextHex_(''), '3FC7EB|6E6E6E|' + HEADER_STYLE.text, 'class header text colours');
        equal(ruleFormulas('Awards'), ['=$D3="BIS"', '=$D3="CLASS_BOUND"', '=$D3="IMPACT"', '=$D3="NORMAL"', '=$I3="BIS"', '=$I3="CLASS_BOUND"', '=$I3="IMPACT"', '=$I3="NORMAL"'].join(' '), 'Awards rows tinted by Traitement per block');
        // Old-tier grey rules: added last (index 0), so they win over the tints.
        var presenceGrey = greyRules('Pr\u00e9sence');
        equal(presenceGrey.length + '|' + presenceGrey[0].booleanRule.condition.values[0].userEnteredValue, '1|=AND(ISNUMBER($C3),$C3<N(INDIRECT("Config!B2")))', 'Pr\u00e9sence old-tier rows greyed from the raid date');
        equal(presenceGrey[0].ranges[0].startColumnIndex + ':' + presenceGrey[0].ranges[0].startRowIndex, '0:2', 'Pr\u00e9sence grey covers whole raid rows');
        equal(TracerHarness.getSheetMeta('Pr\u00e9sence').conditionalFormatRules[0].booleanRule.condition.values[0].userEnteredValue,
          presenceGrey[0].booleanRule.condition.values[0].userEnteredValue, 'Pr\u00e9sence grey rule has top priority');
        var awardsGrey = greyRules('Awards');
        equal(awardsGrey.length, 2, 'one Awards grey rule per block');
        var anaGrey = awardsGrey.filter(function (rule) { return rule.ranges[0].startColumnIndex === 0; })[0].booleanRule.condition.values[0].userEnteredValue;
        contains(anaGrey, 'N(IF($A3<>"",$A3,IFERROR(VLOOKUP($E3,INDIRECT("\'Pr\u00e9sence\'!$A$3:$C$1000"),3,FALSE),"")))', 'Awards grey uses the award Date, else its raid date');
        contains(anaGrey, '>0,', 'an award with no usable date stays current, like the loot formulas');
        equal(JSON.stringify(TracerHarness.getSheetMeta('Awards').conditionalFormatRules[0].booleanRule.format.textFormat.foregroundColor), JSON.stringify(rgbHex_(OLD_TIER_STYLE.text)), 'grey text colour');
        var raidsGrey = greyRules('Raids');
        equal(raidsGrey.length + '|' + raidsGrey[0].booleanRule.condition.values[0].userEnteredValue, '1|=AND(ISNUMBER($C2),$C2<N(INDIRECT("Config!B2")))', 'Raids old-tier rows greyed');
        setUpWorkbook();
        equal(TracerHarness.getSheetMeta('Pr\u00e9sence').conditionalFormatRules.length, before.presenceRules, 'rerun keeps Pr\u00e9sence rule count stable');
        equal(TracerHarness.getSheetMeta('Awards').conditionalFormatRules.length, before.awardsRules, 'rerun keeps Awards rule count stable');
        equal(TracerHarness.getSheetMeta('Awards').merges.length, before.merges, 'rerun keeps merge count stable');
        equal(TracerHarness.getSheetMeta('Objets Heal').conditionalFormatRules.length, before.rules, 'rerun keeps rule count stable');
        equal(JSON.stringify(TracerHarness.getRows('Roster')), before.roster, 'rerun keeps Roster data unchanged');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        seedRoster(['Ana', 'Bob']);
        setUpWorkbook();

        var presenceId = SpreadsheetApp.getActive().getSheetByName('Pr\u00e9sence').getSheetId();
        Sheets.Spreadsheets.batchUpdate({ requests: [
          { updateCells: { start: { sheetId: presenceId, rowIndex: 0, columnIndex: 3 }, rows: [{ values: [
            { userEnteredValue: { stringValue: 'Ana' } },
            { userEnteredValue: { stringValue: '' } },
            { userEnteredValue: { stringValue: 'Bob' } }
          ] }], fields: 'userEnteredValue' } },
          { updateSheetProperties: { properties: { sheetId: presenceId, gridProperties: { columnCount: 40 } }, fields: 'gridProperties.columnCount' } }
        ] }, SpreadsheetApp.getActive().getId());

        setUpWorkbook();
        var header = TracerHarness.getRows('Pr\u00e9sence')[0];
        equal(header[3] + '|' + header[4] + '|' + header[5], 'Ana|Bob|', 'blank header slot moves after the names');
        equal(TracerHarness.getSheetMeta('Pr\u00e9sence').columnCount, 40, 'refresh never shrinks the grid');
      });

      withHarness(function () {
        TracerHarness.setLocale('fr_FR');
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Classeur mis à jour', 'fr_FR setup succeeds');
        ['Roster', 'Objets Caster DPS'].forEach(function (name) {
          TracerHarness.getSheetMeta(name).conditionalFormatRules.forEach(function (rule) {
            equal(rule.booleanRule.condition.values[0].userEnteredValue.indexOf(','), -1, 'fr ' + name + ' rule has no commas');
          });
        });
        contains(TracerHarness.getRows('_Listes')[1][6], ';', 'fr _Listes formula uses semicolons');
        // Fresh workbook: setup created Roster itself.
        equal(TracerHarness.getRows('Roster')[0][1], 'Groupe de raid', 'fresh Roster has Groupe de raid in B');
        equal(validationForColumn(TracerHarness.getSheetMeta('Roster'), 1).condition.values.map(function (v) { return v.userEnteredValue; }).join(','), 'Raid 1,Raid 2', 'fresh Roster group dropdown');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Config', [['tierId', 'Unexpected']]);
        TracerHarness.seedSheet('Marker', [['stable']]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Conflit d\'en-têtes dans l\'onglet "Config"', 'conflict names tab');
        equal(TracerHarness.getRows('Marker')[0][0], 'stable', 'conflict keeps existing values unchanged');
        equal(TracerHarness.getSheetMeta('Objets Tank'), null, 'conflict abort is atomic');
        equal(TracerHarness.isLockHeld(), false, 'lock released after conflict');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Roster', [['raiderKey'], ['Ana'], ['Ana']]);
        var threw = false;
        try {
          requireRosterIndex_();
        } catch (error) {
          threw = true;
          contains(error.message, 'nom en double "Ana" aux lignes 2 et 3', 'requireRosterIndex_ names key and both rows');
        }
        equal(threw, true, 'requireRosterIndex_ throws on duplicate');
        equal(classNames_().indexOf('D\u00e9moniste') !== -1, true, 'class names keep accents');
        equal(SPEC_COLUMNS.length, 28, '28 spec columns as mapped');
      });

      withHarness(function () {
        var bold = buildSetupRequests_(Object.create(null), { sheets: [] }, ',').filter(function (request) {
          return request.repeatCell && request.repeatCell.fields === 'userEnteredFormat.textFormat.bold';
        });
        equal(bold.length, 1, 'bold data cells on Roster only');
        equal(bold[0].repeatCell.range.startRowIndex, 1, 'bold starts below the header');
      });

      withHarness(function () {
        rosterLookupTests();
      });

      // Full reset: wrong password changes nothing; the right one leaves only the empty layout.
      withHarness(function () {
        seedCoreFlatTabs(['Roster']);
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster')), ['Ana', 'Raid 1', 'Mage', 'Givre', '', 80]]);
        TracerHarness.seedSheet('Notes', [['libre'], ['texte']]);
        setUpWorkbook();
        var sheetNames = function () {
          return SpreadsheetApp.getActive().getSheets().map(function (sheet) { return sheet.getName(); }).sort().join(',');
        };
        var rosterBefore = JSON.stringify(TracerHarness.getRows('Roster'));

        openResetWorkbookDialog();
        var dialog = TracerHarness.getLastModalDialog();
        equal(dialog.title, 'Réinitialiser le classeur', 'reset opens a dialog');
        contains(dialog.html, 'type="password"', 'reset dialog hides the password');
        contains(dialog.html, 'window.confirm(', 'reset asks for a confirmation');

        var wrongError = '';
        try {
          submitResetWorkbook('Duracell');
        } catch (error) {
          wrongError = error.message;
        }
        contains(wrongError, 'mot de passe incorrect', 'wrong password refused');
        equal(JSON.stringify(TracerHarness.getRows('Roster')), rosterBefore, 'wrong password: Roster untouched');
        truthy(SpreadsheetApp.getActive().getSheetByName('Notes'), 'wrong password: other tabs untouched');

        var expectedNames = sheetNames().split(',').filter(function (name) { return name !== 'Notes'; }).join(',');
        contains(submitResetWorkbook('duracell'), 'Classeur réinitialisé', 'right password resets');
        equal(sheetNames(), expectedNames, 'only the layout tabs remain, no temporary tab');
        equal(TracerHarness.getRows('Roster').slice(1).map(function (row) { return row[0] + '' + row[2] + row[3]; }).join(''), '', 'Roster emptied');
        equal(TracerHarness.getRows('Roster')[0][0], 'Raider (nom exact en jeu)', 'Roster headers rebuilt');
        equal(TracerHarness.getRows('Présence')[0].slice(3).join(''), '', 'no raider column left in Présence');

        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Classeur mis à jour', 'refresh works after a reset');
      });

      document.getElementById('result').textContent = 'PASS: ' + testAssertions + ' assertions';
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
