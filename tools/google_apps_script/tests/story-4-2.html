<!doctype html>
<meta charset="utf-8">
<title>Story 4.2 tests</title>
<pre id="result">Tests did not run.</pre>
<script src="harness.js"></script>
<script src="../src/batch.js"></script>
<script src="../src/schema.js"></script>
<script src="../src/setup.js"></script>
<script src="../src/grids.js"></script>
<script src="../src/roster.js"></script>
<script src="../src/scores.js"></script>
<script>
  (function () {
    var assertions = 0;

    function equal(actual, expected, label) {
      assertions += 1;
      if (actual !== expected) {
        throw new Error(label + ': expected ' + expected + ', got ' + actual);
      }
    }

    function truthy(value, label) {
      assertions += 1;
      if (!value) {
        throw new Error(label + ': expected truthy value');
      }
    }

    function contains(text, expectedSubstring, label) {
      assertions += 1;
      if (String(text).indexOf(expectedSubstring) === -1) {
        throw new Error(label + ': expected "' + text + '" to contain "' + expectedSubstring + '"');
      }
    }

    function withHarness(fn) {
      TracerHarness.install();
      try {
        fn();
      } finally {
        TracerHarness.uninstall();
      }
    }

    // Seeds every flat contract tab with its key header row, except the names in `skip`.
    function seedCoreFlatTabs(skip) {
      TABS.forEach(function (tab) {
        if ((skip || []).indexOf(tab.name) !== -1) {
          return;
        }
        TracerHarness.seedSheet(tab.name, [keysOf_(tab)]);
      });
    }

    // Seeds the live workbook as it was before this change (old Roster, Rerolls, Raids and technical tabs).
    function seedLegacyLiveWorkbook() {
      TracerHarness.seedSheet('Config', [['tierId', 'bisWindowId']]);
      TracerHarness.seedSheet('Roster', [
        ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'dpsParse', 'gainFraction'],
        ['Ana', 'Mage', 'Givre', 'Heal', 'MT1', '80', '0.03']
      ]);
      TracerHarness.seedSheet('Rerolls', [
        ['rerollName', 'mainKey'],
        ['AnaAlt', 'Ana']
      ]);
      TracerHarness.seedSheet('Raids', [['raidId', 'tierId', 'bisWindowId', 'instance', 'raidDate', 'status']]);
      TracerHarness.seedSheet('RaidReports', [['reportCode', 'raidId', 'importedAt']]);
      TracerHarness.seedSheet('PatternItems', [['itemID', 'itemName']]);
      TracerHarness.seedSheet('Diagnostics', [['ts', 'kind'], ['x', 'y']]);
    }

    function validationForColumn(meta, columnIndex) {
      for (var i = 0; i < meta.dataValidations.length; i += 1) {
        var entry = meta.dataValidations[i];
        // Skip range clears (no rule).
        if (entry.range.startColumnIndex === columnIndex && entry.rule) {
          return entry.rule;
        }
      }
      return null;
    }

    // Rerolls row in the current layout: name, class, spec, role, parse, main.
    function rerollRow(name, main) {
      return [name, '', '', '', '', main];
    }

    function rosterLookupTests() {
      var rerollHeader = keysOf_(tabByName_('Rerolls'));
      var index = buildRosterIndex_(
        [['raiderKey'], ['Ana'], ['ana']],
        [rerollHeader, rerollRow('AnaAlt', 'Ana')]
      );

      equal(findRaiderKey_(index, 'Ana'), 'Ana', 'exact key lookup for Ana');
      equal(findRaiderKey_(index, 'ana'), 'ana', 'exact key lookup for ana');
      equal(findRaiderKey_(index, 'ANA'), null, 'lookup does not case-fold');
      equal(resolveAttendanceKey_(index, 'AnaAlt'), 'Ana', 'attendance resolves reroll to main');
      equal(resolveAttendanceKey_(index, 'Ana'), 'Ana', 'attendance keeps direct raider key');

      var duplicateIndex = buildRosterIndex_([['raiderKey'], ['Ana'], ['Ana']], [rerollHeader]);
      contains(duplicateIndex.errors[0], 'duplicate key "Ana"', 'duplicate key includes key name');

      var badReroll = buildRosterIndex_(
        [['raiderKey'], ['Ana'], ['Mira']],
        [rerollHeader, rerollRow('Ana', 'Ana'), rerollRow('AltOne', 'MissingMain'), rerollRow('AltOne', 'Mira')]
      );
      equal(badReroll.errors.length, 3, 'bad reroll scenarios produce three errors');
      contains(badReroll.errors[0], 'must not match a roster key', 'reroll name collision error');
      contains(badReroll.errors[1], 'is not in roster keys', 'missing main key error');
      contains(badReroll.errors[2], 'duplicate rerollName', 'duplicate reroll error');

      var whitespaceIndex = buildRosterIndex_([['raiderKey'], ['Ana ']], [rerollHeader]);
      contains(whitespaceIndex.errors[0], 'leading/trailing whitespace', 'whitespace error mentions reason');
    }

    try {
      withHarness(function () {
        seedLegacyLiveWorkbook();

        setUpWorkbook();

        equal(TracerHarness.getSheetMeta('RaidReports'), null, 'RaidReports deleted');
        equal(TracerHarness.getSheetMeta('PatternItems'), null, 'PatternItems deleted');
        equal(TracerHarness.getSheetMeta('Diagnostics'), null, 'Diagnostics deleted');

        var raids = TracerHarness.getRows('Raids')[0];
        equal(raids.slice(0, 5).join(','), 'Raid (ID),Instance,Date du raid,Rapports WCL,Import\u00e9 le', 'Raids merged headers');

        var rerolls = TracerHarness.getRows('Rerolls');
        equal(rerolls[0].slice(0, 6).join(','), 'Reroll (nom exact),Classe,Sp\u00e9,R\u00f4le,Parse WCL moyen,Personnage principal', 'Rerolls headers migrated');
        equal(rerolls[1][0], 'AnaAlt', 'Reroll name kept');
        equal(rerolls[1][5], 'Ana', 'Reroll main moved to column F');

        var roster = TracerHarness.getRows('Roster');
        equal(roster[0].slice(0, 5).join(','), 'Raider (nom exact en jeu),Classe,Sp\u00e9,R\u00f4le,Parse WCL moyen', 'Roster headers migrated');
        equal(roster[1].slice(0, 3).join(',') + ',' + roster[1][4], 'Ana,Mage,\u2744\ufe0f Givre,80', 'Roster spec rewritten with emoji, parse kept');
        contains(roster[1][3], "MATCH($B2&\"|\"&$C2,'_Listes'!$Q$2:$Q$200,0)", 'Roster R\u00f4le is the Classe|Sp\u00e9 lookup formula');
      });

      withHarness(function () {
        // The former single feral spec becomes ours or félin from the row's existing role.
        seedCoreFlatTabs(['Roster']);
        TracerHarness.seedSheet('Roster', [
          keysOf_(tabByName_('Roster')),
          ['Bear', 'Druide', '\ud83d\udc3b Combat farouche', ROLE_DISPLAY.Tank.value, ''],
          ['Cat', 'Druide', 'Combat farouche', 'Melee DPS', '']
        ]);
        setUpWorkbook();
        var rows = TracerHarness.getRows('Roster');
        equal(rows[1][2] + '|' + rows[2][2], '\ud83d\udc3b Combat farouche (ours)|\ud83d\udc08 Combat farouche (f\u00e9lin)', 'legacy feral spec split by role');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('RaidReports', [['reportCode', 'raidId', 'importedAt'], ['abc123', 'r1', '2026-10-20']]);

        setUpWorkbook();

        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Workbook setup failed', 'abort alert exists');
        contains(alert, 'RaidReports', 'abort alert names RaidReports');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('PatternItems', [['itemID', 'itemName'], ['19019', 'Thunderfury pattern']]);

        setUpWorkbook();

        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Workbook setup failed', 'abort alert exists');
        contains(alert, 'PatternItems', 'abort alert names PatternItems');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Objets Heal', [
          ['', '', 'Heal'],
          ['', '', 'Paladin Sacr\u00e9'],
          ['Objet (ID)', 'Objet', 'Gain (%)', 'Statut']
        ]);

        setUpWorkbook();

        var rows = TracerHarness.getRows('Objets Heal');
        equal(rows[2][2], 'Emplacement', 'Objets row 3 has Emplacement in column C');
        equal(rows[2][3], 'Statut', 'Objets row 3 first of pair is Statut');
        equal(rows[2][4], 'Gain (%)', 'Objets row 3 second of pair is Gain (%)');

        var meta = TracerHarness.getSheetMeta('Objets Heal');
        var statusRule = validationForColumn(meta, 3);
        equal(statusRule.condition.values.map(function (value) { return value.userEnteredValue; }).join(','),
          'BIS,IMPACT,CLASS_BOUND,NORMAL', 'Objets statut values reduced');
        equal(validationForColumn(meta, 2).condition.values.length, ITEM_SLOTS.length, 'Emplacement dropdown on column C');
      });

      withHarness(function () {
        // Tab built before the Emplacement column: owner data moves right with its spec.
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Objets Heal', [
          ['', '', 'Heal'],
          ['', '', 'Sacr\u00e9'],
          ['Objet (ID)', 'Objet', 'Statut', 'Gain (%)'],
          [19019, 'Thunderfury', 'BIS', 0.03]
        ]);

        setUpWorkbook();

        var rows = TracerHarness.getRows('Objets Heal');
        equal(rows[3].slice(0, 5).join('|'), '19019|Thunderfury||BIS|0.03', 'existing item keeps its Statut and Gain under its spec');
        setUpWorkbook();
        equal(TracerHarness.getRows('Objets Heal')[3].slice(0, 5).join('|'), '19019|Thunderfury||BIS|0.03', 'second refresh inserts nothing more');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Objets Heal', [
          ['', '', 'Heal'],
          ['', '', 'Paladin Sacr\u00e9'],
          ['Objet (ID)', 'Objet', 'Gain (%)', 'Statut'],
          ['19019', 'Thunderfury', '0.03', 'BIS']
        ]);

        setUpWorkbook();

        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Workbook setup failed', 'abort alert exists');
        contains(alert, 'Objets Heal', 'abort alert names Objets tab');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Roster', 'Rerolls']);
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'dpsParse'],
          ['Ana', 'Mage', '', 'Heal', '80']
        ]);
        TracerHarness.seedSheet('Rerolls', [
          ['rerollName', 'class', 'spec', 'role', 'dpsParse', 'mainKey'],
          ['AnaAlt', 'Pr\u00eatre', '', '', '', 'Ana']
        ]);

        setUpWorkbook();

        var rerollsMeta = TracerHarness.getSheetMeta('Rerolls');
        var specRule = validationForColumn(rerollsMeta, columnOf_(tabByName_('Rerolls'), 'spec'));
        equal(specRule.condition.type, 'ONE_OF_RANGE', 'Rerolls spec uses ONE_OF_RANGE');
        contains(specRule.condition.values[0].userEnteredValue, "'_Listes'!$L2:$O2", 'Rerolls spec points to L:O helper range');
        equal(validationForColumn(rerollsMeta, columnOf_(tabByName_('Rerolls'), 'role')), null, 'Rerolls R\u00f4le has no dropdown');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Diagnostics', [['x']]);

        var order = buildSetupRequests_(readExistingHeadersByName_(), { sheets: [] }, ',')
          .filter(function (request) {
            return request.updateSheetProperties && request.updateSheetProperties.fields === 'index';
          })
          .map(function (request) {
            var id = request.updateSheetProperties.properties.sheetId;
            var name = null;
            ['Roster', 'Rerolls', 'Raids', 'Awards', 'Config'].forEach(function (candidate) {
              var sheet = SpreadsheetApp.getActive().getSheetByName(candidate);
              if (sheet && sheet.getSheetId() === id) {
                name = candidate;
              }
            });
            return name || id;
          });

        equal(order.join(','),
          'Roster,Rerolls,1011,1012,1021,1022,1023,1024,1025,Raids,Config,1020',
          'tabs ordered as Roster, Rerolls, Pr\u00e9sence, Awards, Objets, Raids, Config, _Listes');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Roster']);
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'dpsParse'],
          ['Ana', 'Mage', '\u2744\ufe0f Givre', '\u271a Heal', '80']
        ]);

        setUpWorkbook();
        var before = JSON.stringify(TracerHarness.getRows('Roster'));

        setUpWorkbook();
        equal(JSON.stringify(TracerHarness.getRows('Roster')), before, 're-run keeps data unchanged');
      });

      // Seeds a sheet with a header and one data row, runs setup, and checks the abort left everything untouched.
      function expectAbort(tabName, rows, label) {
        withHarness(function () {
          seedCoreFlatTabs();
          TracerHarness.seedSheet(tabName, rows);
          setUpWorkbook();
          contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook setup failed', label + ' aborts');
          contains(TracerHarness.getAlerts().slice(-1)[0], tabName, label + ' alert names the tab');
          equal(JSON.stringify(TracerHarness.getRows(tabName)), JSON.stringify(rows), label + ' data kept');
          equal(TracerHarness.getSheetMeta('_Listes'), null, label + ' creates no _Listes');
          equal(TracerHarness.getSheetMeta('Objets Tank'), null, label + ' creates no Objets tab');
        });
      }

      expectAbort('RaidReports', [['reportCode', 'raidId', 'importedAt'], ['abc123', 'r1', '2026-10-20']], 'RaidReports with data');
      expectAbort('PatternItems', [['itemID', 'itemName'], ['19019', 'Pattern']], 'PatternItems with data');
      expectAbort('Raids', [['raidId', 'tierId', 'bisWindowId', 'instance', 'raidDate', 'status'], ['R1', 't1', 'w1', 'MC', '2026-01-01', 'OPEN']], 'old Raids with data');
      expectAbort('Awards', [['Checksum Gargul', 'Raid (ID)'], ['c1', 'R1']], 'old flat Awards with data');
      expectAbort('TierItems', [['Palier', 'Objet (ID)', 'Objet'], ['t1', '19019', 'Thunderfury']], 'old flat TierItems with an item');
      expectAbort('TierItems', [['', '', 'Tank'], ['', '', 'Guerrier Protection'], ['Objet (ID)', 'Objet', 'Gain (%)'], ['19019', 'Thunderfury', 0.03]], 'single TierItems grid with items');
      expectAbort('Objets Heal', [['', '', 'Heal'], ['', '', 'Paladin Sacré'], ['Objet (ID)', 'Objet', 'Gain (%)', 'Statut'], ['19019', 'Thunderfury', '0.03', 'BIS']], 'Objets Heal with items in the old order');

      withHarness(function () {
        seedLegacyLiveWorkbook();
        TracerHarness.seedSheet('Attendance', [['raidId', 'raiderKey']]);
        TracerHarness.seedSheet('Bench', [['raidId', 'raiderKey']]);
        TracerHarness.seedSheet('Butin', [['legacy']]);
        setUpWorkbook();
        equal(TracerHarness.getSheetMeta('Attendance') === null && TracerHarness.getSheetMeta('Bench') === null &&
          TracerHarness.getSheetMeta('Butin') === null, true, 'Attendance, Bench and Butin deleted');
        equal(TracerHarness.getSheetMeta('Raids') !== null, true, 'Raids recreated');

        var before = JSON.stringify(['Roster', 'Rerolls', 'Raids'].map(function (name) { return TracerHarness.getRows(name); }));
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook layout applied', 're-run after migration succeeds');
        equal(JSON.stringify(['Roster', 'Rerolls', 'Raids'].map(function (name) { return TracerHarness.getRows(name); })), before,
          're-run after migration moves no data and repeats no migration');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Roster']);
        TracerHarness.seedSheet('Roster', [
          ['raiderKey', 'class', 'spec', 'role', 'tankPriority', 'Unexpected', 'gainFraction'],
          ['Ana', 'Mage', '', '', '', 'x', '']
        ]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Header conflict in tab "Roster"', 'old Roster with an unknown column aborts');
        equal(TracerHarness.getRows('Roster')[1][5], 'x', 'unknown column data kept');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Rerolls']);
        TracerHarness.seedSheet('Rerolls', [['rerollName', 'mainKey', 'Notes'], ['AnaAlt', 'Ana', 'keep']]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Header conflict in tab "Rerolls"', 'old Rerolls with an extra column aborts');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Rerolls']);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls')), ['AnaAlt', 'Prêtre', '', '', '', 'Ana']]);
        setUpWorkbook();
        var lists = TracerHarness.getRows('_Listes');
        contains(lists[1][11], 'XLOOKUP(Rerolls!B2', '_Listes L2 looks up the Rerolls class');
        var priestRow = lists.filter(function (row) { return row[0] === 'Prêtre'; })[0];
        equal(priestRow.slice(1, 4).join(','), '📿 Discipline,✨ Sacré,🌑 Ombre', 'Prêtre specs offered with emoji');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Objets Heal', [
          ['', '', 'Heal'],
          ['', '', 'Paladin Sacré'],
          ['Objet (ID)', 'Objet', 'Gain (%)', 'Statut']
        ]);
        var healId = SpreadsheetApp.getActive().getSheetByName('Objets Heal').getSheetId();
        // The old Statut dropdown sat on column D, which becomes Gain.
        Sheets.Spreadsheets.batchUpdate({ requests: [{ setDataValidation: {
          range: { sheetId: healId, startRowIndex: 3, startColumnIndex: 3, endColumnIndex: 4 },
          rule: { condition: { type: 'ONE_OF_LIST', values: [{ userEnteredValue: 'BIS' }] } }
        } }] }, SpreadsheetApp.getActive().getId());
        setUpWorkbook();
        var meta = TracerHarness.getSheetMeta('Objets Heal');
        equal(validationForColumn(meta, 4), null, 'old Statut dropdown removed from the Gain column');
        var formulas = meta.conditionalFormatRules.map(function (rule) { return rule.booleanRule.condition.values[0].userEnteredValue; });
        equal(formulas.indexOf('=E4<0') !== -1 && formulas.indexOf('=D4<0') === -1, true, 'gain rules moved to the second column of the pair');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        setUpWorkbook();
        var caster = TracerHarness.getSheetMeta('Objets Caster DPS');
        var casterRows = TracerHarness.getRows('Objets Caster DPS');
        equal(casterRows[1].filter(function (v) { return v; }).length, 9, '9 Caster DPS spec labels');
        equal(caster.frozenRowCount + ':' + caster.frozenColumnCount, '3:3', 'Objets rows 1-3 and A-C frozen');
        equal(caster.conditionalFormatRules.length, 9 * 6, 'red and green gain rules plus 4 Statut colours per Caster spec');
        var casterStatusRules = caster.conditionalFormatRules.filter(function (rule) {
          return rule.ranges[0].startColumnIndex === OBJETS_FIRST_SPEC_COLUMN;
        }).map(function (rule) { return rule.booleanRule.condition.values[0].userEnteredValue; }).sort().join(' ');
        equal(casterStatusRules, '=D4="BIS" =D4="CLASS_BOUND" =D4="IMPACT" =D4="NORMAL"', 'Statut colours sit on the Statut column only');
        var specCount = 0;
        ITEM_TABS.forEach(function (itemTab) {
          specCount += TracerHarness.getRows(itemTab.name)[1].filter(function (v) { return v; }).length;
        });
        equal(specCount, 28, 'the five Objets tabs hold all 28 specs');
        equal(TracerHarness.getRows('Objets Melee DPS')[1].indexOf('Combat farouche (félin)') !== -1, true, 'feral cat under Melee DPS');
        equal(TracerHarness.getRows('Objets Tank')[1].filter(function (v) { return v; }).join(','),
          'Protection,Protection,Combat farouche (ours)', 'Tank specs show the spec name only');
        equal(TracerHarness.getSheetMeta('Présence').frozenRowCount + ':' + TracerHarness.getSheetMeta('Présence').frozenColumnCount, '2:3', 'Présence frozen');
        equal(TracerHarness.getSheetMeta('Awards').frozenRowCount, 2, 'Awards frozen');
        equal(labelsOf_(tabByName_('Roster'))[2], 'Spé', 'labels keep accents');
      });

      withHarness(function () {
        var requests = buildSetupRequests_(Object.create(null), { sheets: [] }, ',');
        var listsIndex = -1;
        var firstSpecDropdown = -1;
        requests.forEach(function (request, index) {
          if (request.addSheet && request.addSheet.properties.title === '_Listes' && listsIndex === -1) {
            listsIndex = index;
          }
          var rule = request.setDataValidation && request.setDataValidation.rule;
          if (rule && rule.condition.type === 'ONE_OF_RANGE' && firstSpecDropdown === -1) {
            firstSpecDropdown = index;
          }
        });
        equal(listsIndex !== -1 && listsIndex < firstSpecDropdown, true, '_Listes is created before the Spé dropdown references it');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        seedRoster(['Ana']);
        setUpWorkbook();
        var presenceId = SpreadsheetApp.getActive().getSheetByName('Présence').getSheetId();
        var awardsId = SpreadsheetApp.getActive().getSheetByName('Awards').getSheetId();
        var rosterId = SpreadsheetApp.getActive().getSheetByName('Roster').getSheetId();
        var text = function (v) { return { userEnteredValue: { stringValue: v } }; };
        Sheets.Spreadsheets.batchUpdate({ requests: [
          { appendCells: { sheetId: presenceId, rows: [{ values: [text('R1'), text('MC'), text('2026-01-01'), text('1')] }], fields: 'userEnteredValue' } },
          { appendCells: { sheetId: awardsId, rows: [{ values: [text('2026-01-02'), text('Obj'), text('123'), text('BIS'), text('R1')] }], fields: 'userEnteredValue' } },
          { appendCells: { sheetId: rosterId, rows: [{ values: [text('Cid'), text('Mage')] }], fields: 'userEnteredValue' } }
        ] }, SpreadsheetApp.getActive().getId());
        setUpWorkbook();
        var presence = TracerHarness.getRows('Présence');
        equal(presence[0][4] + '|' + presence[2][3], 'Cid|1', 'Présence appends Cid and keeps Ana values');
        var awards = TracerHarness.getRows('Awards');
        equal(awards[0][5] + '|' + awards[2][0], 'Cid|2026-01-02', 'Awards appends a Cid block and keeps the entry');
        equal(TracerHarness.getSheetMeta('Awards').merges.map(function (m) { return m.startColumnIndex + '-' + m.endColumnIndex; }).join(','), '0-5,5-10', 'Awards blocks A-E and F-J');
      });

      // Restored grid, refresh, locale and conflict tests (current Roster layout).
      function seedRoster(names) {
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster'))].concat(names.map(function (name) {
          return [name, 'Mage', '', '', ''];
        })));
      }

      withHarness(function () {
        seedCoreFlatTabs();
        TracerHarness.seedSheet('Bench', [['raidId', 'raiderKey'], ['R1', 'Ana']]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Bench', 'abort alert names Bench');
        equal(TracerHarness.getRows('Bench')[1].join(','), 'R1,Ana', 'abort keeps the Bench row');
        equal(TracerHarness.getSheetMeta('_Listes'), null, 'abort creates no _Listes');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        seedRoster(['Ana', 'Bob']);
        setUpWorkbook();

        var presenceRows = TracerHarness.getRows('Pr\u00e9sence');
        equal(presenceRows[0][3] + ',' + presenceRows[0][4], 'Ana,Bob', 'Pr\u00e9sence raider columns');
        equal(presenceRows[1][3], '=COUNTIF(D3:D,1)+COUNTIF(D3:D,"B")', 'Pr\u00e9sence total formula in D2');
        var awardsRows = TracerHarness.getRows('Awards');
        equal(awardsRows[0][0] + ',' + awardsRows[0][5], 'Ana,Bob', 'Awards blocks per raider');
        var awardsMeta = TracerHarness.getSheetMeta('Awards');
        var traitement = awardsMeta.dataValidations.filter(function (entry) {
          return entry.range.startColumnIndex === 8 && entry.rule;
        })[0];
        equal(traitement.rule.condition.values.map(function (v) { return v.userEnteredValue; }).join(','), 'BIS,IMPACT,CLASS_BOUND,NORMAL', 'Bob block Traitement dropdown');
        equal(Object.keys(awardsMeta.hiddenColumns || {}).filter(function (key) { return awardsMeta.hiddenColumns[key]; }).sort().join(','),
          '4,9', 'Raid (ID) hidden in each Awards block');

        var tierRows = TracerHarness.getRows('Objets Tank');
        equal(tierRows[2][2] + ',' + tierRows[2][3] + ',' + tierRows[2][4], 'Emplacement,Statut,Gain (%)', 'Objets: Emplacement, then Statut then Gain');
        var tierMeta = TracerHarness.getSheetMeta('Objets Tank');
        var tierFormulas = tierMeta.conditionalFormatRules.map(function (rule) {
          return rule.booleanRule.condition.values[0].userEnteredValue;
        });
        equal(tierFormulas.indexOf('=E4<0') !== -1 && tierFormulas.indexOf('=E4>=1/50') !== -1, true, 'gain rules on the second column of the pair');
        equal(validationForColumn(tierMeta, 4), null, 'no Statut dropdown left on the Gain column');

        var lists = TracerHarness.getRows('_Listes');
        var mageRow = lists.filter(function (row) { return row[0] === 'Mage'; })[0];
        equal(mageRow.slice(1, 4).join(','), '\ud83d\udd2e Arcanes,\ud83d\udd25 Feu,\u2744\ufe0f Givre', '_Listes Mage specs carry emoji');
        equal([7, 8, 9, 12, 13, 14].map(function (c) { return lists[1][c] || ''; }).join(''), '', '_Listes leaves the spill cells free');
        var druidRow = lists.filter(function (row) { return row[0] === 'Druide'; })[0];
        equal(druidRow.slice(1, 5).join(','), '\ud83c\udf19 \u00c9quilibre,\ud83d\udc3b Combat farouche (ours),\ud83d\udc08 Combat farouche (f\u00e9lin),\ud83c\udf3f Restauration', 'Druide has 4 specs');
        var roleTable = {};
        lists.forEach(function (row) { if (row[16]) { roleTable[row[16]] = row[17]; } });
        equal(roleTable['Druide|\ud83d\udc3b Combat farouche (ours)'] + '|' + roleTable['Druide|\ud83d\udc08 Combat farouche (f\u00e9lin)'] + '|' + roleTable['Pr\u00eatre|\ud83c\udf11 Ombre'],
          ROLE_DISPLAY.Tank.value + '|' + ROLE_DISPLAY['Melee DPS'].value + '|' + ROLE_DISPLAY['Caster DPS'].value, 'R\u00f4le table maps class and spec');

        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        var formulaOf = function (rule) { return rule.booleanRule.condition.values[0].userEnteredValue; };
        contains(formulaOf(rosterMeta.conditionalFormatRules[0]), 'EXACT', 'duplicate-name highlight has top priority');
        var mageRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$B2="Mage"'; })[0];
        equal(mageRule.ranges[0].startColumnIndex + ':' + mageRule.ranges[0].endColumnIndex, '1:3', 'class colour covers Classe and Sp\u00e9 only');
        var nameRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$A2<>""'; })[0];
        equal(JSON.stringify(nameRule.booleanRule.format.backgroundColor) + nameRule.booleanRule.format.textFormat.bold, JSON.stringify(rgbHex_('FFFFFF')) + 'true', 'raider name stays white and bold');
        var parseRules = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule).indexOf('ISNUMBER($E2)') !== -1; });
        equal(parseRules.length, 7, 'seven WCL parse colour bands');
        var legendary = parseRules.filter(function (rule) { return formulaOf(rule) === '=AND(ISNUMBER($E2),$E2>=100)'; })[0];
        equal(JSON.stringify(legendary.booleanRule.format.textFormat.foregroundColor), JSON.stringify(rgbHex_('E5CC80')), 'parse 100 is WCL gold');
        var healRule = rosterMeta.conditionalFormatRules.filter(function (rule) { return formulaOf(rule) === '=$D2="\u271a Heal"'; })[0];
        equal(JSON.stringify(healRule.booleanRule.format.backgroundColor), JSON.stringify(rgbHex_('C8E6C9')), 'Heal role colour');

        var before = {
          merges: awardsMeta.merges.length,
          rules: TracerHarness.getSheetMeta('Objets Heal').conditionalFormatRules.length,
          presenceRules: TracerHarness.getSheetMeta('Pr\u00e9sence').conditionalFormatRules.length,
          awardsRules: awardsMeta.conditionalFormatRules.length,
          roster: JSON.stringify(TracerHarness.getRows('Roster'))
        };
        var ruleFormulas = function (name) {
          return TracerHarness.getSheetMeta(name).conditionalFormatRules.map(function (rule) {
            return rule.booleanRule.condition.values[0].userEnteredValue;
          }).sort().join(' ');
        };
        equal(ruleFormulas('Pr\u00e9sence'), '=AND(OR($A3<>"",$C3<>""),D$1<>"",OR(D3="",D3=0)) =D3="B" =D3=1', 'Pr\u00e9sence tints 1, B, and empty/0 on raid rows');
        equal(classHeaderTextHex_('Mage') + '|' + classHeaderTextHex_('Pr\u00eatre') + '|' + classHeaderTextHex_(''), '3FC7EB|6E6E6E|' + HEADER_STYLE.text, 'class header text colours');
        equal(ruleFormulas('Awards'), ['=$D3="BIS"', '=$D3="CLASS_BOUND"', '=$D3="IMPACT"', '=$D3="NORMAL"', '=$I3="BIS"', '=$I3="CLASS_BOUND"', '=$I3="IMPACT"', '=$I3="NORMAL"'].join(' '), 'Awards rows tinted by Traitement per block');
        setUpWorkbook();
        equal(TracerHarness.getSheetMeta('Pr\u00e9sence').conditionalFormatRules.length, before.presenceRules, 'rerun keeps Pr\u00e9sence rule count stable');
        equal(TracerHarness.getSheetMeta('Awards').conditionalFormatRules.length, before.awardsRules, 'rerun keeps Awards rule count stable');
        equal(TracerHarness.getSheetMeta('Awards').merges.length, before.merges, 'rerun keeps merge count stable');
        equal(TracerHarness.getSheetMeta('Objets Heal').conditionalFormatRules.length, before.rules, 'rerun keeps rule count stable');
        equal(JSON.stringify(TracerHarness.getRows('Roster')), before.roster, 'rerun keeps Roster data unchanged');
      });

      withHarness(function () {
        seedCoreFlatTabs();
        seedRoster(['Ana', 'Bob']);
        setUpWorkbook();

        var presenceId = SpreadsheetApp.getActive().getSheetByName('Pr\u00e9sence').getSheetId();
        Sheets.Spreadsheets.batchUpdate({ requests: [
          { updateCells: { start: { sheetId: presenceId, rowIndex: 0, columnIndex: 3 }, rows: [{ values: [
            { userEnteredValue: { stringValue: 'Ana' } },
            { userEnteredValue: { stringValue: '' } },
            { userEnteredValue: { stringValue: 'Bob' } }
          ] }], fields: 'userEnteredValue' } },
          { updateSheetProperties: { properties: { sheetId: presenceId, gridProperties: { columnCount: 40 } }, fields: 'gridProperties.columnCount' } }
        ] }, SpreadsheetApp.getActive().getId());

        setUpWorkbook();
        var header = TracerHarness.getRows('Pr\u00e9sence')[0];
        equal(header[3] + '|' + header[4] + '|' + header[5], 'Ana|Bob|', 'blank header slot moves after the names');
        equal(TracerHarness.getSheetMeta('Pr\u00e9sence').columnCount, 40, 'refresh never shrinks the grid');
      });

      withHarness(function () {
        TracerHarness.setLocale('fr_FR');
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook layout applied', 'fr_FR setup succeeds');
        ['Roster', 'Rerolls', 'Objets Caster DPS'].forEach(function (name) {
          TracerHarness.getSheetMeta(name).conditionalFormatRules.forEach(function (rule) {
            equal(rule.booleanRule.condition.values[0].userEnteredValue.indexOf(','), -1, 'fr ' + name + ' rule has no commas');
          });
        });
        contains(TracerHarness.getRows('_Listes')[1][6], ';', 'fr _Listes formula uses semicolons');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Config', [['tierId', 'Unexpected']]);
        TracerHarness.seedSheet('Marker', [['stable']]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Header conflict in tab "Config"', 'conflict names tab');
        equal(TracerHarness.getRows('Marker')[0][0], 'stable', 'conflict keeps existing values unchanged');
        equal(TracerHarness.getSheetMeta('Objets Tank'), null, 'conflict abort is atomic');
        equal(TracerHarness.isLockHeld(), false, 'lock released after conflict');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Roster', [['raiderKey'], ['Ana'], ['Ana']]);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls'))]);
        var threw = false;
        try {
          requireRosterIndex_();
        } catch (error) {
          threw = true;
          contains(error.message, 'duplicate key "Ana" at rows 2 and 3', 'requireRosterIndex_ names key and both rows');
        }
        equal(threw, true, 'requireRosterIndex_ throws on duplicate');
        equal(classNames_().indexOf('D\u00e9moniste') !== -1, true, 'class names keep accents');
        equal(SPEC_COLUMNS.length, 28, '28 spec columns as mapped');
      });

      withHarness(function () {
        seedCoreFlatTabs(['Roster']);
        // Live Roster after a manual column cleanup: the Parse header still has its earlier label.
        TracerHarness.seedSheet('Roster', [
          ['Raider (nom exact en jeu)', 'Classe', 'Spé', 'Rôle', 'Parse WCL moyen (1-100)'],
          ['Ana', 'Mage', 'Givre', 'Heal', 80]
        ]);
        setUpWorkbook();
        contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook layout applied', 'former Parse label is accepted');
        equal(TracerHarness.getRows('Roster')[0][4], 'Parse WCL moyen', 'Parse header renamed to the current label');
        equal(TracerHarness.getRows('Roster')[1][4], 80, 'Parse value kept');
      });

      withHarness(function () {
        var bold = buildSetupRequests_(Object.create(null), { sheets: [] }, ',').filter(function (request) {
          return request.repeatCell && request.repeatCell.fields === 'userEnteredFormat.textFormat.bold';
        });
        equal(bold.length, 2, 'bold data cells on Roster and Rerolls only');
        equal(bold[0].repeatCell.range.startRowIndex, 1, 'bold starts below the header');
      });

      withHarness(function () {
        rosterLookupTests();
      });

      document.getElementById('result').textContent = 'PASS: ' + assertions + ' assertions';
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
