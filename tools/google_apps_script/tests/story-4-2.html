<script src="../src/roster.js"></script>
<script>
  (function () {
    var assertions = 0;

    function equal(actual, expected, label) {
      assertions += 1;
      if (actual !== expected) {
        throw new Error(label + ': expected ' + expected + ', got ' + actual);
      }
    }

    function contains(text, expectedSubstring, label) {
      assertions += 1;
      if (String(text).indexOf(expectedSubstring) === -1) {
        throw new Error(label + ': expected "' + text + '" to contain "' + expectedSubstring + '"');
      }
    }

    function truthy(value, label) {
      assertions += 1;
      if (!value) {
        throw new Error(label + ': expected truthy value');
      }
    }

    function withHarness(fn) {
      TracerHarness.install();
      try {
        fn();
      } finally {
        TracerHarness.uninstall();
      }
    }

    function headerRow(tabName) {
      return TracerHarness.getRows(tabName)[0] || [];
    }

    function formulaFromRule(rule) {
      return rule.booleanRule.condition.values[0].userEnteredValue;
    }

    function validationForColumn(meta, columnIndex) {
      for (var i = 0; i < meta.dataValidations.length; i += 1) {
        var range = meta.dataValidations[i].range;
        if (range.startColumnIndex === columnIndex) {
          return meta.dataValidations[i].rule;
        }
      }
      return null;
    }

    function cellAt(sheetName, rowIndex, columnIndex) {
      var rows = TracerHarness.getRows(sheetName);
      var row = rows[rowIndex] || [];
      return row[columnIndex] === undefined ? '' : row[columnIndex];
    }

    function buildPresenceReference(raidsRows, attendanceRows, benchRows, rosterRows) {
      var raids = raidsRows.slice(1).filter(function (row) { return row[0] !== ''; });
      raids.sort(function (left, right) {
        return String(left[4]).localeCompare(String(right[4]));
      });

      var raiders = rosterRows.slice(1)
        .map(function (row) { return String(row[0] || ''); })
        .filter(function (name) { return name !== ''; })
        .sort(function (left, right) { return left.localeCompare(right); });

      var matrix = raids.map(function (raid) {
        var raidId = raid[0];
        return raiders.map(function (raider) {
          var attended = attendanceRows.slice(1).some(function (entry) {
            return entry[0] === raidId && entry[1] === raider;
          });
          if (attended) {
            return 1;
          }
          var benched = benchRows.slice(1).some(function (entry) {
            return entry[0] === raidId && entry[1] === raider;
          });
          return benched ? 'B' : 0;
        });
      });

      return {
        raids: raids,
        raiders: raiders,
        matrix: matrix,
        totals: raiders.map(function (_, columnIndex) {
          return matrix.reduce(function (sum, values) {
            return sum + (values[columnIndex] === 0 ? 0 : 1);
          }, 0);
        })
      };
    }

    function buildButinReference(awardsRows, tierItemsRows, raiderName) {
      var itemNameById = Object.create(null);
      tierItemsRows.slice(1).forEach(function (row) {
        if (row[1] !== '' && row[1] !== null && row[1] !== undefined) {
          itemNameById[String(row[1])] = row[2] || '';
        }
      });

      return awardsRows.slice(1)
        .filter(function (row) { return row[4] === raiderName; })
        .map(function (row) {
          var itemId = String(row[5] || '');
          return [row[8] + ' ' + row[9], itemNameById[itemId] || '', row[5], row[10]];
        })
        .sort(function (left, right) {
          return String(right[0]).localeCompare(String(left[0]));
        });
    }

    try {
      withHarness(function () {
        setUpWorkbook();

        equal(headerRow('Config').join(','), labelsOf_(tabByName_('Config')).join(','), 'Config uses readable labels');
        equal(headerRow('Roster').join(','), labelsOf_(tabByName_('Roster')).join(','), 'Roster uses readable labels');
        equal(headerRow('TierItems').join(','), labelsOf_(tabByName_('TierItems')).join(','), 'TierItems uses readable labels');

        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        equal(rosterMeta.frozenRowCount, 1, 'Roster header row frozen');
        equal(rosterMeta.dataValidations.length, 6, 'Roster validation count');
        equal(rosterMeta.conditionalFormatRules.length, 10, 'Roster conditional format count');
        equal(rosterMeta.bandedRanges.length, 1, 'Roster banding count');

        var rerollsMeta = TracerHarness.getSheetMeta('Rerolls');
        equal(rerollsMeta.conditionalFormatRules.length, 2, 'Rerolls conditional format count');
        equal(rerollsMeta.bandedRanges.length, 1, 'Rerolls banding count');

        var tierMeta = TracerHarness.getSheetMeta('TierItems');
        equal(tierMeta.dataValidations.length, 4, 'TierItems validation count');
        equal(tierMeta.conditionalFormatRules.length, 12, 'TierItems conditional format count');
        equal(tierMeta.bandedRanges.length, 1, 'TierItems banding count');

        truthy(TracerHarness.getSheetMeta('Roster').tabColorStyle, 'input tab has tabColorStyle');
        truthy(TracerHarness.getSheetMeta('Raids').tabColorStyle, 'log tab has tabColorStyle');

        contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook layout applied', 'success alert text');
        equal(TracerHarness.isLockHeld(), false, 'lock released after setup');

        contains(formulaFromRule(rosterMeta.conditionalFormatRules[0]), 'EXACT', 'duplicate-name highlight has top priority over class colours');
        var mageRule = rosterMeta.conditionalFormatRules.filter(function (rule) {
          return formulaFromRule(rule) === '=$B2="Mage"';
        })[0];
        equal(JSON.stringify(mageRule.booleanRule.format.backgroundColor), JSON.stringify(rgbHex_('3FC7EB')), 'Mage colour');
        equal(mageRule.ranges[0].startColumnIndex + ':' + mageRule.ranges[0].endColumnIndex, '0:2', 'class colour covers Raider and Classe');

        var redRule = tierMeta.conditionalFormatRules.filter(function (rule) { return formulaFromRule(rule) === '=G2<0'; })[0];
        var greenRule = tierMeta.conditionalFormatRules.filter(function (rule) { return formulaFromRule(rule) === '=G2>=1/50'; })[0];
        var titleRule = tierMeta.conditionalFormatRules.filter(function (rule) {
          return formulaFromRule(rule).indexOf('Melee DPS') !== -1;
        })[0];
        equal(JSON.stringify(redRule.booleanRule.format.textFormat.foregroundColor), JSON.stringify(rgbHex_('B3261E')), 'negative gain is red');
        equal(greenRule.booleanRule.format.textFormat.bold, true, 'gain of 2% or more is bold');
        equal(JSON.stringify(greenRule.booleanRule.format.textFormat.foregroundColor), JSON.stringify(rgbHex_('1E7D32')), 'gain of 2% or more is green');
        equal(titleRule.booleanRule.format.textFormat.bold, true, 'title-row rule keeps bold text');

        var presenceMeta = TracerHarness.getSheetMeta('Présence');
        var butinMeta = TracerHarness.getSheetMeta('Butin');
        equal(presenceMeta.frozenRowCount, 2, 'Présence freezes header and total rows');
        equal(presenceMeta.frozenColumnCount, 3, 'Présence freezes first three columns');
        equal(butinMeta.frozenRowCount, 2, 'Butin freezes the first two rows');
        truthy(TracerHarness.getRows('Présence').length > 0, 'Présence is created');
        truthy(Boolean(butinMeta), 'Butin is created');
        contains(cellAt('Présence', 2, 0), 'SORT(FILTER(HSTACK(', 'Présence raid sorting formula is written');
      });

      withHarness(function () {
        TracerHarness.setLocale('fr_FR');
        setUpWorkbook();

        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        var allRosterFormulas = rosterMeta.conditionalFormatRules.map(formulaFromRule).join('\n');
        contains(allRosterFormulas, ';', 'fr formula uses semicolon separator');

        var rosterSpecRule = validationForColumn(rosterMeta, columnOf_(tabByName_('Roster'), 'spec'));
        contains(rosterSpecRule.condition.values[0].userEnteredValue, ';', 'fr spec rule formula uses semicolon separator');
        equal(rosterSpecRule.condition.values[0].userEnteredValue.indexOf(','), -1, 'fr spec rule formula has no commas');
        ['Roster', 'Rerolls', 'TierItems'].forEach(function (name) {
          TracerHarness.getSheetMeta(name).conditionalFormatRules.forEach(function (rule) {
            equal(formulaFromRule(rule).indexOf(','), -1, 'fr ' + name + ' rule has no commas');
          });
        });
      });

      withHarness(function () {
        setUpWorkbook();
        var before = {
          rosterRules: TracerHarness.getSheetMeta('Roster').conditionalFormatRules.length,
          rosterValidations: TracerHarness.getSheetMeta('Roster').dataValidations.length,
          rosterBandings: TracerHarness.getSheetMeta('Roster').bandedRanges.length,
          tierRules: TracerHarness.getSheetMeta('TierItems').conditionalFormatRules.length,
          tierBandings: TracerHarness.getSheetMeta('TierItems').bandedRanges.length
        };

        setUpWorkbook();
        var after = {
          rosterRules: TracerHarness.getSheetMeta('Roster').conditionalFormatRules.length,
          rosterValidations: TracerHarness.getSheetMeta('Roster').dataValidations.length,
          rosterBandings: TracerHarness.getSheetMeta('Roster').bandedRanges.length,
          tierRules: TracerHarness.getSheetMeta('TierItems').conditionalFormatRules.length,
          tierBandings: TracerHarness.getSheetMeta('TierItems').bandedRanges.length
        };

        equal(after.rosterRules, before.rosterRules, 'rerun keeps Roster rule count stable');
        equal(after.rosterValidations, before.rosterValidations, 'rerun keeps Roster validation count stable');
        equal(after.rosterBandings, before.rosterBandings, 'rerun keeps Roster banding count stable');
        equal(after.tierRules, before.tierRules, 'rerun keeps TierItems rule count stable');
        equal(after.tierBandings, before.tierBandings, 'rerun keeps TierItems banding count stable');
      });

      withHarness(function () {
        TABS.forEach(function (tab) {
          if (tab.name === 'Roster') {
            TracerHarness.seedSheet(tab.name, [
              keysOf_(tab),
              ['Ana', 'Mage', 'Givre', 'Heal', 'MT1', 80, 0.03]
            ]);
            return;
          }
          TracerHarness.seedSheet(tab.name, [keysOf_(tab)]);
        });
        TracerHarness.seedSheet('Marker', [['stable']]);

        setUpWorkbook();

        equal(headerRow('Roster').join(','), labelsOf_(tabByName_('Roster')).join(','), 'technical headers migrate to labels');
        equal(TracerHarness.getRows('Roster')[1].join(','), 'Ana,Mage,Givre,Heal,MT1,80,0.03', 'setup preserves existing roster row values');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Config', [['tierId', 'Unexpected']]);
        TracerHarness.seedSheet('Marker', [['stable']]);

        setUpWorkbook();

        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Workbook setup failed', 'conflict returns failure alert');
        contains(alert, 'Header conflict in tab "Config"', 'conflict names tab');
        contains(alert, '[tierId, Unexpected]', 'conflict shows existing headers');
        contains(alert, 'Palier actif (ID)', 'conflict shows expected labels');
        equal(TracerHarness.getRows('Marker')[0][0], 'stable', 'conflict keeps existing values unchanged');
        equal(TracerHarness.getRows('Roster').length, 0, 'conflict abort is atomic');
        equal(TracerHarness.isLockHeld(), false, 'lock released after conflict');
      });

      withHarness(function () {
        setUpWorkbook();

        var rosterMeta = TracerHarness.getSheetMeta('Roster');
        var tierMeta = TracerHarness.getSheetMeta('TierItems');

        var rosterFormulas = rosterMeta.conditionalFormatRules.map(formulaFromRule);
        var tierFormulas = tierMeta.conditionalFormatRules.map(formulaFromRule);

        truthy(rosterFormulas.indexOf('=$B2="Mage"') !== -1, 'Roster has class color rule for Mage');
        truthy(tierFormulas.indexOf('=$D2="Mage"') !== -1, 'TierItems has class color rule for Mage');
        truthy(tierFormulas.indexOf('=G2<0') !== -1, 'TierItems has negative gain red rule');
        truthy(tierFormulas.indexOf('=G2>=1/50') !== -1, 'TierItems has >=2% gain green/bold rule');

        var roleRule = validationForColumn(rosterMeta, columnOf_(tabByName_('Roster'), 'role'));
        var roleValues = roleRule.condition.values.map(function (entry) { return entry.userEnteredValue; }).join('|');
        contains(roleValues, 'Heal', 'Role validation allows Heal');
        equal(roleValues.indexOf('HEALER') === -1, true, 'Role validation rejects HEALER label');
      });

      withHarness(function () {
        var rosterTab = tabByName_('Roster');
        var raidsTab = tabByName_('Raids');
        var attendanceTab = tabByName_('Attendance');
        var benchTab = tabByName_('Bench');
        var awardsTab = tabByName_('Awards');
        var tierTab = tabByName_('TierItems');

        TracerHarness.seedSheet('Roster', [
          keysOf_(rosterTab),
          ['Ana', 'Mage', 'Givre', 'Heal', '', '', ''],
          ['Bob', 'Guerrier', 'Protection', 'Tank', '', '', '']
        ]);
        TracerHarness.seedSheet('Raids', [
          keysOf_(raidsTab),
          ['R1', 't1', 'w1', 'MC', '2026-01-01', 'closed'],
          ['R2', 't1', 'w1', 'BWL', '2026-01-02', 'closed']
        ]);
        TracerHarness.seedSheet('Attendance', [
          keysOf_(attendanceTab),
          ['R1', 'Ana'],
          ['R1', 'ana']
        ]);
        TracerHarness.seedSheet('Bench', [
          keysOf_(benchTab),
          ['R2', 'Ana']
        ]);
        TracerHarness.seedSheet('Awards', [
          keysOf_(awardsTab),
          ['c1', 'R1', 't1', 'w1', 'Ana', '1', '-', '0', '2026-02-01', '20:00:00', 'BIS'],
          ['c2', 'R2', 't1', 'w1', 'Ana', '2', '-', '0', '2026-02-02', '20:00:00', 'NONE']
        ]);
        TracerHarness.seedSheet('TierItems', [
          keysOf_(tierTab),
          ['t1', '1', 'Crown of Skill', 'Mage', 'Givre', 'BIS', 0.03],
          ['t1', '2', '', 'Mage', 'Feu', 'NORMAL', 0.01]
        ]);
        TracerHarness.seedSheet('Config', [keysOf_(tabByName_('Config'))]);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls'))]);
        TracerHarness.seedSheet('RaidReports', [keysOf_(tabByName_('RaidReports'))]);
        TracerHarness.seedSheet('PatternItems', [keysOf_(tabByName_('PatternItems'))]);

        setUpWorkbook();

        var expectedPresence = buildPresenceReference(
          TracerHarness.getRows('Raids'),
          TracerHarness.getRows('Attendance'),
          TracerHarness.getRows('Bench'),
          TracerHarness.getRows('Roster')
        );
        equal(cellAt('Présence', 0, 3), expectedPresence.raiders[0], 'Présence first raider header sorted by name');
        equal(cellAt('Présence', 1, 3), '=COUNTIF(D3:D,1)+COUNTIF(D3:D,"B")', 'Présence total formula in first raider column');
        contains(cellAt('Présence', 2, 3), 'EXACT(Attendance!$B$2:$B,D$1)', 'Présence formula uses exact name match');
        equal(expectedPresence.matrix[0][0], 1, 'Presence reference: Ana in R1 is 1');
        equal(expectedPresence.matrix[1][0], 'B', 'Presence reference: Ana in R2 is B');
        equal(expectedPresence.matrix[0][1], 0, 'Presence reference: Bob in R1 is 0');
        equal(expectedPresence.totals[0], 2, 'Presence reference: Ana total is 2');

        var expectedButin = buildButinReference(
          TracerHarness.getRows('Awards'),
          TracerHarness.getRows('TierItems'),
          'Ana'
        );
        equal(cellAt('Butin', 0, 0), 'Ana', 'Butin first block header is Ana');
        contains(cellAt('Butin', 2, 0), 'EXACT(Awards!E2:E,A$1)', 'Butin formula uses exact winner match');
        contains(cellAt('Butin', 2, 0), 'XLOOKUP(Awards!F2:F,TierItems!B2:B,TierItems!C2:C)', 'Butin formula resolves item names by id');
        contains(cellAt('Butin', 2, 0), 'Awards!I2:I&" "&Awards!J2:J', 'Butin sorts on date and time');
        equal(expectedButin[0][0], '2026-02-02 20:00:00', 'Butin reference sorts newest first');
        equal(expectedButin[0][1], '', 'Butin reference keeps unknown item name empty');
      });

      withHarness(function () {
        var tierWithLegacySlot = [
          ['tierId', 'itemID', 'itemName', 'Emplacement', 'class', 'spec', 'status', 'simGainFraction'],
          ['t1', '101', 'Old item', '', 'Mage', 'Givre', 'BIS', 0.03]
        ];

        TracerHarness.seedSheet('TierItems', tierWithLegacySlot);
        TracerHarness.seedSheet('Config', [keysOf_(tabByName_('Config'))]);
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster'))]);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls'))]);
        TracerHarness.seedSheet('Raids', [keysOf_(tabByName_('Raids'))]);
        TracerHarness.seedSheet('RaidReports', [keysOf_(tabByName_('RaidReports'))]);
        TracerHarness.seedSheet('Attendance', [keysOf_(tabByName_('Attendance'))]);
        TracerHarness.seedSheet('Bench', [keysOf_(tabByName_('Bench'))]);
        TracerHarness.seedSheet('Awards', [keysOf_(tabByName_('Awards'))]);
        TracerHarness.seedSheet('PatternItems', [keysOf_(tabByName_('PatternItems'))]);

        setUpWorkbook();

        equal(headerRow('TierItems').join(','), labelsOf_(tabByName_('TierItems')).join(','), 'empty Emplacement column is removed and headers migrate');
        equal(TracerHarness.getRows('TierItems')[1].join(','), 't1,101,Old item,Mage,Givre,BIS,0.03', 'row values are preserved when Emplacement is dropped');
      });

      withHarness(function () {
        TracerHarness.seedSheet('TierItems', [
          ['tierId', 'itemID', 'itemName', 'Emplacement', 'class', 'spec', 'status', 'simGainFraction'],
          ['t1', '101', 'Old item', 'Tête', 'Mage', 'Givre', 'BIS', 0.03]
        ]);
        TracerHarness.seedSheet('Config', [keysOf_(tabByName_('Config'))]);
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster'))]);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls'))]);
        TracerHarness.seedSheet('Raids', [keysOf_(tabByName_('Raids'))]);
        TracerHarness.seedSheet('RaidReports', [keysOf_(tabByName_('RaidReports'))]);
        TracerHarness.seedSheet('Attendance', [keysOf_(tabByName_('Attendance'))]);
        TracerHarness.seedSheet('Bench', [keysOf_(tabByName_('Bench'))]);
        TracerHarness.seedSheet('Awards', [keysOf_(tabByName_('Awards'))]);
        TracerHarness.seedSheet('PatternItems', [keysOf_(tabByName_('PatternItems'))]);

        setUpWorkbook();

        var alert = TracerHarness.getAlerts().slice(-1)[0];
        contains(alert, 'Workbook setup failed', 'setup fails when Emplacement has data');
        contains(alert, 'Emplacement column', 'error names Emplacement');
        contains(alert, 'column D', 'error names the legacy column letter');
        equal(headerRow('TierItems')[3], 'Emplacement', 'abort keeps the TierItems headers');
        equal(cellAt('TierItems', 1, 3), 'Tête', 'abort keeps the Emplacement data');
        equal(TracerHarness.getSheetMeta('Présence'), null, 'abort creates no view tab');
      });

      withHarness(function () {
        var rosterRows = [keysOf_(tabByName_('Roster'))];
        for (var n = 0; n < 30; n += 1) {
          rosterRows.push(['Raider' + (n < 10 ? '0' : '') + n, '', '', '', '', '', '']);
        }
        TracerHarness.seedSheet('Roster', rosterRows);

        setUpWorkbook();

        contains(TracerHarness.getAlerts().slice(-1)[0], 'Workbook layout applied', '30 raiders fit (Butin needs 120 columns)');
        equal(TracerHarness.getSheetMeta('Butin').columnCount, 120, 'Butin grid sized to 4 columns per raider');
        equal(cellAt('Butin', 0, 116), 'Raider29', 'last Butin block is written');
        equal(TracerHarness.getSheetMeta('Présence').columnCount, 33, 'Présence grid sized to the roster');
      });

      withHarness(function () {
        var exact = buildPresenceReference(
          [keysOf_(tabByName_('Raids')), ['R1', 't1', 'w1', 'MC', '2026-01-01', 'closed']],
          [keysOf_(tabByName_('Attendance')), ['R1', 'ana']],
          [keysOf_(tabByName_('Bench'))],
          [keysOf_(tabByName_('Roster')), ['Ana']]
        );
        equal(exact.matrix[0][0], 0, 'Présence exact: ana does not count for Ana');

        setUpWorkbook();
        contains(cellAt('Butin', 2, 0) || '', '', 'no roster: Butin stays empty');
        var tierMeta = TracerHarness.getSheetMeta('TierItems');
        var topRule = tierMeta.conditionalFormatRules[0];
        contains(formulaFromRule(topRule), 'Caster DPS', 'section title rule has top priority');
        equal(topRule.ranges[0].startColumnIndex + ':' + topRule.ranges[0].endColumnIndex, '0:7', 'section title rule covers A to G');
        equal(JSON.stringify(topRule.booleanRule.format.backgroundColor), JSON.stringify(rgbHex_('253746')), 'section title rows are dark');
      });

      withHarness(function () {
        setUpWorkbook();

        var seededTitles = TracerHarness.getRows('TierItems').slice(1, 6).map(function (row) {
          return row[0];
        }).join('|');
        equal(seededTitles, ROLE_OPTIONS.join('|'), 'fresh TierItems is seeded with role titles');

        setUpWorkbook();
        var secondRunTitles = TracerHarness.getRows('TierItems').slice(1, 6).map(function (row) {
          return row[0];
        }).join('|');
        equal(secondRunTitles, ROLE_OPTIONS.join('|'), 'rerun keeps the same seeded title rows');
      });

      withHarness(function () {
        TracerHarness.seedSheet('Config', [keysOf_(tabByName_('Config'))]);
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster')), ['Ana', 'Mage', 'Givre', 'Heal', '', '', '']]);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls'))]);
        TracerHarness.seedSheet('Raids', [keysOf_(tabByName_('Raids'))]);
        TracerHarness.seedSheet('RaidReports', [keysOf_(tabByName_('RaidReports'))]);
        TracerHarness.seedSheet('Attendance', [keysOf_(tabByName_('Attendance'))]);
        TracerHarness.seedSheet('Bench', [keysOf_(tabByName_('Bench'))]);
        TracerHarness.seedSheet('Awards', [keysOf_(tabByName_('Awards'))]);
        TracerHarness.seedSheet('TierItems', [labelsOf_(tabByName_('TierItems')), ['t1', '1', 'Seeded', 'Mage', 'Givre', 'BIS', 0.02]]);
        TracerHarness.seedSheet('PatternItems', [keysOf_(tabByName_('PatternItems'))]);

        setUpWorkbook();
        equal(cellAt('Présence', 0, 3), 'Ana', 'Présence picks current roster names');

        var rosterSheetId = SpreadsheetApp.getActive().getSheetByName('Roster').getSheetId();
        Sheets.Spreadsheets.batchUpdate({
          requests: [
            {
              appendCells: {
                sheetId: rosterSheetId,
                rows: [
                  {
                    values: [
                      { userEnteredValue: { stringValue: 'Cid' } },
                      { userEnteredValue: { stringValue: 'Prêtre' } },
                      { userEnteredValue: { stringValue: 'Sacré' } },
                      { userEnteredValue: { stringValue: 'Heal' } }
                    ]
                  }
                ],
                fields: 'userEnteredValue'
              }
            }
          ]
        }, SpreadsheetApp.getActive().getId());

        setUpWorkbook();
        equal(cellAt('Présence', 0, 4), 'Cid', 'refresh adds new raider column in Présence');
        equal(cellAt('Butin', 0, 4), 'Cid', 'refresh adds new raider block in Butin');
        equal(TracerHarness.getSheetMeta('Butin').merges.length, 2, 'refresh does not duplicate Butin merges');
        equal(TracerHarness.getSheetMeta('Butin').borders.length, 2, 'refresh does not duplicate Butin borders');
        equal(TracerHarness.getSheetMeta('Présence').borders.length, 2, 'refresh does not duplicate Présence borders');
      });

      withHarness(function () {
        TracerHarness.seedSheet('TierItems', [
          labelsOf_(tabByName_('TierItems')),
          ['t1', '200', 'Item X', 'Mage', 'Feu', 'NORMAL', 0.01]
        ]);
        TracerHarness.seedSheet('Config', [keysOf_(tabByName_('Config'))]);
        TracerHarness.seedSheet('Roster', [keysOf_(tabByName_('Roster'))]);
        TracerHarness.seedSheet('Rerolls', [keysOf_(tabByName_('Rerolls'))]);
        TracerHarness.seedSheet('Raids', [keysOf_(tabByName_('Raids'))]);
        TracerHarness.seedSheet('RaidReports', [keysOf_(tabByName_('RaidReports'))]);
        TracerHarness.seedSheet('Attendance', [keysOf_(tabByName_('Attendance'))]);
        TracerHarness.seedSheet('Bench', [keysOf_(tabByName_('Bench'))]);
        TracerHarness.seedSheet('Awards', [keysOf_(tabByName_('Awards'))]);
        TracerHarness.seedSheet('PatternItems', [keysOf_(tabByName_('PatternItems'))]);

        setUpWorkbook();
        equal(cellAt('TierItems', 1, 0), 't1', 'existing TierItems data rows are kept');
        equal(cellAt('TierItems', 2, 0), '', 'section titles are not re-seeded when data rows already exist');
      });

      withHarness(function () {
        var specPattern = new RegExp(classSpecRegex_());
        equal(specPattern.test('Mage:Givre'), true, 'spec check accepts Mage Givre');
        equal(specPattern.test('Mage:Ombre'), false, 'spec check rejects Mage Ombre');
        equal(specPattern.test('Prêtre:Sacré'), true, 'spec check keeps French accents');
        equal(classNames_().indexOf('Démoniste') !== -1, true, 'class names keep accents');
        equal(labelsOf_(tabByName_('Roster'))[2], 'Spé', 'labels keep accents');
      });

      withHarness(function () {
        var index = buildRosterIndex_(
          [['raiderKey'], ['Ana'], ['ana']],
          [['rerollName', 'mainKey'], ['AnaAlt', 'Ana']]
        );

        equal(findRaiderKey_(index, 'Ana'), 'Ana', 'exact key lookup for Ana');
        equal(findRaiderKey_(index, 'ana'), 'ana', 'exact key lookup for ana');
        equal(findRaiderKey_(index, 'ANA'), null, 'lookup does not case-fold');
        equal(resolveAttendanceKey_(index, 'AnaAlt'), 'Ana', 'attendance resolves reroll to main');
        equal(resolveAttendanceKey_(index, 'Ana'), 'Ana', 'attendance keeps direct raider key');
      });

      withHarness(function () {
        var duplicateIndex = buildRosterIndex_(
          [['raiderKey'], ['Ana'], ['Ana']],
          [['rerollName', 'mainKey']]
        );
        truthy(duplicateIndex.errors.length > 0, 'duplicate roster key reports error');
        contains(duplicateIndex.errors[0], 'duplicate key "Ana"', 'duplicate key includes key name');

        TracerHarness.seedSheet('Roster', [['raiderKey'], ['Ana'], ['Ana']]);
        TracerHarness.seedSheet('Rerolls', [['rerollName', 'mainKey']]);

        var threw = false;
        try {
          requireRosterIndex_();
        } catch (error) {
          threw = true;
          contains(error.message, 'Roster index errors', 'requireRosterIndex_ throws aggregated errors');
          contains(error.message, 'duplicate key "Ana" at rows 2 and 3', 'requireRosterIndex_ names key and both rows');
        }
        equal(threw, true, 'requireRosterIndex_ throws on duplicate');
      });

      withHarness(function () {
        var badReroll = buildRosterIndex_(
          [['raiderKey'], ['Ana'], ['Mira']],
          [['rerollName', 'mainKey'], ['Ana', 'Ana'], ['AltOne', 'MissingMain'], ['AltOne', 'Mira']]
        );

        equal(badReroll.errors.length, 3, 'bad reroll scenarios produce three errors');
        contains(badReroll.errors[0], 'must not match a roster key', 'reroll name collision error');
        contains(badReroll.errors[1], 'is not in roster keys', 'missing main key error');
        contains(badReroll.errors[2], 'duplicate rerollName', 'duplicate reroll error');
      });

      withHarness(function () {
        var whitespaceIndex = buildRosterIndex_(
          [['raiderKey'], ['Ana ']],
          [['rerollName', 'mainKey']]
        );

        equal(whitespaceIndex.errors.length, 1, 'whitespace key rejected');
        contains(whitespaceIndex.errors[0], 'leading/trailing whitespace', 'whitespace error mentions reason');
      });

      document.getElementById('result').textContent = 'PASS: ' + assertions + ' assertions';
    } catch (error) {
      document.getElementById('result').textContent = 'FAIL: ' + error.stack;
      try {
        TracerHarness.uninstall();
      } catch (ignored) {}
    }
  }());
</script>
