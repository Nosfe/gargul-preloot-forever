<!-- Portal styles, included into portal.html by doGet (include('portal-style')). -->
<style>
  :root { --bg: #f4f6f9; --card: #fff; --line: #dde3ea; --head: #dce9f7; --headText: #0b4f9c; --muted: #66707c; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--body); font-size: 14px; background: var(--bg); color: #1f1f1f; }
  header { background: #0b4f9c; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; }
  header .tier { opacity: .85; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  nav button { border: 0; background: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font: inherit; color: var(--headText); }
  nav button.active { background: var(--head); font-weight: bold; }
  main { padding: 12px; max-width: 1200px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; overflow-x: auto; }
  .card h2 { font-size: 15px; margin: 0 0 8px; color: var(--headText); }
  th.sortable { cursor: pointer; user-select: none; }
  th[data-dir="asc"]::after { content: ' \25B2'; }
  th[data-dir="desc"]::after { content: ' \25BC'; }
  a.item { text-decoration: none; }
  a.stat.link { display: block; color: inherit; text-decoration: none; cursor: pointer; }
  a.stat.link:hover { outline: 2px solid var(--head); }
  button.toggle, a.toggle { display: inline-block; text-decoration: none; font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--head); color: var(--headText); cursor: pointer; margin: 0 8px 8px 0; vertical-align: top; }
  a.item:hover { text-decoration: underline; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .stat { flex: 1 1 130px; background: var(--bg); border-radius: 6px; padding: 8px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 18px; font-weight: bold; }
  /* Table rules stay inside main: Wowhead's tooltips are tables appended to body. */
  main table { border-collapse: collapse; width: 100%; }
  main th, main td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  main th { background: var(--head); color: var(--headText); position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank1 { background: #ffe38a; } .rank2 { background: #d3d7dd; } .rank3 { background: #edbe93; }
  .rank1, .rank2, .rank3 { font-weight: bold; }
  .muted { color: var(--muted); }
  .P { background: #e6f4ea; color: #1e7d32; text-align: center; } .B { background: #fff2cc; color: #b26a00; text-align: center; } .A { background: #fce8e6; text-align: center; }
  .t-BIS { color: #a335ee; font-weight: bold; } .t-IMPACT { color: #c65f00; font-weight: bold; } .t-CLASS_BOUND { color: #0070dd; } .t-ALT { color: #1a8c00; }
  input, select { font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; margin: 0 8px 8px 0; }
  .combo { display: inline-block; margin: 0 8px 8px 0; }
  .combo input { margin: 0; min-width: 220px; }
  /* Fixed so the card's horizontal scroll does not clip the list. */
  .combo ul { display: none; position: fixed; z-index: 10; max-height: 280px; overflow-y: auto; list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 12px rgba(0, 0, 0, .15); }
  .combo.open ul { display: block; }
  .combo li { padding: 5px 8px; cursor: pointer; white-space: nowrap; }
  .combo li.hl { background: var(--head); }
  #status { padding: 24px; text-align: center; color: var(--muted); }

  /* Forever theme from the logo palette: teal frame, tan trim, cream cards so class and quality colours stay readable. */
  :root { --tan: #c8b08a; --teal: #11678a; --cream: #fff5e1; --tealDark: #0b4f6b; --tanDark: #9c8460;
    --bg: #f4e7cc; --card: var(--cream); --line: #e3d3b4; --head: var(--teal); --headText: var(--cream); --muted: #6b6255; --gold: var(--tan); --ink: #22201c; --blue: var(--teal); --navy: var(--tealDark);
    --body: 'IBM Plex Sans', system-ui, sans-serif; --display: 'Cinzel', Georgia, serif; }
  body { font-family: var(--body); color: var(--ink); background: #0b4f6b radial-gradient(ellipse at top, #2a86ab 0%, #11678a 45%, #0b4f6b 85%) fixed; }
  header { background: linear-gradient(#0e5d7d, #083d53); border-bottom: 2px solid var(--tan); box-shadow: 0 2px 14px rgba(0, 0, 0, .3); padding: 14px 18px; }
  header h1 { font-family: var(--display); font-size: 32px; letter-spacing: 1.5px; color: var(--tan); text-shadow: 0 1px 0 #000, 0 0 8px rgba(200, 176, 138, .35); }
  header .tier { color: var(--cream); opacity: .85; }
  nav { background: #083d53; border-bottom: 1px solid var(--tanDark); }
  nav button { color: var(--cream); font-family: var(--display); border: 1px solid transparent; border-radius: 4px; }
  nav button:hover { border-color: var(--tanDark); }
  nav button.active { background: linear-gradient(#1a7fa8, var(--teal)); color: var(--cream); border-color: var(--tan); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
  .card { background: var(--card); border: 1px solid var(--tan); border-radius: 4px; box-shadow: 0 0 0 2px var(--tealDark), 0 4px 14px rgba(0, 0, 0, .35); }
  .card .card { box-shadow: none; }
  .card h2 { font-family: var(--display); font-size: 17px; color: var(--teal); border-bottom: 1px solid var(--tan); padding-bottom: 4px; }
  main th { background: linear-gradient(#167596, var(--teal)); color: var(--cream); font-weight: 600; border-bottom: 2px solid var(--tan); }
  td.num, .stat .value { font-family: var(--body); font-variant-numeric: tabular-nums; }
  /* Cinzel for the logo, page tabs, zone titles and the home tiles; IBM Plex Sans for text and numbers. */
  .stat .label { font-family: var(--display); }
  main tbody tr:hover td { background-image: linear-gradient(rgba(17, 103, 138, .08), rgba(17, 103, 138, .08)); }
  .stat { background: #f4e7cc; border: 1px solid var(--tan); border-radius: 4px; }
  a.stat.link:hover { outline: 2px solid var(--teal); }
  input, select { background: #fffdf7; border-color: var(--tan); color: var(--ink); }
  input:focus { outline: 2px solid var(--teal); outline-offset: 0; }
  .combo ul { background: #fffdf7; border-color: var(--tan); }
  .combo li.hl { background: #f4e7cc; }
  button.toggle, a.toggle { background: linear-gradient(#1a7fa8, var(--teal)); color: var(--cream); border: 1px solid var(--tan); border-radius: 4px; font-weight: 600; }
  button.toggle:hover, a.toggle:hover { filter: brightness(1.15); }
  /* Wowhead's quality colours are made for dark tooltips; darker common/uncommon so they read on parchment. */
  html:not(.dark) main a.item.q0 { color: #6b6b6b !important; } html:not(.dark) main a.item.q1 { color: var(--ink) !important; } html:not(.dark) main a.item.q2 { color: #1a8c00 !important; }
  #status { color: var(--cream); }
  /* About 12 rows, then the table scrolls under its sticky header. */
  .scroll { max-height: 440px; overflow-y: auto; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--tan); padding-bottom: 4px; margin-bottom: 8px; }
  .card .card-head h2 { border: 0; margin: 0; padding: 0; }
  .card-head .combo { margin: 0; }
  #tip { display: none; position: fixed; z-index: 20; pointer-events: none; background: var(--cream); border: 1px solid var(--tan); border-radius: 4px; box-shadow: 0 4px 12px rgba(0, 0, 0, .35); padding: 6px 10px; font-size: 12px; }
  #tip .t { font-weight: bold; margin-bottom: 4px; }
  #tip table { width: auto; }
  #tip td { padding: 1px 12px 1px 0; border: 0; background: none; color: var(--muted); }
  #tip td.v { padding-right: 0; color: var(--ink); font-family: var(--body); text-align: right; }
  #tip .f { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); font-family: var(--body); color: var(--teal); }
  header { align-items: center; justify-content: space-between; }
  /* Header and tabs stay visible while the page scrolls. */
  .topbar { position: sticky; top: 0; z-index: 15; }
  .topbar nav { position: static; }
  header .brand { display: flex; align-items: center; gap: 14px; }
  header .rules { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; }
  header .rules .arrow { font-size: 12px; }
  header .rules:hover, header .rules:focus { color: var(--cream); }
  header .perso-tab { font: inherit; font-family: var(--display); font-weight: 600; padding: 7px 14px; color: var(--cream); background: none; border: 1px solid var(--tan); border-radius: 4px; cursor: pointer; }
  header .perso-tab:hover { background: rgba(255, 255, 255, .08); }
  header .perso-tab.active { background: linear-gradient(#1a7fa8, var(--teal)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
  nav .spacer { flex: 1; }
  .card-head .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .card-head .filters .combo, .card-head .filters .toggle { margin: 0; }
  .card-head .title-group { display: flex; align-items: center; gap: 12px; }
  .card-head .title-group .toggle { margin: 0; }
  .item-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .item-card { padding: 8px 10px; background: #fffdf7; border: 1px solid var(--tan); border-radius: 4px; }
  .item-card .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 4px; margin-bottom: 4px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .item-card .head .slot { align-self: flex-end; }
  /* Same title height on every card: the name is centred (up to two lines), the slot sits on the bottom line. */
  .item-card .head { height: calc(2 * 1.3em + 4px); line-height: 1.3; }
  .item-card .head > :first-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item-card .slot { font-size: 12px; font-weight: normal; color: var(--muted); white-space: nowrap; }
  .item-card ol { margin: 0; padding: 0; list-style: none; }
  .item-card li { display: flex; gap: 6px; padding: 2px 0; cursor: help; }
  .item-card .rk { width: 1.6em; color: var(--muted); }
  .item-card .nm { flex: 1; }
  .item-card .sc { font-family: var(--body); font-size: 12px; align-self: center; }

  /* Dark theme (forever.css palette), only when <html class="dark">. */
  html.dark { color-scheme: dark; --ink: #ecf2f5; --muted: #8fa9b8; --line: #26475f; }
  html.dark body { color: #ecf2f5; background: #0a1620 radial-gradient(120% 600px at 50% 0, #0e2232 0%, #0a1620 70%) no-repeat fixed; }
  html.dark a { color: #2aa8dc; }
  html.dark header { background: linear-gradient(#0f3550, #0a2133); border-bottom: 1px solid #9a7432; }
  html.dark header h1 { color: #f6edd2; text-shadow: 0 1px 0 rgba(0, 0, 0, .4); }
  html.dark header .rules { color: #8fa9b8; background: #183247; border-color: #26475f; }
  html.dark header .rules .arrow { color: #2aa8dc; }
  html.dark header .rules:hover, html.dark header .rules:focus { color: #ecf2f5; background: #1e3d55; }
  html.dark nav { background: #0a2133; border-bottom: 1px solid #26475f; }
  html.dark nav button, html.dark header .perso-tab { color: #8fa9b8; border-color: transparent; }
  html.dark header .perso-tab { border-color: #26475f; }
  html.dark nav button:hover, html.dark header .perso-tab:hover { color: #ecf2f5; background: #1e3d55; }
  html.dark nav button.active, html.dark header .perso-tab.active { color: #04131c; background: #2aa8dc; border-color: #2aa8dc; box-shadow: none; }
  html.dark .card { background: #13293a; border-color: #26475f; border-radius: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  html.dark .card .card { background: transparent; }
  html.dark .card h2 { color: #2aa8dc; border-bottom-color: #26475f; }
  html.dark .card-head { border-bottom-color: #26475f; }
  html.dark main th { color: #fff; background: #1683b8; border-bottom: 0; }
  html.dark main tbody tr:hover td { background-image: none; background-color: #1e3d55; }
  html.dark .stat { background: #183247; border-color: #26475f; }
  html.dark input, html.dark select { color: #ecf2f5; background: #183247; border-color: #26475f; }
  html.dark input::placeholder { color: #5f7b8c; }
  html.dark input:focus { outline-color: #2aa8dc; }
  html.dark .combo ul { background: #183247; border-color: #26475f; }
  html.dark .combo li.hl { background: #1e3d55; }
  html.dark button.toggle, html.dark a.toggle { color: #04131c; background: #2aa8dc; border-color: #2aa8dc; }
  html.dark button.toggle:hover, html.dark a.toggle:hover { filter: none; color: #fff; background: #1683b8; }
  html.dark .t-BIS { color: #b569f5; } html.dark .t-IMPACT { color: #ff8000; } html.dark .t-CLASS_BOUND { color: #3d8bff; } html.dark .t-ALT { color: #1eff00; }
  html.dark .P { color: #6fcf7f; background: rgba(111, 207, 127, .15); } html.dark .B { color: #e5a83b; background: rgba(229, 168, 59, .15); } html.dark .A { background: rgba(224, 96, 90, .12); }
  html.dark .rank1 { background: rgba(216, 178, 90, .3); } html.dark .rank2 { background: rgba(200, 210, 220, .18); } html.dark .rank3 { background: rgba(205, 127, 50, .28); }
  html.dark #tip { background: #183247; border-color: #26475f; }
  html.dark #tip .f { color: #2aa8dc; }
  html.dark .item-card { background: #183247; border-color: #26475f; }
  html.dark #status { color: #8fa9b8; }
  .item-grid > .card { grid-column: 1 / -1; margin-bottom: 0; }
  td.calc { color: var(--muted); }
  main table.detail th, main table.detail td { padding: 8px 14px; border-right: 1px solid var(--line); }
  main table.detail th:last-child, main table.detail td:last-child { border-right: 0; }
  main table.detail th { white-space: normal; vertical-align: bottom; line-height: 1.2; }
  main table.detail tbody tr:nth-child(even) td:not(.P):not(.B):not(.A) { background-color: rgba(255, 255, 255, .035); }
  main table.detail .c { text-align: center; }
  main table.detail .r { text-align: right; }
  main table.detail .fit { width: 1%; }
  .medal1, .medal2, .medal3 { font-weight: bold; }
  .medal1, .item-card .rk.medal1 { color: #d8b25a; } .medal2, .item-card .rk.medal2 { color: #c3ccd4; } .medal3, .item-card .rk.medal3 { color: #cd8a4a; }
</style>
