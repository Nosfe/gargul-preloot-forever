<body>
<div class="topbar">

</div>
<main>
  <div id="status">Chargement…</div>

  <section id="perso"></section>
  <section id="classement"></section>
  <section id="roster"></section>
  <section id="loots"></section>
  <section id="presence"></section>

</main>
<script>
  var TABS = [['perso', 'Mon personnage'], ['roster', 'Roster'], ['classement', 'Classement Impact'], ['objets', 'Objets'], ['loots', 'Loots'], ['presence', 'Présence']];
  // Nav tabs pushed to the right end of the bar; Mon personnage lives in the header.
  var NAV_RIGHT = ['loots', 'presence'];
  // Dark theme switch: add class="dark" on <html>.
  var DARK = document.documentElement.classList.contains('dark');
  var DATA = null;
  var ROLE_LABELS = { TANK: 'Tank', HEALER: 'Heal', DPS: 'DPS' };
  // Dominant hue of each spec's talent tree art, darkened to stay readable on white.
  var SPEC_COLORS = {
    'Guerrier Armes': '#8B5A2B', 'Guerrier Fureur': '#B22222', 'Guerrier Protection': '#4A6A8A',
    'Paladin Sacré': '#B8860B', 'Paladin Protection': '#3B6EA5', 'Paladin Vindicte': '#C0392B',
    'Chasseur Maîtrise des bêtes': '#A0522D', 'Chasseur Précision': '#2E7D6B', 'Chasseur Survie': '#4E7D2B',
    'Voleur Assassinat': '#3C8D2F', 'Voleur Combat': '#A33B2A', 'Voleur Finesse': '#5B3A8C',
    'Prêtre Discipline': '#7A8CA0', 'Prêtre Sacré': '#C8A02E', 'Prêtre Ombre': '#6A2C91',
    'Chaman Élémentaire': '#2E6DB4', 'Chaman Amélioration': '#B5531B', 'Chaman Restauration': '#1F8A8A',
    'Mage Arcanes': '#9B3FB5', 'Mage Feu': '#D2491F', 'Mage Givre': '#2A7FBF',
    'Démoniste Affliction': '#4D8B2A', 'Démoniste Démonologie': '#6B3FA0', 'Démoniste Destruction': '#C0392B',
    'Druide Équilibre': '#4B5BA8', 'Druide Combat farouche (ours)': '#B5651D', 'Druide Combat farouche (félin)': '#B5651D', 'Druide Restauration': '#2E8B3E'
  };
  function colored(td, color) { td.style.color = color || ''; return td; }
  // Ranking-detail look; aligns[i] is the class of column i on every row, headers included ('c', 'r', 'fit' or '').
  function detailTable(grid, aligns) {
    grid.classList.add('detail');
    Array.prototype.forEach.call(grid.querySelectorAll('tr'), function (tr) {
      Array.prototype.forEach.call(tr.cells, function (cell, index) {
        var align = aligns[Math.min(index, aligns.length - 1)];
        if (align) { cell.classList.add(align); }
      });
    });
    return grid;
  }
  // On the dark theme the talent-tree colours are lifted halfway to white to stay readable.
  function specColor(key) {
    var hex = SPEC_COLORS[key];
    if (!hex || !DARK) { return hex; }
    var channels = [1, 3, 5].map(function (i) { return Math.round((parseInt(hex.slice(i, i + 2), 16) + 255) / 2); });
    return 'rgb(' + channels.join(', ') + ')';
  }
  // Short spec names for tight spots; specs not listed are already short.
  var SPEC_SHORT = {
    'Protection': 'Prot', 'Maîtrise des bêtes': 'BM', 'Précision': 'Préci', 'Assassinat': 'Assa', 'Discipline': 'Disci', 'Vindicte': 'Ret', 'Finesse': 'Sub',
    'Élémentaire': 'Élém', 'Amélioration': 'Amélio', 'Restauration': 'Resto', 'Affliction': 'Affli', 'Démonologie': 'Démono',
    'Destruction': 'Destru', 'Équilibre': 'Boomie', 'Combat farouche (ours)': 'Ours', 'Combat farouche (félin)': 'Feral'
  };
  var classColor = {};
  var classFill = {};

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === 'text') { node.textContent = attrs[key]; } else if (key === 'onclick' || key === 'onchange' || key === 'oninput') { node[key] = attrs[key]; } else { node.setAttribute(key, attrs[key]); }
    });
    (children || []).forEach(function (child) { if (child) { node.appendChild(child); } });
    return node;
  }
  function frDate(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
  function score(value) { return Number(value).toFixed(3); }
  // Same bands as the Roster's WCL parse colours.
  function parseColor(value) {
    var band = DATA.parseColors.filter(function (b) { return (b.min === null || value >= b.min) && (b.max === null || value < b.max); })[0];
    return band ? band.color : '';
  }
  function paintParse(node, value) { node.style.color = parseColor(value); node.style.fontWeight = 'bold'; return node; }
  // Red (lowest) → yellow → green (highest) among the item's IMPACT gains.
  function paintGain(node, item, value) {
    var gains = item.specs.filter(function (s) { return s.statut === 'IMPACT' && s.gainDps !== null; }).map(function (s) { return Number(s.gainDps); });
    var low = Math.min.apply(null, gains);
    var high = Math.max.apply(null, gains);
    var ratio = high > low ? (value - low) / (high - low) : 1;
    node.style.color = 'hsl(' + Math.round(ratio * 120) + ', 80%, ' + (DARK ? 60 : 36) + '%)';
    node.style.fontWeight = 'bold';
    return node;
  }
  function raiderByName(name) { return DATA.raiders.filter(function (r) { return r.name === name; })[0]; }
  function raiderOptions(firstLabel) {
    var names = DATA.raiders.map(function (r) { return r.name; }).sort(function (a, b) { return a.localeCompare(b, 'fr', { sensitivity: 'base' }); });
    return [{ value: '', text: firstLabel }].concat(names.map(function (name) { return { value: name, text: name, color: classColor[raiderByName(name).className] || '' }; }));
  }
  function fold(text) { return String(text).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  // Typeable dropdown: typing filters the entries, the full list still scrolls. options: [{ value, text, color }].
  // Filter choices kept in this browser, so a returning raider finds them as left (first visit: Tous).
  function savedFilter(key) { return localStorage.getItem('parsimonie-filter-' + key) || ''; }
  function saveFilter(key, value) { localStorage.setItem('parsimonie-filter-' + key, value || ''); }
  function combo(options, onchange, key) {
    var input = el('input', { type: 'text', autocomplete: 'off' });
    var list = el('ul');
    var box = el('div', { class: 'combo' }, [input, list]);
    var current = (key && options.filter(function (option) { return option.value === savedFilter(key); })[0]) || options[0];
    var shown = [];
    var active = -1;
    function label(option) { return option.value === '' ? '' : option.text; }
    function place() {
      var rect = input.getBoundingClientRect();
      list.style.left = rect.left + 'px';
      list.style.top = (rect.bottom + 2) + 'px';
      list.style.minWidth = rect.width + 'px';
    }
    function highlight() {
      Array.prototype.forEach.call(list.children, function (li, index) { li.classList.toggle('hl', index === active); });
      if (list.children[active]) { list.children[active].scrollIntoView({ block: 'nearest' }); }
    }
    function render(query) {
      var folded = fold(query.trim());
      list.innerHTML = '';
      shown = options.filter(function (option) { return !folded || fold(option.text).indexOf(folded) !== -1; });
      active = folded ? (shown.length ? 0 : -1) : shown.indexOf(current);
      shown.forEach(function (option) {
        var li = el('li', { text: option.text });
        if (option.color) { li.style.color = option.color; }
        li.onmousedown = function (event) { event.preventDefault(); pick(option); };
        list.appendChild(li);
      });
      place();
      highlight();
    }
    function close() {
      box.classList.remove('open');
      input.value = label(current);
      input.placeholder = options[0].value === '' ? options[0].text : '';
    }
    function pick(option) {
      var changed = option !== current;
      current = option;
      if (key) { saveFilter(key, option.value); }
      input.blur();
      close();
      if (changed) { onchange(); }
    }
    input.onfocus = function () { input.placeholder = current.text; input.value = ''; box.classList.add('open'); render(''); };
    input.oninput = function () { box.classList.add('open'); render(input.value); };
    input.onblur = close;
    input.onkeydown = function (event) {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (!box.classList.contains('open')) { box.classList.add('open'); render(input.value); }
        active = Math.max(0, Math.min(shown.length - 1, active + (event.key === 'ArrowDown' ? 1 : -1)));
        highlight();
        event.preventDefault();
      } else if (event.key === 'Enter') {
        if (shown[active]) { pick(shown[active]); }
        event.preventDefault();
      } else if (event.key === 'Escape') {
        input.blur();
      }
    };
    window.addEventListener('scroll', function () { if (box.classList.contains('open')) { place(); } }, true);
    window.addEventListener('resize', function () { if (box.classList.contains('open')) { place(); } });
    Object.defineProperty(box, 'value', {
      get: function () { return current.value; },
      // null shows "-": no active choice on this filter.
      set: function (value) {
        current = options.filter(function (option) { return option.value === value; })[0] || (value === null ? { value: null, text: '-' } : options[0]);
        // "-" is only a display state: the remembered choice stays the last real one.
        if (key && value !== null) { saveFilter(key, current.value); }
        close();
      }
    });
    close();
    return box;
  }
  function nameCell(name) {
    var raider = raiderByName(name);
    var td = el('td', { text: name });
    td.style.color = raider ? (classColor[raider.className] || '') : '';
    td.style.fontWeight = 'bold';
    return td;
  }
  function table(headers, rows) {
    return sortable(el('table', {}, [el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }))]), el('tbody', {}, rows)]));
  }
  // Click a header to sort its column; cells may carry data-sort when the shown text does not sort right. Empty cells stay last.
  function sortable(node) {
    var heads = node.tHead.rows[0].cells;
    var original = Array.prototype.slice.call(node.tBodies[0].rows);
    Array.prototype.forEach.call(heads, function (th, column) {
      th.classList.add('sortable');
      // Ascending, then descending, then back to the original order.
      th.onclick = function () {
        var current = th.getAttribute('data-dir');
        var next = current === 'asc' ? 'desc' : current === 'desc' ? '' : 'asc';
        Array.prototype.forEach.call(heads, function (other) { other.removeAttribute('data-dir'); });
        if (next) { th.setAttribute('data-dir', next); }
        var body = node.tBodies[0];
        Array.prototype.slice.call(body.rows).map(function (row) {
          var cell = row.cells[column];
          var key = cell ? (cell.hasAttribute('data-sort') ? cell.getAttribute('data-sort') : cell.textContent.trim()) : '';
          return { row: row, key: key, index: original.indexOf(row) };
        }).sort(function (a, b) {
          if (!next) { return a.index - b.index; }
          if ((a.key === '') !== (b.key === '')) { return a.key === '' ? 1 : -1; }
          var order = a.key !== '' && !isNaN(Number(a.key)) && !isNaN(Number(b.key)) ? Number(a.key) - Number(b.key)
            : a.key.localeCompare(b.key, 'fr', { numeric: true, sensitivity: 'base' });
          return (next === 'asc' ? order : -order) || a.index - b.index;
        }).forEach(function (entry) { body.appendChild(entry.row); });
      };
    });
    return node;
  }
  var wowheadPending = false;
  // Wowhead colours and iconizes links once scanned; rescan after each render.
  function refreshWowhead() {
    if (wowheadPending) { return; }
    wowheadPending = true;
    setTimeout(function () {
      wowheadPending = false;
      var api = (window.WH && window.WH.Tooltips) || window.$WowheadPower;
      if (api && api.refreshLinks) { api.refreshLinks(); }
    }, 0);
  }
  function itemLink(itemId, name) {
    var id = parseInt(itemId, 10);
    var label = name || ('#' + itemId);
    if (!(id > 0)) { return el('span', { text: label }); }
    refreshWowhead();
    return el('a', { class: 'item', href: 'https://www.wowhead.com/' + DATA.wowhead + '/item=' + id, target: '_blank', rel: 'noopener', text: label });
  }
  function itemCell(itemId, name) {
    return el('td', { 'data-sort': name || ('#' + itemId) }, [itemLink(itemId, name)]);
  }
  function card(title, content) { return el('div', { class: 'card' }, [title ? el('h2', { text: title }) : null].concat(content)); }
  // Card whose filters sit on the title line, right-aligned (the norm for every tab).
  function filterCard(title, filters, content) {
    return el('div', { class: 'card' }, [el('div', { class: 'card-head' }, [el('h2', { text: title }), el('div', { class: 'filters' }, filters)])].concat(content));
  }
  // Top 5 per item, raiders who already received it left out (same rule as the workbook tab).
  function ranking(item) { return item.scores.filter(function (s) { return !s.owned; }).slice(0, 5); }

  function renderNav() {
    var nav = document.getElementById('nav');
    var tabButton = function (tab) { return tabLink(el('button', { text: tab[1], 'data-tab': tab[0] }), tab[0]); };
    var navTabs = TABS.filter(function (tab) { return tab[0] !== 'perso'; });
    navTabs.filter(function (tab) { return NAV_RIGHT.indexOf(tab[0]) === -1; }).forEach(function (tab) { nav.appendChild(tabButton(tab)); });
    nav.appendChild(el('span', { class: 'spacer' }));
    navTabs.filter(function (tab) { return NAV_RIGHT.indexOf(tab[0]) !== -1; }).forEach(function (tab) { nav.appendChild(tabButton(tab)); });
    tabLink(document.querySelector('header .header-tab'), 'perso');
    show('roster');
    if (window.google && google.script.url) {
      google.script.url.getLocation(function (location) {
        var wanted = location.parameter && location.parameter.tab;
        if (TABS.some(function (tab) { return tab[0] === wanted; })) { show(wanted); }
      });
    }
  }
  // Click shows the tab here; middle-click or Ctrl/Cmd-click opens it in a new browser tab.
  function tabLink(button, id) {
    var openNew = function () { if (DATA.url) { window.open(DATA.url + '?tab=' + encodeURIComponent(id), '_blank', 'noopener'); } };
    button.onclick = function (event) { if (event.ctrlKey || event.metaKey) { openNew(); } else { show(id); } };
    button.onauxclick = function (event) { if (event.button === 1) { event.preventDefault(); openNew(); } };
    button.onmousedown = function (event) { if (event.button === 1) { event.preventDefault(); } };
    return button;
  }
  function show(id) {
    TABS.forEach(function (tab) {
      document.getElementById(tab[0]).classList.toggle('active', tab[0] === id);
    });
    Array.prototype.forEach.call(document.querySelectorAll('button[data-tab]'), function (button) {
      button.classList.toggle('active', button.getAttribute('data-tab') === id);
    });
  }

  function renderPerso() {
    var section = document.getElementById('perso');
    var saved = localStorage.getItem('preloot-raider') || '';
    var select = combo(raiderOptions('Choisis ton personnage'), function () { localStorage.setItem('preloot-raider', select.value); fill(); });
    select.value = raiderByName(saved) ? saved : '';
    var body = el('div');
    var armory = el('a', { class: 'toggle', target: '_blank', rel: 'noopener', title: 'Voir sur l\'Armory Blizzard', text: 'Voir la fiche Armory' });
    section.appendChild(card('', [select, armory, body]));

    function fill() {
      body.innerHTML = '';
      var raider = raiderByName(select.value);
      armory.style.display = raider && DATA.armoryCharacterUrl ? '' : 'none';
      if (!raider) { return; }
      armory.href = DATA.armoryCharacterUrl.replace('{name}', encodeURIComponent(raider.name.toLowerCase()));
      var classSpec = raider.className + ' ' + raider.spec;
      var stats = [
        ['Classe / spé', classSpec], ['Ratio BiS', score(raider.bisRatio)], ['Présence palier', raider.tierPresence + ' / ' + raider.tierPresenceMax],
        ['Loots BiS', raider.bisLootCount], ['Loots Impact', raider.impactLootCount],
        ['Parse WCL', raider.parse, DATA.wclCharacterUrl && DATA.wclCharacterUrl.replace('{name}', encodeURIComponent(raider.name)), 'Voir sur Warcraft Logs']
      ];
      body.appendChild(el('div', { class: 'stats' }, stats.map(function (pair) {
        var value = el('div', { class: 'value', text: String(pair[1]) });
        var link = pair[2];
        var box = el(link ? 'a' : 'div', { class: 'stat' + (link ? ' link' : '') }, [el('div', { class: 'label', text: pair[0] }), value]);
        if (pair[0] === 'Parse WCL') { paintParse(value, raider.parse); parseTip(box, raider); }
        if (pair[0] === 'Ratio BiS') { ratioTip(box, raider); }
        if (link) {
          box.href = link;
          box.target = '_blank';
          box.rel = 'noopener';
          box.title = pair[3];
        }
        if (pair[0] === 'Classe / spé' && classFill[raider.className]) {
          box.style.background = classFill[raider.className].fill;
          box.style.color = classFill[raider.className].fillText;
          box.firstChild.style.color = classFill[raider.className].fillText;
        }
        return box;
      })));

      var myLoots = DATA.loots.filter(function (loot) { return loot.raider === raider.name; });
      body.appendChild(card('Mes loots du palier', [myLoots.length ? el('div', { class: 'scroll' }, [lootTable(myLoots, false, raider)]) : el('p', { class: 'muted', text: 'Aucun loot ce palier.' })]));

      var impactRows = [];
      DATA.items.forEach(function (item) {
        var mine = item.scores.filter(function (s) { return s.name === raider.name; })[0];
        if (!mine || mine.owned) { return; }
        var rank = item.scores.filter(function (s) { return !s.owned; }).indexOf(mine) + 1;
        impactRows.push({ item: item, score: mine.score, rank: rank });
      });
      impactRows.sort(function (a, b) { return a.rank - b.rank || b.score - a.score; });
      body.appendChild(itemFilterCard('Items à impact du palier', impactRows, function (row) { return row.item; }, function (rows) {
        return table(['Objet', 'Mon score', 'Mon rang', '1er'], rows.map(function (row) {
          var first = ranking(row.item)[0];
          return el('tr', {}, [itemCell(row.item.itemId, row.item.name), el('td', { class: 'num', text: score(row.score) }),
            el('td', { class: 'num' + (row.rank <= 3 ? ' medal' + row.rank : ''), text: String(row.rank) }), first ? nameCell(first.name) : el('td')]);
        }));
      }, 'Aucun objet Impact pour ta spé.'));

      var statutOf = function (item) {
        var spec = item.specs.filter(function (s) { return s.classSpec === classSpec; })[0];
        return spec ? spec.statut : '';
      };
      var bisItems = DATA.items.filter(function (item) {
        return statutOf(item) === 'BIS' || statutOf(item) === 'IMPACT';
      }).sort(function (a, b) {
        return (a.name || '').localeCompare(b.name || '', 'fr', { sensitivity: 'base' });
      });
      // One row per gear slot, empty when nothing yet; IMPACT items come before BIS ones and replace them.
      var bySlots = function (slots) { return bisItems.filter(function (item) { return slots.indexOf(item.slot) !== -1; }); };
      var pick = function (items, size) {
        var impact = items.filter(function (item) { return statutOf(item) === 'IMPACT'; });
        var bis = items.filter(function (item) { return statutOf(item) === 'BIS'; });
        return impact.length ? impact.concat(bis.slice(0, Math.max(0, size - impact.length))) : bis;
      };
      var slotRows = [];
      // One row per gear slot (two for rings and trinkets), several items comma-separated on it.
      var addRows = function (label, items, size) {
        if (size === 2) {

          slotRows.push({ slot: label, items: items.slice(1) });
        } else {
          slotRows.push({ slot: label, items: items });
        }
      };
      BIS_ARMOR_SLOTS.forEach(function (slot) { addRows(slot, pick(bySlots([slot]), slot === 'Doigt' || slot === 'Bijou' ? 2 : 1), slot === 'Doigt' || slot === 'Bijou' ? 2 : 1); });
      // Two weapons and no off-hand item: the second one goes to Main gauche (dual wield).
      var weapons = pick(bySlots(BIS_WEAPON_SLOTS), 1);
      var offHand = pick(bySlots(BIS_OFF_HAND_SLOTS), 1);
      var dualWield = !offHand.length && weapons.length > 1;
      addRows('Arme', dualWield ? weapons.slice(0, 1) : weapons, 1);
      addRows('Main gauche', dualWield ? weapons.slice(1) : offHand, 1);
      addRows(RELIC_CLASSES.indexOf(raider.className) !== -1 ? 'Relique' : 'Distance', pick(bySlots(['Distance', 'Relique']), 1), 1);
      var known = BIS_ARMOR_SLOTS.concat(BIS_WEAPON_SLOTS, BIS_OFF_HAND_SLOTS, ['Distance', 'Relique']);
      var others = bisItems.filter(function (item) { return known.indexOf(item.slot) === -1; });
      others.map(function (item) { return item.slot || '?'; }).filter(function (slot, index, all) { return all.indexOf(slot) === index; }).forEach(function (slot) {
        addRows(slot, pick(others.filter(function (item) { return (item.slot || '?') === slot; }), 1), 1);

      var separated = function (nodes) {

      };
      body.appendChild(itemFilterCard('BiS List', slotRows, function (row) { return row.items; }, function (rows) {
        return detailTable(table(['Emplacement', 'Objet', 'Looté'], rows.map(function (row) {
          // One mark per item, in the same order: the date of its first loot (a tier token counts for its set piece), or a dash.
          var firsts = row.items.map(function (item) {
            return DATA.loots.filter(function (loot) {
              if (loot.raider !== raider.name) { return false; }
              var piece = tokenPiece(loot.itemId, raider);
              return String(loot.itemId) === String(item.itemId) || (piece && String(piece.itemId) === String(item.itemId));
            }).sort(function (a, b) { return String(a.date || '').localeCompare(String(b.date || '')); })[0];
          });
          var looted = firsts.filter(Boolean);
          var lootCell = looted.length ? el('td', { 'data-sort': looted.map(function (loot) { return loot.date || ''; }).sort()[0] || '0' }, separated(firsts.map(function (loot) {
            if (!loot) { return el('span', { class: 'muted', text: '–' }); }

      tip.style.top = top + 'px';
    };
    node.onmouseleave = function () { document.getElementById('tip').style.display = 'none'; };
  }

  function renderRoster() {
    var section = document.getElementById('roster');
    var columns = ['Raider', 'Groupe', 'Classe', 'Spé', 'Rôle', 'Présence', 'Loots BiS', 'Loots Impact', 'Ratio BiS', 'Parse'];
    var raiders = DATA.raiders.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' }); });
    var rows = raiders.map(function (r) {
      return el('tr', {}, [nameCell(r.name), el('td', { text: r.group }), colored(el('td', { text: r.className }), classColor[r.className]),
        colored(el('td', { text: r.spec }), specColor(r.className + ' ' + r.spec)), el('td', { text: ROLE_LABELS[r.role] || r.role }),
        el('td', { class: 'num', 'data-sort': String(r.tierPresence), text: r.tierPresence + ' / ' + r.tierPresenceMax }), el('td', { class: 'num', text: String(r.bisLootCount) }),
        el('td', { class: 'num', text: String(r.impactLootCount) }), ratioCell(r), parseTip(paintParse(el('td', { class: 'num', text: String(r.parse) }), r.parse), r)]);
    });
    section.appendChild(card('Roster', [detailTable(table(columns, rows), ['', 'c', '', '', '', 'c', 'c', 'c', 'c', 'c'])]));
  }

  // Sorted IMPACT, BIS, CLASS_BOUND, ALT everywhere, not alphabetically.
  var TREATMENT_ORDER = ['IMPACT', 'BIS', 'CLASS_BOUND', 'ALT'];
  function treatmentCell(treatment) {
    var rank = TREATMENT_ORDER.indexOf(treatment);
    return el('td', { class: 't-' + treatment, 'data-sort': String(rank === -1 ? TREATMENT_ORDER.length : rank), text: treatment });
  }
  // raider (optional): a tier token is shown as "token → set piece"; the loot keeps its Statut.
  function lootTable(loots, withRaider, raider) {
    return table(['Date'].concat(withRaider ? ['Raider'] : []).concat(['Objet', 'Statut']), loots.map(function (loot) {
      var piece = raider ? tokenPiece(loot.itemId, raider) : null;
      var objet = piece
        ? el('td', { 'data-sort': loot.itemName || '' }, [itemLink(loot.itemId, loot.itemName), el('span', { class: 'muted', text: ' → ' }), itemLink(piece.itemId, piece.name)])
        : itemCell(loot.itemId, loot.itemName);
      return el('tr', {}, [el('td', { 'data-sort': loot.date || '', text: frDate(loot.date) })].concat(withRaider ? [nameCell(loot.raider)] : []).concat([
        objet, treatmentCell(loot.treatment)]));
    }));
  }
  // The set piece a tier token becomes for this raider's spec, in the active game version; null otherwise.
  function tokenPiece(itemId, raider) {
    var tokens = TOKEN_PIECES_BY_VERSION[DATA.wowhead];
    var piece = tokens && tokens[itemId] && tokens[itemId][raider.className + ' ' + raider.spec];
    return piece ? { itemId: piece[0], name: piece[1] } : null;
  }
  function renderLoots() {
    var section = document.getElementById('loots');
    var mode = 'raid';
    var view = el('button', { class: 'toggle', text: 'Par raid', onclick: function () {
      mode = mode === 'raid' ? 'list' : 'raid';
      view.textContent = mode === 'raid' ? 'Par raid' : 'Liste';
      fill();
    } });
    var raidById = {};
    DATA.raids.forEach(function (raid) { raidById[raid.raidId] = raid; });
    function raidTitle(raidId) {
      var raid = raidById[raidId];
      return raid ? (raid.instance || 'Raid ' + raidId) + ' du ' + frDate(raid.date) : (raidId ? 'Raid ' + raidId : 'Raid inconnu');
    }
    var raidSelect = combo([{ value: '', text: 'Tous les raids' }].concat(DATA.raids.map(function (raid) { return { value: raid.raidId, text: raidTitle(raid.raidId) }; })), function () { fill(); }, 'loots-raid');
    var select = combo(raiderOptions('Tous les raiders'), function () { fill(); }, 'loots-raider');
    var holder = el('div');
    section.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'card-head' }, [el('div', { class: 'title-group' }, [el('h2', { text: 'Loots du palier' }), view]), el('div', { class: 'filters' }, [raidSelect, select])]),
      holder
    ]));
    function fill() {
      holder.innerHTML = '';
      var loots = DATA.loots.filter(function (loot) {
        return (!select.value || loot.raider === select.value) && (!raidSelect.value || loot.raidId === raidSelect.value);
      });
      if (!loots.length) {
        holder.appendChild(el('p', { class: 'muted', text: 'Aucun loot.' }));
      } else if (mode === 'list') {
        holder.appendChild(lootTable(loots, true));
      } else {
        // Raids newest first, then loots of an unknown raid.
        var groups = DATA.raids.map(function (raid) { return raid.raidId; });
        loots.forEach(function (loot) { if (groups.indexOf(loot.raidId) === -1) { groups.push(loot.raidId); } });
        groups.forEach(function (raidId) {
          var raidLoots = loots.filter(function (loot) { return loot.raidId === raidId; });
          if (!raidLoots.length) { return; }
          holder.appendChild(card(raidTitle(raidId) + ' (' + raidLoots.length + ')', [table(['Raider', 'Objet', 'Statut'], raidLoots.map(function (loot) {
            return el('tr', {}, [nameCell(loot.raider), itemCell(loot.itemId, loot.itemName), treatmentCell(loot.treatment)]);
          }))]));
        });
      }
    }
    fill();
  }

  function renderPresence() {
    var section = document.getElementById('presence');
    if (!DATA.raids.length) {
      section.appendChild(card('Présence du palier', [el('p', { class: 'muted', text: 'Aucun raid ce palier.' })]));
      return;
    }
    var raids = DATA.raids.slice().reverse();
    var head = ['Raider', 'Total'].concat(raids.map(function (raid) { return frDate(raid.date).slice(0, 5) || raid.raidId; }));
    var rows = DATA.raiders.map(function (r) {
      var cells = raids.map(function (raid) {
        var value = raid.presence[r.name];
        return el('td', { class: value === '1' ? 'P' : value === 'B' ? 'B' : 'A', text: value === '1' ? 'P' : value || '', title: raid.instance + ' ' + frDate(raid.date) });
      });
      return el('tr', {}, [nameCell(r.name), el('td', { class: 'num', 'data-sort': String(r.tierPresence), text: r.tierPresence + ' / ' + r.tierPresenceMax })].concat(cells));
    });
    section.appendChild(card('Présence du palier', [detailTable(table(head, rows), ['', 'c'])]));
  }

  // One table per role, like the workbook's Objets tabs: an item row, then Statut and gain for each spec of the role.
  // Picking an item instead lists every spec, of any role, that has it.
  function renderObjets() {
    var section = document.getElementById('objets');
    var select = combo(roleOptions(), function () {
      roleFilter = select.value;
      specFilter = '';
      itemSelect.value = '';
      filterSpecs();
      filterItems();
      showFilters();
      fill();
    }, 'objets-role');
    var specOptions = [];
    DATA.roles.forEach(function (role) {
      role.specs.forEach(function (label) { specOptions.push({ value: label, text: label, color: classColor[label.split(' ')[0]], role: role.role }); });
    });
    // The spec list follows the last role picked, and the item list the last spec (else role) picked, even while those filters show "-".
    var roleFilter = savedFilter('objets-role');
    var specFilter = savedFilter('objets-spec');
    var specChoices = [{ value: '', text: 'Toutes les spés' }];
    function filterSpecs() {
      specChoices.splice.apply(specChoices, [1, specChoices.length - 1].concat(specOptions.filter(function (option) {
        return !roleFilter || option.role === roleFilter;
      })));
    }
    filterSpecs();
    // A narrower pick keeps the wider ones: spec inside a role, item inside a spec or a role.
    var specSelect = combo(specChoices, function () {
      specFilter = specSelect.value;
      itemSelect.value = '';
      filterItems();
      showFilters();
      fill();
    }, 'objets-spec');
    var itemOptions = DATA.items.filter(function (item) { return item.specs.length; }).map(function (item) {
      return { value: String(item.itemId), text: item.name || ('#' + item.itemId), item: item };
    }).sort(function (a, b) { return a.text.localeCompare(b.text, 'fr', { sensitivity: 'base' }); });
    var itemChoices = [{ value: '', text: 'Tous les objets' }];
    function filterItems() {
      var role = DATA.roles.filter(function (r) { return r.role === roleFilter; })[0];
      var labels = specFilter ? [specFilter] : role ? role.specs : null;
      itemChoices.splice.apply(itemChoices, [1, itemChoices.length - 1].concat(itemOptions.filter(function (option) {
        return !labels || option.item.specs.some(function (spec) { return labels.indexOf(spec.classSpec) !== -1; });
      })));
    }
    filterItems();
    var itemSelect = combo(itemChoices, function () {
      showFilters();
      fill();
    }, 'objets-item');
    // A filter with nothing chosen shows "-" once a narrower filter is in use.
    function showFilters() {
      var narrowed = Boolean(itemSelect.value);
      specSelect.value = specFilter || (narrowed ? null : '');
      select.value = roleFilter || (narrowed || specFilter ? null : '');
    }
    var holder = el('div');
    section.appendChild(filterCard('Objets du palier', [select, specSelect, itemSelect], [holder]));
    roleFilter = select.value;
    specFilter = specSelect.value;
    showFilters();
    function specFill(node, label) {
      var className = label.split(' ')[0];
      var entry = classFill[className];
      node.title = label;
      node.textContent = label.slice(className.length + 1);
      if (entry) { node.style.background = entry.fill; node.style.color = entry.fillText; }
      return node;
    }
    function fillItem(item) {
      var rows = [];
      DATA.roles.forEach(function (role) {
        role.specs.forEach(function (label) {
          var spec = item.specs.filter(function (s) { return s.classSpec === label; })[0];
          if (!spec) { return; }
          var hasGain = spec.statut === 'IMPACT' && spec.gainDps !== null;
          var gainCell = el('td', { class: 'num', text: hasGain ? Number(spec.gainDps).toFixed(1) : '' });
          if (hasGain) { paintGain(gainCell, item, Number(spec.gainDps)); }
          rows.push(el('tr', {}, [specFill(el('td', { 'data-sort': label }), label), el('td', { text: role.role }),
            treatmentCell(spec.statut), gainCell]));
        });
      });
      holder.appendChild(card('Objet', [table(['Objet', 'Emplacement'], [el('tr', {}, [itemCell(item.itemId, item.name), el('td', { text: item.slot })])])]));
      holder.appendChild(card(rows.length + (rows.length > 1 ? ' spés' : ' spé'), [detailTable(table(['Spé', 'Rôle', 'Statut', 'Gain (DPS)'], rows), ['fit', '', '', 'r'])]));
    }
    function fill() {
      holder.innerHTML = '';
      var picked = DATA.items.filter(function (item) { return String(item.itemId) === itemSelect.value; })[0];
      if (picked) { fillItem(picked); return; }
      if (specSelect.value) { fillSpec(specSelect.value); return; }
      if (!select.value) {
        // Tous les rôles: one table per role that has items.
        var grids = DATA.roles.map(function (role) { var grid = roleGrid(role); return grid ? card(role.role, [grid]) : null; }).filter(Boolean);
        if (!grids.length) { holder.appendChild(el('p', { class: 'muted', text: 'Aucun objet.' })); }
        grids.forEach(function (node) { holder.appendChild(node); });
        return;
      }
      var grid = roleGrid(DATA.roles.filter(function (r) { return r.role === select.value; })[0]);
      holder.appendChild(grid || el('p', { class: 'muted', text: 'Aucun objet.' }));
    }
    // One spec: every item it has a Statut for, in BiS List slot order.
    function fillSpec(label) {
      var items = DATA.items.filter(function (item) { return item.specs.some(function (s) { return s.classSpec === label; }); })
        .sort(function (a, b) { return slotOrder(a.slot) - slotOrder(b.slot) || (a.name || '').localeCompare(b.name || '', 'fr', { sensitivity: 'base' }); });
      if (!items.length) { holder.appendChild(el('p', { class: 'muted', text: 'Aucun objet.' })); return; }
      var rows = items.map(function (item) {
        var spec = item.specs.filter(function (s) { return s.classSpec === label; })[0];
        var hasGain = spec.statut === 'IMPACT' && spec.gainDps !== null;
        var gainCell = el('td', { class: 'num', text: hasGain ? Number(spec.gainDps).toFixed(1) : '' });
        if (hasGain) { paintGain(gainCell, item, Number(spec.gainDps)); }
        return el('tr', {}, [itemCell(item.itemId, item.name), el('td', { 'data-sort': String(slotOrder(item.slot)), text: item.slot }), treatmentCell(spec.statut), gainCell]);
      });
      var title = el('h2', { text: label + ' (' + items.length + ')' });
      title.style.color = classColor[label.split(' ')[0]] || '';
      holder.appendChild(el('div', { class: 'card' }, [title, detailTable(table(['Objet', 'Emplacement', 'Statut', 'Gain (DPS)'], rows), ['', '', '', 'r'])]));
    }
    function roleGrid(role) {
      var rows = DATA.items.filter(function (item) {
        return item.specs.some(function (spec) { return role.specs.indexOf(spec.classSpec) !== -1; });
      }).sort(function (a, b) {
        return slotOrder(a.slot) - slotOrder(b.slot) || (a.name || '').localeCompare(b.name || '', 'fr', { sensitivity: 'base' });
      }).map(function (item) {
        var bySpec = {};
        item.specs.forEach(function (spec) { bySpec[spec.classSpec] = spec; });
        return el('tr', {}, [itemCell(item.itemId, item.name), el('td', { 'data-sort': String(slotOrder(item.slot)), text: item.slot })].concat(role.specs.map(function (label) {
          var spec = bySpec[label];
          return spec ? treatmentCell(spec.statut) : el('td', {});
        })));
      });
      if (!rows.length) { return null; }
      var grid = table(['Objet', 'Emplacement'].concat(role.specs), rows);
      // Spec headers on their WoW class colour, like the Roster Classe cells; the colour names the class, so only the spec is written.
      Array.prototype.slice.call(grid.querySelectorAll('th'), 2).forEach(function (th) { specFill(th, th.textContent); });
      return grid;
    }
    fill();
  }

  google.script.run
    .withSuccessHandler(function (data) {
      DATA = data;
      // The dark theme takes the raw WoW class colours; the light one the readable header variants.
      data.classes.forEach(function (entry) { classColor[entry.name] = DARK ? entry.fill : entry.color; classFill[entry.name] = entry; });
      document.getElementById('status').remove();
      renderNav();
      renderPerso();
      renderClassement();
      renderRoster();
      renderLoots();
      renderPresence();
      renderObjets();
    })
    .withFailureHandler(function (error) {
      document.getElementById('status').textContent = 'Chargement impossible : ' + (error && error.message ? error.message : error);
    })
    .getRaiderPortalData();
</script>
</body>
</html>
