<style>
  :root { --bg: #f4f6f9; --card: #fff; --line: #dde3ea; --head: #dce9f7; --headText: #0b4f9c; --muted: #66707c; }

  :root { --tan: #c8b08a; --teal: #11678a; --cream: #fff5e1; --tealDark: #0b4f6b; --tanDark: #9c8460;
    --bg: #f4e7cc; --card: var(--cream); --line: #e3d3b4; --head: var(--teal); --headText: var(--cream); --muted: #6b6255; --gold: var(--tan); --ink: #22201c; --blue: var(--teal); --navy: var(--tealDark);

  nav { background: #083d53; border-bottom: 1px solid var(--tanDark); }

  input:focus { outline: 2px solid var(--teal); outline-offset: 0; }

  header { align-items: center; justify-content: space-between; }

  header .perso-tab:hover { background: rgba(255, 255, 255, .08); }

  nav .spacer { flex: 1; }

  .item-card ol { margin: 0; padding: 0; list-style: none; }

  .item-card .rk { width: 1.6em; color: var(--muted); }
  .item-card .nm { flex: 1; }

  /* Dark theme (forever.css palette), only when <html class="dark">. */
  html.dark { color-scheme: dark; --ink: #ecf2f5; --muted: #8fa9b8; --line: #26475f; }
  html.dark body { color: #ecf2f5; background: #0a1620 radial-gradient(120% 600px at 50% 0, #0e2232 0%, #0a1620 70%) no-repeat fixed; }

  html.dark button.toggle:hover, html.dark a.toggle:hover { filter: none; color: #fff; background: #1683b8; }
  html.dark .t-BIS { color: #b569f5; } html.dark .t-IMPACT { color: #ff8000; } html.dark .t-CLASS_BOUND { color: #3d8bff; } html.dark .t-NORMAL { color: #1eff00; }
  html.dark .P { color: #6fcf7f; background: rgba(111, 207, 127, .15); } html.dark .B { color: #e5a83b; background: rgba(229, 168, 59, .15); } html.dark .A { background: rgba(224, 96, 90, .12); }
  html.dark .rank1 { background: rgba(216, 178, 90, .3); } html.dark .rank2 { background: rgba(200, 210, 220, .18); } html.dark .rank3 { background: rgba(205, 127, 50, .28); }
  html.dark #tip { background: #183247; border-color: #26475f; }
  html.dark #tip .f { color: #2aa8dc; }
  html.dark .item-card { background: #183247; border-color: #26475f; }
  html.dark #status { color: #8fa9b8; }
  .medal1, .medal2, .medal3 { font-weight: bold; }
  .medal1 { color: #d8b25a; } .medal2 { color: #c3ccd4; } .medal3 { color: #cd8a4a; }

<body>
<header><h1>Parsimonie</h1><button class="perso-tab" data-tab="perso">Mon personnage</button></header>
<nav id="nav"></nav>
<main>
  <div id="status">Chargement…</div>
  <div id="tip"></div>
  <section id="perso"></section>
  <section id="classement"></section>
  <section id="roster"></section>
  <section id="loots"></section>
  <section id="presence"></section>
  <section id="objets"></section>
</main>
<script>
  var TABS = [['perso', 'Mon personnage'], ['roster', 'Roster'], ['classement', 'Classement Impact'], ['objets', 'Objets'], ['loots', 'Loots'], ['presence', 'Présence']];
  // Nav tabs pushed to the right end of the bar; Mon personnage lives in the header.
  var NAV_RIGHT = ['loots', 'presence'];
  // Dark theme switch: add class="dark" on <html>.
  var DARK = document.documentElement.classList.contains('dark');
  var DATA = null;
  var ROLE_LABELS = { TANK: 'Tank', HEALER: 'Heal', DPS: 'DPS' };
  // Dominant hue of each spec's talent tree art, darkened to stay readable on white.
  var SPEC_COLORS = {
    'Guerrier Armes': '#8B5A2B', 'Guerrier Fureur': '#B22222', 'Guerrier Protection': '#4A6A8A',
    'Paladin Sacré': '#B8860B', 'Paladin Protection': '#3B6EA5', 'Paladin Vindicte': '#C0392B',
    'Chasseur Maîtrise des bêtes': '#A0522D', 'Chasseur Précision': '#2E7D6B', 'Chasseur Survie': '#4E7D2B',
    'Voleur Assassinat': '#3C8D2F', 'Voleur Combat': '#A33B2A', 'Voleur Finesse': '#5B3A8C',
    'Prêtre Discipline': '#7A8CA0', 'Prêtre Sacré': '#C8A02E', 'Prêtre Ombre': '#6A2C91',
    'Chaman Élémentaire': '#2E6DB4', 'Chaman Amélioration': '#B5531B', 'Chaman Restauration': '#1F8A8A',
    'Mage Arcanes': '#9B3FB5', 'Mage Feu': '#D2491F', 'Mage Givre': '#2A7FBF',
    'Démoniste Affliction': '#4D8B2A', 'Démoniste Démonologie': '#6B3FA0', 'Démoniste Destruction': '#C0392B',
    'Druide Équilibre': '#4B5BA8', 'Druide Combat farouche (ours)': '#B5651D', 'Druide Combat farouche (félin)': '#B5651D', 'Druide Restauration': '#2E8B3E'
  };
  function colored(td, color) { td.style.color = color || ''; return td; }
  // On the dark theme the talent-tree colours are lifted halfway to white to stay readable.
  function specColor(key) {
    var hex = SPEC_COLORS[key];
    if (!hex || !DARK) { return hex; }
    var channels = [1, 3, 5].map(function (i) { return Math.round((parseInt(hex.slice(i, i + 2), 16) + 255) / 2); });
    return 'rgb(' + channels.join(', ') + ')';
  }
  // Short spec names for tight spots; specs not listed are already short.
  var SPEC_SHORT = {
    'Protection': 'Prot', 'Maîtrise des bêtes': 'BM', 'Précision': 'Préci', 'Assassinat': 'Assa', 'Discipline': 'Disci', 'Vindicte': 'Ret', 'Finesse': 'Sub',
    'Élémentaire': 'Élém', 'Amélioration': 'Amélio', 'Restauration': 'Resto', 'Affliction': 'Affli', 'Démonologie': 'Démono',
    'Destruction': 'Destru', 'Équilibre': 'Boomie', 'Combat farouche (ours)': 'Ours', 'Combat farouche (félin)': 'Feral'
  };
  var classColor = {};
  var classFill = {};

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === 'text') { node.textContent = attrs[key]; } else if (key === 'onclick' || key === 'onchange' || key === 'oninput') { node[key] = attrs[key]; } else { node.setAttribute(key, attrs[key]); }
    });
    (children || []).forEach(function (child) { if (child) { node.appendChild(child); } });
    return node;
  }
  function frDate(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
  function score(value) { return Number(value).toFixed(3); }
  // Same bands as the Roster's WCL parse colours.
  function parseColor(value) {
    var band = DATA.parseColors.filter(function (b) { return (b.min === null || value >= b.min) && (b.max === null || value < b.max); })[0];
    return band ? band.color : '';
  }
  function paintParse(node, value) { node.style.color = parseColor(value); node.style.fontWeight = 'bold'; return node; }
  // Red (lowest) → yellow → green (highest) among the item's IMPACT gains.
  function paintGain(node, item, value) {
    var gains = item.specs.filter(function (s) { return s.statut === 'IMPACT' && s.gainDps !== null; }).map(function (s) { return Number(s.gainDps); });
    var low = Math.min.apply(null, gains);
    var high = Math.max.apply(null, gains);
    var ratio = high > low ? (value - low) / (high - low) : 1;
    node.style.color = 'hsl(' + Math.round(ratio * 120) + ', 80%, ' + (DARK ? 60 : 36) + '%)';
    node.style.fontWeight = 'bold';
    return node;
  }
  function raiderByName(name) { return DATA.raiders.filter(function (r) { return r.name === name; })[0]; }
  function raiderOptions(firstLabel) {
    var names = DATA.raiders.map(function (r) { return r.name; }).sort(function (a, b) { return a.localeCompare(b, 'fr', { sensitivity: 'base' }); });
    return [{ value: '', text: firstLabel }].concat(names.map(function (name) { return { value: name, text: name, color: classColor[raiderByName(name).className] || '' }; }));
  }
  function fold(text) { return String(text).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  // Typeable dropdown: typing filters the entries, the full list still scrolls. options: [{ value, text, color }].
  function combo(options, onchange) {
    var input = el('input', { type: 'text', autocomplete: 'off' });
    var list = el('ul');
    var box = el('div', { class: 'combo' }, [input, list]);
    var current = options[0];
    var shown = [];
    var active = -1;
    function label(option) { return option.value === '' ? '' : option.text; }
    function place() {
      var rect = input.getBoundingClientRect();
      list.style.left = rect.left + 'px';
      list.style.top = (rect.bottom + 2) + 'px';
      list.style.minWidth = rect.width + 'px';
    }
    function highlight() {
      Array.prototype.forEach.call(list.children, function (li, index) { li.classList.toggle('hl', index === active); });
      if (list.children[active]) { list.children[active].scrollIntoView({ block: 'nearest' }); }
    }
    function render(query) {
      var folded = fold(query.trim());
      list.innerHTML = '';
      shown = options.filter(function (option) { return !folded || fold(option.text).indexOf(folded) !== -1; });
      active = folded ? (shown.length ? 0 : -1) : shown.indexOf(current);
      shown.forEach(function (option) {
        var li = el('li', { text: option.text });
        if (option.color) { li.style.color = option.color; }
        li.onmousedown = function (event) { event.preventDefault(); pick(option); };
        list.appendChild(li);
      });
      place();
      highlight();
    }
    function close() {
      box.classList.remove('open');
      input.value = label(current);
      input.placeholder = options[0].value === '' ? options[0].text : '';
    }
    function pick(option) {
      var changed = option !== current;
      current = option;
      input.blur();
      close();
      if (changed) { onchange(); }
    }
    input.onfocus = function () { input.placeholder = current.text; input.value = ''; box.classList.add('open'); render(''); };
    input.oninput = function () { box.classList.add('open'); render(input.value); };
    input.onblur = close;
    input.onkeydown = function (event) {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (!box.classList.contains('open')) { box.classList.add('open'); render(input.value); }
        active = Math.max(0, Math.min(shown.length - 1, active + (event.key === 'ArrowDown' ? 1 : -1)));
        highlight();
        event.preventDefault();
      } else if (event.key === 'Enter') {
        if (shown[active]) { pick(shown[active]); }
        event.preventDefault();
      } else if (event.key === 'Escape') {
        input.blur();
      }
    };
    window.addEventListener('scroll', function () { if (box.classList.contains('open')) { place(); } }, true);
    window.addEventListener('resize', function () { if (box.classList.contains('open')) { place(); } });
    Object.defineProperty(box, 'value', {
      get: function () { return current.value; },
      // null shows "-": no active choice on this filter.
      set: function (value) { current = options.filter(function (option) { return option.value === value; })[0] || (value === null ? { value: null, text: '-' } : options[0]); close(); }
    });
    close();
    return box;
  }
  function nameCell(name) {
    var raider = raiderByName(name);
    var td = el('td', { text: name });
    td.style.color = raider ? (classColor[raider.className] || '') : '';
    td.style.fontWeight = 'bold';
    return td;
  }
  function table(headers, rows) {
    return sortable(el('table', {}, [el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }))]), el('tbody', {}, rows)]));
  }
  // Click a header to sort its column; cells may carry data-sort when the shown text does not sort right. Empty cells stay last.
  function sortable(node) {
    var heads = node.tHead.rows[0].cells;
